esactivar*','mostrar precio/variante','aparece al hacer scroll']},\n {n:14,name:'Footer',tag:'footer.liquid',purpose:'Mismo footer del home.',s:['menús','newsletter','redes','pagos','legal']},\n];\nconst grid=document.getElementById('modgrid');\ngrid.innerHTML=MODS.map(m=&gt;`\n &lt;div class=&quot;mod sketch&quot;&gt;\n   &lt;div class=&quot;mh&quot;&gt;&lt;span class=&quot;mn&quot;&gt;${m.n}&lt;/span&gt;&lt;div&gt;&lt;h3&gt;${m.name}&lt;/h3&gt;&lt;span class=&quot;mtag&quot;&gt;${m.tag}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\n   &lt;p class=&quot;purpose&quot;&gt;${m.purpose}&lt;/p&gt;\n   &lt;p class=&quot;slabel&quot;&gt;Settings&lt;/p&gt;\n   &lt;ul&gt;${m.s.map(x=&gt;{const b=x.startsWith('*');const t=x.replace(/\\*/g,'');return `&lt;li class=&quot;${b?'blk':''}&quot;&gt;${t}&lt;/li&gt;`;}).join('')}&lt;/ul&gt;\n &lt;/div&gt;`).join('');\n\nsetView(localStorage.getItem('pdp_view')||'desktop');\napplyToggles();\nnumberSections();\n&lt;/script&gt;\n\n&lt;template id=&quot;__bundler_thumbnail&quot;&gt;\n&lt;svg viewBox=&quot;0 0 100 100&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;&lt;rect width=&quot;100&quot; height=&quot;100&quot; fill=&quot;#f4f3ef&quot;/&gt;&lt;g stroke=&quot;#3a3a3a&quot; stroke-width=&quot;2.4&quot; fill=&quot;none&quot;&gt;&lt;rect x=&quot;22&quot; y=&quot;28&quot; width=&quot;26&quot; height=&quot;44&quot; rx=&quot;3&quot; fill=&quot;#e9e8e4&quot;/&gt;&lt;line x1=&quot;54&quot; y1=&quot;32&quot; x2=&quot;78&quot; y2=&quot;32&quot;/&gt;&lt;line x1=&quot;54&quot; y1=&quot;40&quot; x2=&quot;72&quot; y2=&quot;40&quot;/&gt;&lt;rect x=&quot;54&quot; y=&quot;50&quot; width=&quot;24&quot; height=&quot;9&quot; rx=&quot;2&quot;/&gt;&lt;rect x=&quot;54&quot; y=&quot;62&quot; width=&quot;24&quot; height=&quot;10&quot; rx=&quot;2&quot; fill=&quot;#3a3a3a&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;\n&lt;/template&gt;\n\n&lt;/body&gt;\n&lt;/html&gt;\n\">\u003c/iframe>\u003c/div>\u003c/section>\u003csection class=\"view\" data-view=\"4\">\u003cdiv class=\"vhead\">\u003cdiv class=\"vh-l\">\u003cspan class=\"vnum\">05\u003c/span>\u003cdiv>\u003ch2>Carrito\u003c/h2>\u003cp>El carrito y el paso previo al pago, con resumen del pedido y sugerencias para subir el ticket.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"vbody\">\u003ciframe loading=\"lazy\" title=\"Carrito\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;es&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;Cart — Wireframe&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;style&gt;/* ============================================================\n   Low-fi wireframe system — Excalidraw / hand-drawn vibe\n   Grayscale wireframe + single accent for CRO sticky-notes\n   ============================================================ */\n\n:root{\n  --canvas:#f4f3ef;\n  --paper:#ffffff;\n  --ink:#2b2b2b;\n  --stroke:#3a3a3a;\n  --stroke-soft:#8c8c8c;\n  --fill:#e9e8e4;\n  --fill-2:#dedcd6;\n  --muted:#9a9a96;\n  --note:#fff3bf;        /* sticky note */\n  --note-ink:#5b4b00;\n  --note-edge:#e2cf6b;\n  --accent:#1971c2;      /* arrows / pin */\n  --r:7px;\n}\n\n*{box-sizing:border-box;}\nhtml,body{margin:0;padding:0;}\nbody{\n  background:var(--canvas);\n  color:var(--ink);\n  font-family:'Kalam', 'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Sans MS', cursive;\n  -webkit-font-smoothing:antialiased;\n  /* faint grid like a sketch canvas */\n  background-image:\n    linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(0,0,0,.025) 1px, transparent 1px);\n  background-size:26px 26px;\n}\n\n/* ---------- hand-drawn border via displacement filter ---------- */\n.sketch{position:relative;}\n.sketch::before{\n  content:&quot;&quot;;\n  position:absolute; inset:0;\n  border:1.7px solid var(--stroke);\n  border-radius:9px 7px 10px 8px / 8px 10px 7px 9px;\n  filter:url(#rough);\n  pointer-events:none;\n}\n.sketch.soft::before{border-color:var(--stroke-soft);}\n.sketch.dash::before{border-style:dashed;}\n\n/* ---------- image placeholder ---------- */\n.img{\n  background:var(--fill);\n  background-image:\n    linear-gradient(to top right, transparent calc(50% - .9px), var(--stroke-soft) calc(50% - .9px), var(--stroke-soft) calc(50% + .9px), transparent calc(50% + .9px)),\n    linear-gradient(to top left,  transparent calc(50% - .9px), var(--stroke-soft) calc(50% - .9px), var(--stroke-soft) calc(50% + .9px), transparent calc(50% + .9px));\n  display:flex; align-items:center; justify-content:center;\n  color:var(--muted); font-size:13px; letter-spacing:.5px;\n  min-height:60px; overflow:hidden;\n}\n.img span{background:var(--fill); padding:2px 8px; border-radius:4px;}\n.img.tall{min-height:240px;}\n\n/* ---------- text placeholders ---------- */\n.bar{height:9px;background:var(--fill-2);border-radius:6px;margin:7px 0;}\n.bar.dark{background:#cfcdc6;}\n.h{font-weight:700;line-height:1.12;color:var(--ink);}\n.h1{font-size:30px;}\n.h2{font-size:22px;}\n.h3{font-size:17px;}\n.sub{font-size:14px;color:#6b6b67;line-height:1.3;}\n.tiny{font-size:12px;color:var(--muted);}\n.kicker{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}\n\n/* ---------- buttons ---------- */\n.btn{\n  display:inline-flex;align-items:center;gap:6px;justify-content:center;\n  background:var(--stroke);color:#fff;font-family:inherit;font-size:14px;font-weight:700;\n  padding:10px 18px;border-radius:8px 10px 9px 11px / 11px 9px 10px 8px;\n  position:relative;white-space:nowrap;\n}\n.btn.o{background:transparent;color:var(--ink);}\n.btn.o::before{\n  content:&quot;&quot;;position:absolute;inset:0;border:1.7px solid var(--stroke);\n  border-radius:inherit;filter:url(#rough);\n}\n.btn.sm{padding:6px 12px;font-size:12px;}\n.btn.full{display:flex;width:100%;}\n\n/* ---------- pills / badges / chips ---------- */\n.badge{\n  display:inline-block;font-size:11px;font-weight:700;color:var(--ink);\n  background:var(--paper);padding:3px 9px;border-radius:20px;position:relative;\n}\n.badge::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px solid var(--stroke);border-radius:20px;filter:url(#rough);}\n.chip{\n  display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);\n  background:var(--paper);padding:7px 13px;border-radius:20px;position:relative;white-space:nowrap;\n}\n.chip::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:20px;filter:url(#rough);}\n\n/* ---------- icon placeholder ---------- */\n.ico{\n  width:42px;height:42px;border-radius:50%;background:var(--fill);\n  display:flex;align-items:center;justify-content:center;color:var(--stroke-soft);\n  font-size:18px;position:relative;flex:0 0 auto;\n}\n.ico::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.stars{color:#3a3a3a;letter-spacing:2px;font-size:14px;}\n\n/* ---------- generic blocks ---------- */\n.card{background:var(--paper);padding:12px;border-radius:var(--r);position:relative;}\n.row{display:flex;gap:14px;}\n.col{display:flex;flex-direction:column;}\n.center{align-items:center;text-align:center;}\n.between{justify-content:space-between;align-items:center;}\n.wrap{flex-wrap:wrap;}\n.grow{flex:1 1 0;min-width:0;}\n\n/* ============================================================\n   DEVICE FRAMES\n   ============================================================ */\n.stage{\n  display:flex;flex-direction:column;align-items:center;\n  padding:30px 470px 120px 40px;   /* right padding leaves room for notes */\n}\n@media(max-width:1180px){ .stage{padding-right:40px;} .note{display:none!important;} }\n\n.devwrap{position:relative;}\n\n/* browser chrome (desktop) */\n.browser{width:980px;max-width:100%;background:var(--paper);position:relative;border-radius:12px;}\n.browser&gt;.chrome{\n  height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;\n  border-bottom:1.6px solid var(--fill-2);\n}\n.dot{width:11px;height:11px;border-radius:50%;background:var(--fill-2);}\n.urlbar{flex:1;height:20px;background:var(--fill);border-radius:20px;margin-left:10px;}\n\n/* phone chrome (mobile) */\n.phone{width:392px;max-width:100%;background:var(--paper);position:relative;border-radius:34px;padding:12px;}\n.phone::before{content:&quot;&quot;;position:absolute;inset:0;border:2px solid var(--stroke);border-radius:34px;filter:url(#rough);}\n.phone .screen{border-radius:24px;overflow:hidden;background:var(--paper);position:relative;}\n.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:120px;height:18px;background:var(--stroke);border-radius:20px;z-index:5;}\n\n/* a screen section */\n.section{position:relative;padding:16px;border-bottom:1.4px dashed #e2e0da;}\n.section:last-child{border-bottom:none;}\n.section .secno{\n  position:absolute;left:-13px;top:12px;width:26px;height:26px;border-radius:50%;\n  background:var(--accent);color:#fff;font-size:13px;font-weight:700;\n  display:flex;align-items:center;justify-content:center;z-index:6;\n  box-shadow:0 1px 0 rgba(0,0,0,.15);\n}\n.phone .section .secno{left:-2px;}\n\n/* ---------- CRO sticky notes ---------- */\n.note{\n  position:absolute;left:100%;top:8px;margin-left:54px;width:360px;\n  background:var(--note);color:var(--note-ink);\n  padding:13px 15px 14px;border-radius:3px;\n  box-shadow:2px 3px 0 rgba(0,0,0,.10);\n  transform:rotate(var(--rot,-.5deg)) translateY(var(--ty,0px));font-size:14px;line-height:1.34;\n}\n.note:nth-child(even){--rot:.6deg;}\n.note::before{ /* arrow toward the section */\n  content:&quot;&quot;;position:absolute;right:100%;top:18px;\n  border:9px solid transparent;border-right-color:var(--note);\n  filter:drop-shadow(-1px 1px 0 rgba(0,0,0,.06));\n}\n.note .nt{font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8a6d00;display:block;margin-bottom:3px;}\n.note .obj{display:block;margin-top:7px;font-size:12.5px;color:#6b5600;border-top:1px dashed var(--note-edge);padding-top:6px;}\n.note .obj b{color:#4d3d00;}\n.phone .note{margin-left:46px;}\n\n/* connector pin dot on the section for mobile notes spacing */\n\n/* ---------- layout helpers for content ---------- */\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\n.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}\n.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}\n.scrollrow{display:flex;gap:12px;overflow:hidden;}\n.scrollrow&gt;*{flex:0 0 auto;}\n\n/* announcement bar */\n.annbar{background:var(--stroke);color:#fff;text-align:center;font-size:12px;letter-spacing:1px;padding:8px;display:flex;align-items:center;justify-content:center;gap:14px;}\n.annbar .ar{opacity:.6;}\n\n/* header */\n.hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 2px;}\n.logo{font-weight:700;font-size:18px;letter-spacing:1px;}\n.nav{display:flex;gap:16px;font-size:13px;color:#555;}\n\n/* product card */\n.pcard .pimg{aspect-ratio:3/4;}\n.pcard .pcat{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-top:8px;}\n.pcard .pname{font-size:13px;margin-top:2px;}\n.pcard .pprice{font-size:13px;font-weight:700;}\n.pcard .pdesc{font-size:11.5px;color:#7a7a76;line-height:1.3;margin-top:5px;}\n\n/* press logos strip */\n.logoph{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:19px;letter-spacing:1px;color:#8a8a86;}\n.section.opt .secno{background:transparent;color:var(--accent);border:1.6px dashed var(--accent);width:auto;min-width:26px;padding:0 7px;border-radius:13px;font-size:10px;letter-spacing:.5px;}\nbody.mono .section.opt .secno{color:#555;border-color:#888;}\n\n/* featured product under UGC video */\n.miniprod{display:flex;align-items:center;gap:8px;padding:7px;margin-top:8px;background:var(--paper);border-radius:7px;}\n.miniprod .mp-img{width:34px;height:34px;flex:0 0 auto;}\n.miniprod .mp-name{font-size:12px;font-weight:700;color:#2b2b2b;line-height:1.1;}\n\n/* collection tabs (inside a wireframe section) */\n.wtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}\n.wtab{\n  font-family:inherit;font-size:13px;cursor:pointer;background:var(--paper);\n  color:#666;padding:6px 13px;border-radius:20px;position:relative;white-space:nowrap;\n}\n.wtab::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:20px;filter:url(#rough);}\n.wtab.on{color:var(--ink);font-weight:700;background:var(--stroke);color:#fff;}\n.wtab.on::before{border-color:var(--stroke);}\n.wtab.scroll{overflow-x:auto;}\n.tabpane:not(.on){display:none!important;}\n\n/* hero variant helpers */\n.btn.inv{background:#fff;color:#2b2b2b;}\n.checklist{display:flex;flex-direction:column;gap:8px;}\n.ck{display:flex;gap:8px;align-items:center;font-size:14px;}\n.ck-mark{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--fill-2);color:#444;flex:0 0 auto;}\n.avstack{display:flex;align-items:center;}\n.avstack .av{width:26px;height:26px;border-radius:50%;background:var(--fill-2);border:2px solid #fff;margin-left:-8px;position:relative;}\n.avstack .av:first-child{margin-left:0;}\n.darkhero{background:#2f2f2f;color:#fff;border-radius:10px;overflow:hidden;position:relative;}\n.darkhero .kicker,.darkhero .sub,.darkhero .tiny{color:#c9c9c9;}\n.darkhero .chip{color:#fff;background:rgba(255,255,255,.06);}\n.darkhero .chip::before{border-color:#7d7d7d;}\n.darkhero .ck-mark{background:rgba(255,255,255,.2);color:#fff;}\n.darkhero .img{background:#3a3a3a;}\n.darkhero .img span{background:#3a3a3a;color:#9a9a9a;}\n.darkhero .av{border-color:#2f2f2f;background:#5a5a5a;}\n\n/* ============================================================\n   TOP CONTROL BAR + VIEWS\n   ============================================================ */\n.topbar{\n  position:sticky;top:0;z-index:50;background:rgba(244,243,239,.92);\n  backdrop-filter:blur(4px);border-bottom:1.5px solid #e2e0da;\n  display:flex;align-items:center;gap:14px;padding:11px 22px;flex-wrap:wrap;\n}\n.topbar .title{font-weight:700;font-size:17px;}\n.topbar .title small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.5px;}\n.tabs{display:flex;gap:6px;margin-left:6px;}\n.tab{\n  font-family:inherit;font-size:14px;cursor:pointer;background:transparent;\n  padding:7px 15px;border-radius:8px;position:relative;color:#555;\n}\n.tab::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid transparent;border-radius:8px;filter:url(#rough);}\n.tab.active{color:var(--ink);font-weight:700;background:var(--paper);}\n.tab.active::before{border-color:var(--stroke);}\n.spacer{flex:1;}\n.toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:#555;cursor:pointer;user-select:none;}\n.toggle input{width:34px;height:19px;appearance:none;background:var(--fill-2);border-radius:20px;position:relative;cursor:pointer;outline:none;transition:.15s;}\n.toggle input:checked{background:var(--accent);}\n.toggle input::after{content:&quot;&quot;;position:absolute;top:2px;left:2px;width:15px;height:15px;background:#fff;border-radius:50%;transition:.15s;}\n.toggle input:checked::after{left:17px;}\n\n.view{display:none;}\n.view.active{display:block;}\n\n/* color-off (pure grayscale) */\nbody.mono{--accent:#3a3a3a;--note:#ececec;--note-ink:#333;--note-edge:#cfcfcf;}\nbody.mono .note .nt{color:#444;}\nbody.mono .note .obj,body.mono .note .obj b{color:#555;}\n\n/* hide notes toggle */\nbody.nonotes .note{display:none;}\nbody.nonotes .stage{padding-right:40px;}\n\n/* ============================================================\n   SHOPIFY MODULES SHEET\n   ============================================================ */\n.sheet{max-width:1080px;margin:0 auto;padding:34px 30px 120px;}\n.sheet h2{font-size:26px;margin:0 0 6px;}\n.sheet .lead{color:#6b6b67;font-size:15px;margin:0 0 26px;max-width:680px;}\n.modgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}\n@media(max-width:760px){.modgrid{grid-template-columns:1fr;}}\n.mod{background:var(--paper);border-radius:10px;padding:16px 18px;position:relative;}\n.mod&gt;.mh{display:flex;align-items:center;gap:10px;margin-bottom:9px;}\n.mod .mn{min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}\n.mod h3{font-size:16px;margin:0;}\n.mod .mtag{font-size:11px;color:var(--muted);}\n.mod .purpose{font-size:13px;color:#6b6b67;line-height:1.4;margin:0 0 11px;}\n.mod .slabel{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8a8a86;margin:0 0 6px;}\n.mod ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px;}\n.mod li{font-size:12px;background:var(--fill);color:#444;padding:4px 9px;border-radius:6px;}\n.mod li.blk{background:#e7eef7;color:#235a8c;}\n\n/* ============================================================\n   COLLECTION PAGE (PLP)\n   ============================================================ */\n/* mini hero band */\n.cmini{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;}\n.cmini .bullets{display:flex;flex-direction:column;gap:5px;margin-top:8px;}\n.cmini .bl{display:flex;align-items:center;gap:7px;font-size:13px;color:#555;}\n\n/* toolbar: count + sort + filter btn */\n.ctoolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;}\n.sortsel{display:inline-flex;align-items:center;gap:8px; -template-columns:repeat(3,1fr);gap:16px;flex:1 1 0;min-width:0;}\n.fav{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:13px;color:#777;z-index:2;}\n.fav::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.pcard .pswrow{display:flex;gap:6px;margin-top:7px;align-items:center;}\n.pcard .psw{width:15px;height:15px;border-radius:50%;position:relative;}\n.pcard .psw::before{content:&quot;&quot;;position:absolute;inset:-1px;border:1.3px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n\n/* product card image gallery nav (swipe / arrows between product images) */\n.pimg .garrow{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:15px;color:#555;z-index:2;opacity:0;transition:opacity .15s;}\n.pimg .garrow::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.pimg .garrow.l{left:7px;}\n.pimg .garrow.r{right:7px;}\n.pcard:hover .pimg .garrow{opacity:1;}\n.pimg .gdots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:#fff;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.4);}\n.pimg .ghint{position:absolute;bottom:8px;right:8px;font-size:9px;color:#777;background:var(--paper);padding:1px 6px;border-radius:8px;z-index:2;}\n\n/* promo tile inside grid */\n.promotile{background:#2f2f2f;color:#fff;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:18px;min-height:200px;position:relative;}\n.promotile .kicker{color:#bdbdbd;}\n.promotile .h{color:#fff;}\n\n/* pagination */\n.loadmore{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0;}\n.pdots{displ &lt;span class=&quot;badge&quot;&gt;MC&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;AMEX&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;PayPal&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;OXXO&lt;/span&gt;&lt;/div&gt;\n    &lt;div class=&quot;guar&quot;&gt;&lt;span class=&quot;g&quot;&gt;◇ Protegida&lt;/span&gt;&lt;span class=&quot;g&quot;&gt;⇄ 30 días&lt;/span&gt;&lt;span class=&quot;g&quot;&gt;🔒 SSL&lt;/span&gt;&lt;/div&gt;\n    &lt;div class=&quot;col center&quot; style=&quot;margin-top:9px&quot;&gt;&lt;span class=&quot;tiny&quot; style=&quot;text-decoration:underline&quot;&gt;Seguir comprando&lt;/span&gt;&lt;/div&gt;\n    &lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;nt&quot;&gt;Checkout block&lt;/span&gt;CTA + iconos de pago + garantías.&lt;span class=&quot;obj&quot;&gt;&lt;b&gt;CRO:&lt;/b&gt; sellos reducen ansiedad y abandono.&lt;/span&gt;&lt;/div&gt;\n  &lt;/div&gt;\n\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;!-- =================== MODULES =================== --&gt;\n&lt;div class=&quot;view&quot; id=&quot;view-modules&quot;&gt;\n&lt;div class=&quot;sheet&quot;&gt;\n  &lt;h2&gt;Secciones editables — Cart&lt;/h2&gt;\n  &lt;p class=&quot;lead&quot;&gt;El carrito en Shopify es un &lt;b&gt;cart drawer&lt;/b&gt; (o página &lt;code&gt;cart&lt;/code&gt;) + apps de envío gratis/upsell. Settings clave de conversión en &lt;span style=&quot;color:#235a8c&quot;&gt;azul&lt;/span&gt;.&lt;/p&gt;\n  &lt;div class=&quot;modgrid&quot; id=&quot;modgrid&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;script&gt;\nconst tabs=document.querySelectorAll('.tab[data-view]');\nconst views={desktop:'view-desktop',mobile:'view-mobile',modules:'view-modules'};\nfunction setView(v){\n  tabs.forEach(t=&gt;t.classList.toggle('active',t.dataset.view===v));\n  Object.entries(views).forEach(([k,id])=&gt;document.getElementById(id).classList.toggle('active',k===v));\n  localStorage.setItem('cart_view',v);window.scrollTo(0,0);\n  if(typeof layoutNotes==='function') requestAnimationFrame(layoutNotes);\n}\ntabs.forEach(t=&gt;t.addEventListener('click',()=&gt;setView(t.dataset.view)));\n\nconst tNotes=document.getElementById('t-notes'),tColor=document.getElementById('t-color');\nfunction applyToggles(){\n  document.body.classList.toggle('nonotes',!tNotes.checked);\n  document.body.classList.toggle('mono',!tColor.checked);\n  localStorage.setItem('cart_notes',tNotes.checked);localStorage.setItem('cart_color',tColor.checked);\n  if(typeof layoutNotes==='function') requestAnimationFrame(layoutNotes);\n}\ntNotes.checked=localStorage.getItem('cart_notes')!=='false';\ntColor.checked=localStorage.getItem('cart_color')!=='false';\ntNotes.addEventListener('change',applyToggles);tColor.addEventListener('change',applyToggles);\n\nfunction layoutNotes(){\n  if(document.body.classList.contains('nonotes')) return;\n  const active=document.querySelector('.view.active'); if(!active) return;\n  const notes=[...active.querySelectorAll('.note')];\n  notes.forEach(n=&gt;n.style.setProperty('--ty','0px'));\n  const GAP=16; let prevBottom=-Infinity;\n  notes.forEach(n=&gt;{const r=n.getBoundingClientRect();if(r.height===0)return;let ty=0;if(r.top&lt;prevBottom+GAP){ty=(prevBottom+GAP)-r.top;n.style.setProperty('--ty',ty+'px');}prevBottom=r.top+ty+r.height;});\n}\nlet rT;function scheduleLayout(){clearTimeout(rT);rT=setTimeout(layoutNotes,60);}\nwindow.addEventListener('resize',scheduleLayout);\nwindow.addEventListener('load',layoutNotes);\nif(document.fonts&amp;&amp;document.fonts.ready)document.fonts.ready.then(layoutNotes);\nsetTimeout(layoutNotes,300);\n\nconst MODS=[\n {n:1,name:'Cart announcement',tag:'cart-drawer.liquid',purpose:'Strip de incentivo dentro del carrito.',s:['mensaje','link','color','mostrar/ocultar']},\n {n:2,name:'Free shipping / reward bar',tag:'cart-progress-bar.liquid (app)',purpose:'Barra de meta: faltan $X para envío gratis / descuento.',s:['*umbral envío gratis*','*umbral 2 (descuento)*','*textos por estado*','color barra','mostrar siguiente premio']},\n {n:3,name:'Line items',tag:'cart-drawer.liquid',purpose:'Productos: imagen, variante, precio, cantidad, eliminar.',s:['*mostrar variante*','*urgencia stock*','editar cantidad','imagen ratio']},\n {n:4,name:'Upsell / cross-sell',tag:'cart-upsell.liquid (app)',purpose:'Complementos sugeridos en el carrito.',s:['*fuente (IA/manual)*','nº items','+ agregar','título']},\n {n:5,name:'Discount code + note',tag:'cart-drawer.liquid',purpose:'Cupón, nota de pedido y opción regalo.',s:['*mostrar campo código*','*nota de pedido*','*opción regalo*']},\n {n:6,name:'Checkout block',tag:'cart-footer.liquid',purpose:'Subtotal, CTA checkout, express y sellos de pago/seguridad.',s:['*CTA checkout*','*express checkout (Shop Pay/PayPal)*','*iconos de pago*','*badges de seguridad/garantía*','mostrar impuestos/envío','seguir comprando']},\n];\nconst grid=document.getElementById('modgrid');\ngrid.innerHTML=MODS.map(m=&gt;`\n &lt;div class=&quot;mod sketch&quot;&gt;\n   &lt;div class=&quot;mh&quot;&gt;&lt;span class=&quot;mn&quot;&gt;${m.n}&lt;/span&gt;&lt;div&gt;&lt;h3&gt;${m.name}&lt;/h3&gt;&lt;span class=&quot;mtag&quot;&gt;${m.tag}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\n   &lt;p class=&quot;purpose&quot;&gt;${m.purpose}&lt;/p&gt;\n   &lt;p class=&quot;slabel&quot;&gt;Settings&lt;/p&gt;\n   &lt;ul&gt;${m.s.map(x=&gt;{const b=x.startsWith('*');const t=x.replace(/\\*/g,'');return `&lt;li class=&quot;${b?'blk':''}&quot;&gt;${t}&lt;/li&gt;`;}).join('')}&lt;/ul&gt;\n &lt;/div&gt;`).join('');\n\nsetView(localStorage.getItem('cart_view')||'desktop');\napplyToggles();\n&lt;/script&gt;\n\n&lt;template id=&quot;__bundler_thumbnail&quot;&gt;\n&lt;svg viewBox=&quot;0 0 100 100&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;&lt;rect width=&quot;100&quot; height=&quot;100&quot; fill=&quot;#f4f3ef&quot;/&gt;&lt;g stroke=&quot;#3a3a3a&quot; stroke-width=&quot;2.4&quot; fill=&quot;none&quot;&gt;&lt;rect x=&quot;30&quot; y=&quot;22&quot; width=&quot;40&quot; height=&quot;56&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;36&quot; y=&quot;34&quot; width=&quot;12&quot; height=&quot;14&quot; rx=&quot;2&quot; fill=&quot;#e9e8e4&quot;/&gt;&lt;line x1=&quot;52&quot; y1=&quot;38&quot; x2=&quot;64&quot; y2=&quot;38&quot;/&gt;&lt;line x1=&quot;52&quot; y1=&quot;44&quot; x2=&quot;60&quot; y2=&quot;44&quot;/&gt;&lt;rect x=&quot;36&quot; y=&quot;54&quot; width=&quot;28&quot; height=&quot;6&quot; rx=&quot;3&quot; fill=&quot;#e9e8e4&quot;/&gt;&lt;rect x=&quot;36&quot; y=&quot;66&quot; width=&quot;28&quot; height=&quot;8&quot; rx=&quot;2&quot; fill=&quot;#3a3a3a&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;\n&lt;/template&gt;\n\n&lt;/body&gt;\n&lt;/html&gt;\n\">\u003c/iframe>\u003c/div>\u003c/section>\u003csection class=\"view\" data-view=\"5\">\u003cdiv class=\"vhead\">\u003cdiv class=\"vh-l\">\u003cspan class=\"vnum\">06\u003c/span>\u003cdiv>\u003ch2>Sección de colecciones · 2 propuestas\u003c/h2>\u003cp>Dos maneras de mostrar varias colecciones en un mismo espacio. Aquí hay que elegir una: A o B.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"vbody\">\u003ciframe loading=\"lazy\" title=\"Sección de colecciones · 2 propuestas\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;es&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;Sección 4 · Tabs Colecciones — Premium&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;style&gt;/* ============================================================\n   Low-fi wireframe system — Excalidraw / hand-drawn vibe\n   Grayscale wireframe + single accent for CRO sticky-notes\n   ============================================================ */\n\n:root{\n  --canvas:#f4f3ef;\n  --paper:#ffffff;\n  --ink:#2b2b2b;\n  --stroke:#3a3a3a;\n  --stroke-soft:#8c8c8c;\n  --fill:#e9e8e4;\n  --fill-2:#dedcd6;\n  --muted:#9a9a96;\n  --note:#fff3bf;        /* sticky note */\n  --note-ink:#5b4b00;\n  --note-edge:#e2cf6b;\n  --accent:#1971c2;      /* arrows / pin */\n  --r:7px;\n}\n\n*{box-sizing:border-box;}\nhtml,body{margin:0;padding:0;}\nbody{\n  background:var(--canvas);\n  color:var(--ink);\n  font-family:'Kalam', 'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Sans MS', cursive;\n  -webkit-font-smoothing:antialiased;\n  /* faint grid like a sketch canvas */\n  background-image:\n    linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(0,0,0,.025) 1px, transparent 1px);\n  background-size:26px 26px;\n}\n\n/* ---------- hand-drawn border via displacement filter ---------- */\n.sketch{position:relative;}\n.sketch::before{\n  content:&quot;&quot;;\n  position:absolute; inset:0;\n  border:1.7px solid var(--stroke);\n  border-radius:9px 7px 10px 8px / 8px 10px 7px 9px;\n  filter:url(#rough);\n  pointer-events:none;\n}\n.sketch.soft::before{border-color:var(--stroke-soft);}\n.sketch.dash::before{border-style:dashed;}\n\n/* ---------- image placeholder ---------- */\n.img{\n  background:var(--fill);\n  background-image:\n    linear-gradient(to top right, transparent calc(50% - .9px), var(--stroke-soft) calc(50% - .9px), var(--stroke-soft) calc(50% + .9px), transparent calc(50% + .9px)),\n    linear-gradient(to top left,  transparent calc(50% - .9px), var(--stroke-soft) calc(50% - .9px), var(--stroke-soft) calc(50% + .9px), transparent calc(50% + .9px));\n  display:flex; align-items:center; justify-content:center;\n  color:var(--muted); font-size:13px; letter-spacing:.5px;\n  min-height:60px; overflow:hidden;\n}\n.img span{background:var(--fill); padding:2px 8px; border-radius:4px;}\n.img.tall{min-height:240px;}\n\n/* ---------- text placeholders ---------- */\n.bar{height:9px;background:var(--fill-2);border-radius:6px;margin:7px 0;}\n.bar.dark{background:#cfcdc6;}\n.h{font-weight:700;line-height:1.12;color:var(--ink);}\n.h1{font-size:30px;}\n.h2{font-size:22px;}\n.h3{font-size:17px;}\n.sub{font-size:14px;color:#6b6b67;line-height:1.3;}\n.tiny{font-size:12px;color:var(--muted);}\n.kicker{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}\n\n/* ---------- buttons ---------- */\n.btn{\n  display:inline-flex;align-items:center;gap:6px;justify-content:center;\n  background:var(--stroke);color:#fff;font-family:inherit;font-size:14px;font-weight:700;\n  padding:10px 18px;border-radius:8px 10px 9px 11px / 11px 9px 10px 8px;\n  position:relative;white-space:nowrap;\n}\n.btn.o{background:transparent;color:var(--ink);}\n.btn.o::before{\n  content:&quot;&quot;;position:absolute;inset:0;border:1.7px solid var(--stroke);\n  border-radius:inherit;filter:url(#rough);\n}\n.btn.sm{padding:6px 12px;font-size:12px;}\n.btn.full{display:flex;width:100%;}\n\n/* ---------- pills / badges / chips ---------- */\n.badge{\n  display:inline-block;font-size:11px;font-weight:700;color:var(--ink);\n  background:var(--paper);padding:3px 9px;border-radius:20px;position:relative;\n}\n.badge::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px solid var(--stroke);border-radius:20px;filter:url(#rough);}\n.chip{\n  display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);\n  background:var(--paper);padding:7px 13px;border-radius:20px;position:relative;white-space:nowrap;\n}\n.chip::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:20px;filter:url(#rough);}\n\n/* ---------- icon placeholder ---------- */\n.ico{\n  width:42px;height:42px;border-radius:50%;background:var(--fill);\n  display:flex;align-items:center;justify-content:center;color:var(--stroke-soft);\n  font-size:18px;position:relative;flex:0 0 auto;\n}\n.ico::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.stars{color:#3a3a3a;letter-spacing:2px;font-size:14px;}\n\n/* ---------- generic blocks ---------- */\n.card{background:var(--paper);padding:12px;border-radius:var(--r);position:relative;}\n.row{display:flex;gap:14px;}\n.col{display:flex;flex-direction:column;}\n.center{align-items:center;text-align:center;}\n.between{justify-content:space-between;align-items:center;}\n.wrap{flex-wrap:wrap;}\n.grow{flex:1 1 0;min-width:0;}\n\n/* ============================================================\n   DEVICE FRAMES\n   ============================================================ */\n.stage{\n  display:flex;flex-direction:column;align-items:center;\n  padding:30px 470px 120px 40px;   /* right padding leaves room for notes */\n}\n@media(max-width:1180px){ .stage{padding-right:40px;} .note{display:none!important;} }\n\n.devwrap{position:relative;}\n\n/* browser chrome (desktop) */\n.browser{width:980px;max-width:100%;background:var(--paper);position:relative;border-radius:12px;}\n.browser&gt;.chrome{\n  height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;\n  border-bottom:1.6px solid var(--fill-2);\n}\n.dot{width:11px;height:11px;border-radius:50%;background:var(--fill-2);}\n.urlbar{flex:1;height:20px;background:var(--fill);border-radius:20px;margin-left:10px;}\n\n/* phone chrome (mobile) */\n.phone{width:392px;max-width:100%;background:var(--paper);position:relative;border-radius:34px;padding:12px;}\n.phone::before{content:&quot;&quot;;position:absolute;inset:0;border:2px solid var(--stroke);border-radius:34px;filter:url(#rough);}\n.phone .screen{border-radius:24px;overflow:hidden;background:var(--paper);position:relative;}\n.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:120px;height:18px;background:var(--stroke);border-radius:20px;z-index:5;}\n\n/* a screen section */\n.section{position:relative;padding:16px;border-bottom:1.4px dashed #e2e0da;}\n.section:last-child{border-bottom:none;}\n.section .secno{\n  position:absolute;left:-13px;top:12px;width:26px;height:26px;border-radius:50%;\n  background:var(--accent);color:#fff;font-size:13px;font-weight:700;\n  display:flex;align-items:center;justify-content:center;z-index:6;\n  box-shadow:0 1px 0 rgba(0,0,0,.15);\n}\n.phone .section .secno{left:-2px;}\n\n/* ---------- CRO sticky notes ---------- */\n.note{\n  position:absolute;left:100%;top:8px;margin-left:54px;width:360px;\n  background:var(--note);color:var(--note-ink);\n  padding:13px 15px 14px;border-radius:3px;\n  box-shadow:2px 3px 0 rgba(0,0,0,.10);\n  transform:rotate(var(--rot,-.5deg)) translateY(var(--ty,0px));font-size:14px;line-height:1.34;\n}\n.note:nth-child(even){--rot:.6deg;}\n.note::before{ /* arrow toward the section */\n  content:&quot;&quot;;position:absolute;right:100%;top:18px;\n  border:9px solid transparent;border-right-color:var(--note);\n  filter:drop-shadow(-1px 1px 0 rgba(0,0,0,.06));\n}\n.note .nt{font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8a6d00;display:block;margin-bottom:3px;}\n.note .obj{display:block;margin-top:7px;font-size:12.5px;color:#6b5600;border-top:1px dashed var(--note-edge);padding-top:6px;}\n.note .obj b{color:#4d3d00;}\n.phone .note{margin-left:46px;}\n\n/* connector pin dot on the section for mobile notes spacing */\n\n/* ---------- layout helpers for content ---------- */\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\n.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}\n.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}\n.scrollrow{display:flex;gap:12px;overflow:hidden;}\n.scrollrow&gt;*{flex:0 0 auto;}\n\n/* announcement bar */\n.annbar{background:var(--stroke);color:#fff;text-align:center;font-size:12px;letter-spacing:1px;padding:8px;display:flex;align-items:center;justify-content:center;gap:14px;}\n.annba }\n.spacer{flex:1;}\n.toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:#555;cursor:pointer;user-select:none;}\n.toggle input{width:34px;height:19px;appearance:none;background:var(--fill-2);border-radius:20px;position:relative;cursor:pointer;outline:none;transition:.15s;}\n.toggle input:checked{background:var(--accent);}\n.toggle input::after{content:&quot;&quot;;position:absolute;top:2px;left:2px;width:15px;height:15px;background:#fff;border-radius:50%;transition:.15s;}\n.toggle input:checked::after{left:17px;}\n\n.view{display:none;}\n.view.active{display:block;}\n\n/* color-off (pure grayscale) */\nbody.mono{--accent:#3a3a3a;--note:#ececec;--note-ink:#333;--note-edge:#cfcfcf;}\nbody.mono .note .nt{color:#444;}\nbody.mono .note .obj,body.mono .note .obj b{color:#555;}\n\n/* hide notes toggle */\nbody.nonotes .note{display:none;}\nbody.nonotes .stage{padding-right:40px;}\n\n/* ============================================================\n   SHOPIFY MODULES SHEET\n   ============================================================ */\n.sheet{max-width:1080px;margin:0 auto;padding:34px 30px 120px;}\n.sheet h2{font-size:26px;margin:0 0 6px;}\n.sheet .lead{color:#6b6b67;font-size:15px;margin:0 0 26px;max-width:680px;}\n.modgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}\n@media(max-width:760px){.modgrid{grid-template-columns:1fr;}}\n.mod{background:var(--paper);border-radius:10px;padding:16px 18px;position:relative;}\n.mod&gt;.mh{display:flex;align-items:center;gap:10px;margin-bottom:9px;}\n.mod .mn{min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}\n.mod h3{font-size:16px;margin:0;}\n.mod .mtag{font-size:11px;color:var(--muted);}\n.mod .purpose{font-size:13px;color:#6b6b67;line-height:1.4;margin:0 0 11px;}\n.mod .slabel{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8a8a86;m border:1.5px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.pimg .garrow.l{left:7px;}\n.pimg .garrow.r{right:7px;}\n.pcard:hover .pimg .garrow{opacity:1;}\n.pimg .gdots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:#fff;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.4);}\n.pimg .ghint{position:absolute;bottom:8px;right:8px;font-size:9px;color:#777;background:var(--paper);padding:1px 6px;border-radius:8px;z-index:2;}\n\n/* promo tile inside grid */\n.promotile{background:#2f2f2f;color:#fff;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:18px;min-height:200px;position:relative;}\n.promotile .kicker{color:#bdbdbd;}\n.promotile .h{color:#fff;}\n\n/* pagination */\n.loadmore{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0;}\n.pdots{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:13px;}\n\n/* SEO collapsible */\n.seo{padding:14px 0;}\n.seo .barwrap{max-width:760px;}\n\n/* ============================================================\n   PRODUCT PAGE (PDP)\n   ============================================================ */\n.gallery{display:flex;gap:12px;}\n.gthumbs{display:flex;flex-direction:column;gap:9px;width:62px;flex:0 0 auto;}\n.gthumb{aspect-ratio:1;}\n.gthumb.on::before{border-width:2.4px;border-color:var(--stroke);}\n.gmain{flex:1 1 0;min-width:0;aspect-ratio:4/5;position:relative;}\n.buybox{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:13px;}\n.price{display:flex;align-items:center;gap:9px;}\n.price .now{font-size:25px;font-weight:700;}\n.price .was{font-size:15px;color:var(--muted);text-decoration:line-through;}\n.price .off{font-size:11px;font-weight:700;background:var(--stroke);color:#fff;padding:3px 8px;border-radius:5px;}\n.optlabel{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:#666;display:flex;justify-content:space-between;margin-bottom:8px;}\n.optlabel a{color:var(--accent);text-transform:none;letter-spacing:0;}\n.optrow{display:flex;gap:8px;flex-wrap:wrap;}\n.optbox{min-width:44px;text-align:center;padding:10px 13px;border-radius:7px;position:relative;font-size:13px;color:#2b2b2b;cursor:pointer;}\n.optbox::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:7px;filter:url(#rough);}\n.optbox.on{background:var(--stroke);color:#fff;}\n.optbox.on::before{border-color:var(--stroke);}\n.optbox.soldout{opacity:.42;text-decoration:line-through;}\n.swbig{width:32px;height:32px;border-radius:50%;position:relative;cursor:pointer;}\n.swbig::before{content:&quot;&quot;;position:absolute;inset:-1px;border:1.5px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.swbig.on::after{content:&quot;&quot;;position:absolute;inset:-5px;border:1.7px solid var(--stroke);border-radius:50%;}\n.qtybox{display:inline-flex;align-items:center;border-radius:8px;position:relative;}\n.qtybox::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:8px;filter:url(#rough);}\n.qtybox span{padding:9px 13px;font-size:15px;}\n.qtybox .n{min-width:34px;text-align:center;font-weight:700;}\n.atc{display:flex;width:100%;padding:15px;font-size:15px;}\n.express{display:flex;flex-direction:column;gap:7px;}\n.exbtn{display:flex;align-items:center;justify-content:center;width:100%;padding:12px;border-radius:8px;position:relative;font-size:13px;color:#444;background:var(--fill);}\n.exbtn::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:8px;filter:url(#rough);}\n.urgency{display:flex;align-items:center;gap:8px;font-size:13px;color:#7a4a00;}\n.urgency .dotred{width:8px;height:8px;border-radius:50%;background:#b06a00;flex:0 0 auto;}\n.acc{border-top:1.4px dashed #e2e0da;}\n.acc:last-of-type{border-bottom:1.4px dashed #e2e0da;}\n.acc .ahead{display:flex;align-items:center;justify-content:space-between;padding:13px 0;font-size:14px;font-weight:700;}\n/* review breakdown */\n.revsum{display:flex;gap:26px;align-items:center;flex-wrap:wrap;}\n.revbars{flex:1 1 240px;min-width:200px;display:flex;flex-direction:column;gap:5px;}\n.revrow{display:flex;align-items:center;gap:9px;font-size:12px;color:#666;}\n.revrow .track{flex:1;height:8px;background:var(--fill);border-radius:5px;overflow:hidden;}\n.revrow .fill{height:100%;background:#4a4a4a;}\n.bignum{font-size:40px;font-weight:700;line-height:1;}\n/* sticky add-to-cart bar (mobile) */\n.stickybar{position:sticky;bottom:0;z-index:8;background:var(--paper);border-top:1.5px solid #e2e0da;display:flex;align-items:center;gap:10px;padding:10px 14px;}\n.stickybar .sp{display:flex;flex-direction:column;}\n/* complete the look */\n.cline{display:flex;align-items:center;gap:12px;padding:9px;background:var(--paper);border-radius:8px;position:relative;}\n\n/* ============================================================\n   NAVIGATION MENU (mega menu + mobile drawer)\n   ============================================================ */\n.megamenu{background:var(--paper);border-radius:10px;padding:16px;position:relative;}\n.megamenu::before{content:&quot;&quot;;position:absolute;inset:0;border:1.7px solid var(--stroke);border-radius:10px;filter:url(#rough);pointer-events:none;}\n.navopen{color:var(--ink);font-weight:700;position:relative;}\n.navopen::after{content:&quot;&quot;;position:absolute;left:0;right:0;bottom:-7px;height:2.5px;background:var(--stroke);}\n\n/* category card (image + title + desc + arrow + badge) */\n.catcard{display:flex;align-items:center;gap:14px;padding:13px;border-radius:10px;position:relative;background:var(--fill);}\n.catcard .cimg{width:78px;height:66px;flex:0 0 auto;}\n.catcard .arrow{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto;font-size:15px;color:#444;}\n.catcard .arrow::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.catcard .ctitle{font-size:16px;font-weight:700;line-height:1.1;}\n.catcard .cdesc{font-size:12.5px;color:#7a7a76;margin-top:3px;}\n.catcard.alt{background:#eef0f3;}\n.catcard.alt2{background:#efece6;}\n\n/* mobile menu row (Ridge style) */\n.menurow{display:flex;align-items:center;gap:14px;padding:14px 4px;position:relative;border-bottom:1.4px solid #eceae4;}\n.menurow .mimg{width:64px;height:54px;flex:0 0 auto;}\n.menurow .mtitle{font-size:15px;font-weight:700;line-height:1.1;letter-spacing:.3px;}\n.menurow .mdesc{font-size:12.5px;color:#7a7a76;margin-top:3px;}\n.menurow .chev{margin-left:auto;color:#888;font-size:17px;flex:0 0 auto;}\n\n/* quick links list */\n.qlink{display:flex;align-items:center;gap:8px;padding:12px 4px;font-size:15px;font-weight:700;border-bottom:1.4px solid #eceae4;}\n.qlink .chev{margin-left:auto;color:#888;}\n\n/* social proof strip in menu */\n.spstrip{display:flex;align-items:center;gap:12px;background:#fafaf8;border-radius:9px;padding:12px;position:relative;}\n.spstrip::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px dashed var(--stroke-soft);border-radius:9px;filter:url(#rough);}\n.spavatars{display:flex;align-items:center;}\n.spavatars .av{width:26px;height:26px;border-radius:50%;background:var(--fill-2);border:2px solid var(--paper);margin-left:-8px;}\n.spavatars .av:first-child{margin-left:0;}\n\n/* mobile drawer shell */\n.drawer{display:flex;flex-direction:column;height:100%;}\n.drawerhead{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px;border-bottom:1.4px solid #eceae4;}\n\n/* ============================================================\n   CART (drawer)\n   ============================================================ */\n.cartdrawer{width:432px;max-width:100%;background:var(--paper);border-radius:14px;position:relative;}\n.metabar{display:flex;flex-direction:column;gap:7px;}\n.mtrack{height:11px;background:var(--fill);border-radius:7px;overflow:hidden;position:relative;}\n.mfill{height:100%;background:#4a4a4a;border-radius:7px;}\n.metatiers{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}\n.metatiers b{color:#2b2b2b;}\n.litem{display:flex;gap:12px;padding:13px 0;border-bottom:1.4px dashed #e2e0da;}\n.litem .limg{width:70px;height:86px;flex:0 0 auto;}\n.litem .lrm{font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer;}\n.codebox{display:flex;gap:8px;}\n.codebox .field{flex:1;height:40px;display:flex;align-items:center;padding:0 12px;color:var(--muted);font-size:13px;position:relative;background:var(--paper);border-radius:8px;}\n.codebox .field::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:8px;filter:url(#rough);}\n.paystrip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center;}\n.guar{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:2px;}\n.guar .g{display:flex;align-items:center;gap:6px;font-size:12px;color:#666;}\n.upsell{display:flex;align-items:center;gap:11px;padding:10px;background:#fafaf8;border-radius:9px;position:relative;}\n.upsell::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px dashed var(--stroke-soft);border-radius:9px;filter:url(#rough);}\n&lt;/style&gt;\n&lt;style&gt;\n/* ---------- page shell ---------- */\nbody{padding:0;}\n.phead{padding:26px 40px 6px;}\n.phead h1{font-size:24px;margin:0 0 4px;}\n.phead p{font-size:14px;color:#6b6b67;margin:0;max-width:720px;line-height:1.4;}\n.verband{padding:30px 40px 10px;}\n.verlabel{display:flex;align-items:center;gap:12px;margin-bottom:4px;}\n.verlabel .vno{min-width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}\n.verlabel h2{font-size:19px;margin:0;}\n.verband .vdesc{font-size:13.5px;color:#6b6b67;margin:0 0 18px 42px;max-width:700px;line-height:1.4;}\n.frames{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap;padding-left:42px;}\n.framecol{display:flex;flex-direction:column;gap:9px;}\n.framecap{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}\n.divider{height:1.5px;background:#e2e0da;margin:34px 40px 0;}\n\n/* desktop browser sized for one section */\n.minibrowser{width:760px;max-width:100%;}\n.minibrowser .secbody{padding:22px 22px 24px;}\n\n/* section heading inside the mock */\n.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;}\n.sechead .h2{font-size:21px;}\n.sechead .skicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}\n.viewall{font-size:13px;color:#555;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}\n\n/* ============ VERSION A · editorial side-tabs ============ */\n.A-layout{display:flex;gap:22px;align-items:flex-start;}\n.sidetabs{display:flex;flex-direction:column;gap:7px;width:188px;flex:0 0 auto;}\n.sidetab{font-family:inherit;text-align:left;font-size:14px;cursor:pointer;background:var(--paper);color:#555;padding:12px 14px;border-radius:10px;position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;}\n.sidetab::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:10px;filter:url(#rough);}\n.sidetab .c{font-size:11px;color:var(--muted);font-weight:400;}\n.sidetab.on{background:var(--stroke);color:#fff;font-weight:700;}\n.sidetab.on::before{border-color:var(--stroke);}\n.sidetab.on .c{color:#cfcfcf;}\n.sidetabs .allcol{margin-top:4px;font-size:12.5px;color:#555;padding:10px 14px;}\n.A-content{flex:1 1 0;min-width:0;}\n.colintro{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding-bottom:13px;margin-bottom:15px;border-bottom:1.4px dashed #e2e0da;}\n.colintro .ci-name{font-size:18px;font-weight:700;line-height:1.1;}\n.colintro .ci-desc{font-size:13px;color:#6b6b67;margin-top:4px;max-width:340px;line-height:1.35;}\n.colintro .ci-meta{font-size:11.5px;color:var(--muted);margin-top:7px;letter-spacing:.5px;}\n\n/* ============ VERSION B · featured hero + sliding pill tabs ============ */\n.ptabs{position:relative;display:inline-flex;gap:2px;padding:5px;border-radius:30px;background:var(--fill);}\n.ptabs.scroll{max-width:100%;overflow-x:auto;}\n.ptabs .ptab{position:relative;z-index:2;font-family:inherit;font-size:13px;cursor:pointer;background:transparent;color:#666;padding:9px 17px;border-radius:30px;white-space:nowrap;border:none;}\n.ptabs .ptab.on{color:#fff;font-weight:700;}\n.ptab-ind{position:absolute;top:5px;bottom:5px;left:0;width:0;background:var(--stroke);border-radius:30px;transition:transform .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1);z-index:1;}\n.B-grid{display:flex;gap:16px;align-items:stretch;margin-top:18px;}\n.pfeatured{display:flex;gap:16px;background:var(--paper);border-radius:12px;padding:14px;position:relative;flex:1.15 1 0;min-width:0;}\n.pfeatured .fimg{width:215px;flex:0 0 auto;aspect-ratio:4/5;position:relative;}\n.pfeatured .finfo{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 0;justify-content:center;}\n.pfeatured .frank{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);}\nbody.mono .pfeatured .frank{color:#555;}\n.pfeatured .fname{font-size:19px;font-weight:700;line-height:1.12;}\n.pfeatured .fdesc{font-size:12.5px;color:#6b6b67;line-height:1.35;}\n.B-side{display:flex;flex-direction:column;gap:12px;flex:1 1 0;min-width:0;}\n.B-side .pcard{flex:1 1 0;}\n.B-side .pcard .pimg{aspect-ratio:16/10;}\n\n/* mobile tweaks */\n.phone .secbody{padding:16px;}\n.phone .pfeatured{flex-direction:column;gap:10px;}\n.phone .pfeatured .fimg{width:100%;aspect-ratio:16/11;}\n.phone .colintro{flex-direction:column;gap:6px;}\n.phone .sechead .h2{font-size:18px;}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n\n&lt;!-- hand-drawn displacement filter --&gt;\n&lt;svg width=&quot;0&quot; height=&quot;0&quot; style=&quot;position:absolute&quot;&gt;\n  &lt;filter id=&quot;rough&quot;&gt;\n    &lt;feTurbulence type=&quot;fractalNoise&quot; baseFrequency=&quot;0.013&quot; numOctaves=&quot;2&quot; seed=&quot;7&quot; result=&quot;noise&quot;/&gt;\n    &lt;feDisplacementMap in=&quot;SourceGraphic&quot; in2=&quot;noise&quot; scale=&quot;2.6&quot; xChannelSelector=&quot;R&quot; yChannelSelector=&quot;G&quot;/&gt;\n  &lt;/filter&gt;\n&lt;/svg&gt;\n\n&lt;div class=&quot;phead&quot;&gt;\n  &lt;h1&gt;Sección 4 · Tabs de colecciones — versiones premium&lt;/h1&gt;\n  &lt;p&gt;Mismo concepto: mostrar varias colecciones (Más vendidos, Nuevos, Regalos, Edición limitada) en un solo espacio mediante tabs. Dos tratamientos premium, cada uno con su propuesta desktop y mobile.&lt;/p&gt;\n&lt;/div&gt;\n\n&lt;!-- ============================ VERSION A ============================ --&gt;\n&lt;div class=&quot;verband&quot;&gt;\n  &lt;div class=&quot;verlabel&quot;&gt;&lt;span class=&quot;vno&quot;&gt;A&lt;/span&gt;&lt;h2&gt;Editorial · tabs verticales + portada de colección&lt;/h2&gt;&lt;/div&gt;\n  &lt;p class=&quot;vdesc&quot;&gt;Las colecciones viven en una columna lateral tipo índice. Al elegir una, aparece su mini-portada (nombre, descripción, nº de productos y &quot;ver toda la colección&quot;) sobre una grilla curada. Se siente como hojear un catálogo, no como filtrar.&lt;/p&gt;\n  &lt;div class=&quot;frames&quot;&gt;\n    &lt;div class=&quot;framecol&quot;&gt;\n      &lt;span class=&quot;framecap&quot;&gt;Desktop&lt;/span&gt;\n      &lt;div class=&quot;browser sketch minibrowser&quot;&gt;\n        &lt;div class=&quot;chrome&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;span class=&quot;urlbar&quot;&gt;&lt;/span&gt;&lt;/div&gt;\n        &lt;div class=&quot;secbody&quot;&gt;\n          &lt;div class=&quot;sechead&quot;&gt;\n            &lt;div&gt;&lt;div class=&quot;skicker&quot;&gt;Compra por colección&lt;/div&gt;&lt;div class=&quot;h h2&quot;&gt;Bestsellers de la temporada&lt;/div&gt;&lt;/div&gt;\n            &lt;span class=&quot;viewall&quot;&gt;Ver tienda completa →&lt;/span&gt;\n          &lt;/div&gt;\n          &lt;div class=&quot;A-layout&quot; data-block data-ver=&quot;A&quot; data-dev=&quot;d&quot;&gt;\n            &lt;div class=&quot;sidetabs&quot; data-tabs&gt;&lt;/div&gt;\n            &lt;div class=&quot;A-content&quot; data-content&gt;&lt;/div&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;framecol&quot;&gt;\n      &lt;span class=&quot;framecap&quot;&gt;Mobile&lt;/span&gt;\n      &lt;div class=&quot;phone&quot;&gt;\n        &lt;div class=&quot;notch&quot;&gt;&lt;/div&gt;\n        &lt;div class=&quot;screen&quot;&gt;\n          &lt;div class=&quot;secbody&quot;&gt;\n            &lt;div class=&quot;sechead&quot;&gt;&lt;div&gt;&lt;div class=&quot;skicker&quot;&gt;Por colección&lt;/div&gt;&lt;div class=&quot;h h2&quot;&gt;Bestsellers&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n            &lt;div class=&quot;ptabs scroll&quot; data-block data-ver=&quot;A&quot; data-dev=&quot;m&quot; style=&quot;margin-bottom:14px&quot;&gt;\n              &lt;div class=&quot;ptab-ind&quot;&gt;&lt;/div&gt;\n            &lt;/div&gt;\n            &lt;div data-content-m=&quot;A&quot;&gt;&lt;/div&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n&lt;/div&gt;\n\n&lt;div class=&quot;divider&quot;&gt;&lt;/div&gt;\n\n&lt;!-- ============================ VERSION B ============================ --&gt;\n&lt;div class=&quot;verband&quot;&gt;\n  &lt;div class=&quot;verlabel&quot;&gt;&lt;span class=&quot;vno&quot;&gt;B&lt;/span&gt;&lt;h2&gt;Featured · pill tabs animadas + producto destacado&lt;/h2&gt;&lt;/div&gt;\n  &lt;p class=&quot;vdesc&quot;&gt;Tabs tipo segmento con indicador deslizante. Cada colección abre con su producto #1 en grande (héroe) y el resto en cards de apoyo. Jerarquiza: lo mejor de cada colección se ve primero, con ruta de compra inmediata.&lt;/p&gt;\n  &lt;div class=&quot;frames&quot;&gt;\n    &lt;div class=&quot;framecol&quot;&gt;\n      &lt;span class=&quot;framecap&quot;&gt;Desktop&lt;/span&gt;\n      &lt;div class=&quot;browser sketch minibrowser&quot;&gt;\n        &lt;div class=&quot;chrome&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;span class=&quot;urlbar&quot;&gt;&lt;/span&gt;&lt;/div&gt;\n        &lt;div class=&quot;secbody&quot;&gt;\n          &lt;div class=&quot;sechead&quot;&gt;\n            &lt;div&gt;&lt;div class=&quot;skicker&quot;&gt;Lo mejor de cada colección&lt;/div&gt;&lt;div class=&quot;h h2&quot;&gt;Bestsellers&lt;/div&gt;&lt;/div&gt;\n            &lt;span class=&quot;viewall&quot;&gt;Ver todos →&lt;/span&gt;\n          &lt;/div&gt;\n          &lt;div class=&quot;ptabs&quot; data-block data-ver=&quot;B&quot; data-dev=&quot;d&quot;&gt;&lt;div class=&quot;ptab-ind&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n          &lt;div class=&quot;B-grid&quot; data-content&gt;&lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;framecol&quot;&gt;\n      &lt;span class=&quot;framecap&quot;&gt;Mobile&lt;/span&gt;\n      &lt;div class=&quot;phone&quot;&gt;\n        &lt;div class=&quot;notch&quot;&gt;&lt;/div&gt;\n        &lt;div class=&quot;screen&quot;&gt;\n          &lt;div class=&quot;secbody&quot;&gt;\n            &lt;div class=&quot;sechead&quot;&gt;&lt;div&gt;&lt;div class=&quot;skicker&quot;&gt;Lo mejor de cada uno&lt;/div&gt;&lt;div class=&quot;h h2&quot;&gt;Bestsellers&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n            &lt;div class=&quot;ptabs scroll&quot; data-block data-ver=&quot;B&quot; data-dev=&quot;m&quot; style=&quot;margin-bottom:6px&quot;&gt;&lt;div class=&quot;ptab-ind&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n            &lt;div data-content-m=&quot;B&quot;&gt;&lt;/div&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n&lt;/div&gt;\n\n&lt;script&gt;\n/* ---------- collections data ---------- */\nconst COLS=[\n  {key:'best',label:'Más vendidos',count:24,badge:'Bestseller',desc:'Los favoritos validados por +10,000 clientes.',\n   items:[{p:'$1,299',s:'★★★★★'},{p:'$899',s:'★★★★★'},{p:'$1,490',s:'★★★★☆'},{p:'$749',s:'★★★★★'},{p:'$1,090',s:'★★★★★'}]},\n  {key:'new',label:'Nuevos',count:18,badge:'Nuevo',desc:'Lo último que acaba de llegar a la tienda.',\n   items:[{p:'$1,090',s:'★★★★★'},{p:'$990',s:'★★★★★'},{p:'$1,250',s:'★★★★☆'},{p:'$830',s:'★★★★★'},{p:'$1,190',s:'★★★★★'}]},\n  {key:'gift',label:'Regalos',count:12,badge:'Regalo ideal',desc:'Listos para regalar, con empaque premium.',\n   items:[{p:'$650',s:'★★★★★'},{p:'$790',s:'★★★★★'},{p:'$1,150',s:'★★★★★'},{p:'$920',s:'★★★★☆'},{p:'$580',s:'★★★★★'}]},\n  {key:'ltd',label:'Edición limitada',count:8,badge:'Edición lim.',desc:'Piezas exclusivas por tiempo limitado.',\n   items:[{p:'$1,890',s:'★★★★★'},{p:'$2,100',s:'★★★★★'},{p:'$1,690',s:'★★★★☆'},{p:'$1,450',s:'★★★★★'},{p:'$2,400',s:'★★★★★'}]},\n];\n\n/* ---------- card factory ---------- */\nfunction card(col,i,{w,sm,badge}={}){\n  const it=col.items[i];\n  const b=(badge&amp;&amp;i===0)?`&lt;span class=&quot;badge&quot; style=&quot;position:absolute;top:8px;left:8px&quot;&gt;${col.badge}&lt;/span&gt;`:'';\n  return `&lt;div class=&quot;pcard col&quot; ${w?`style=&quot;width:${w}px&quot;`:''}&gt;\n    &lt;div class=&quot;img sketch pimg&quot; style=&quot;position:relative&quot;&gt;&lt;span&gt;Producto&lt;/span&gt;${b}&lt;/div&gt;\n    &lt;div class=&quot;pcat&quot;&gt;Categoría · Vendor&lt;/div&gt;\n    &lt;div class=&quot;pname&quot;&gt;Nombre del producto&lt;/div&gt;\n    &lt;div class=&quot;row between&quot;&gt;&lt;span class=&quot;pprice&quot;&gt;${it.p}&lt;/span&gt;&lt;span class=&quot;stars&quot; style=&quot;font-size:12px&quot;&gt;${it.s}&lt;/span&gt;&lt;/div&gt;\n    ${sm?'':`&lt;div class=&quot;pdesc&quot;&gt;Descripción breve: material, uso u ocasión.&lt;/div&gt;`}\n    &lt;span class=&quot;btn sm full&quot; style=&quot;margin-top:6px&quot;&gt;+ Quick add&lt;/span&gt;\n  &lt;/div&gt;`;\n}\n\n/* ---------- Version A renderers ---------- */\nfunction renderA_desktop(block,idx){\n  const col=COLS[idx];\n  const tabs=block.querySelector('[data-tabs]');\n  const content=block.querySelector('[data-content]');\n  tabs.innerHTML=COLS.map((c,i)=&gt;`&lt;button class=&quot;sidetab ${i===idx?'on':''}&quot; data-i=&quot;${i}&quot;&gt;&lt;span&gt;${c.label}&lt;/span&gt;&lt;span class=&quot;c&quot;&gt;${c.count}&lt;/span&gt;&lt;/button&gt;`).join('')\n    +`&lt;span class=&quot;allcol&quot;&gt;+ Ver todas las colecciones →&lt;/span&gt;`;\n  content.innerHTML=`\n    &lt;div class=&quot;colintro&quot;&gt;\n      &lt;div&gt;&lt;div class=&quot;ci-name&quot;&gt;${col.label}&lt;/div&gt;&lt;div class=&quot;ci-desc&quot;&gt;${col.desc}&lt;/div&gt;&lt;div class=&quot;ci-meta&quot;&gt;● ${col.count} productos en esta colección&lt;/div&gt;&lt;/div&gt;\n      &lt;span class=&quot;btn o sm&quot; style=&quot;white-space:nowrap;align-self:flex-start&quot;&gt;Ver toda →&lt;/span&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;grid3&quot;&gt;${[0,1,2].map(i=&gt;card(col,i,{badge:true})).join('')}&lt;/div&gt;`;\n  tabs.querySelectorAll('.sidetab').forEach(t=&gt;t.onclick=()=&gt;renderA_desktop(block,+t.dataset.i));\n}\nfunction renderA_mobile(idx){\n  const col=COLS[idx];\n  const content=document.querySelector('[data-content-m=&quot;A&quot;]');\n  content.innerHTML=`\n    &lt;div class=&quot;colintro&quot;&gt;&lt;div&gt;&lt;div class=&quot;ci-name&quot;&gt;${col.label}&lt;/div&gt;&lt;div class=&quot;ci-desc&quot;&gt;${col.desc}&lt;/div&gt;&lt;div class=&quot;ci-meta&quot;&gt;● ${col.count} productos&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=&quot;grid2&quot;&gt;${[0,1,2,3].map(i=&gt;card(col,i,{sm:true,badge:true})).join('')}&lt;/div&gt;\n    &lt;span class=&quot;btn o full&quot; style=&quot;margin-top:12px&quot;&gt;Ver toda la colección →&lt;/span&gt;`;\n}\n\n/* ---------- Version B renderers ---------- */\nfunction featured(col){\n  return `&lt;div class=&quot;pfeatured sketch&quot;&gt;\n    &lt;div class=&quot;img sketch fimg&quot;&gt;&lt;span&gt;Producto destacado&lt;/span&gt;&lt;span class=&quot;badge&quot; style=&quot;position:absolute;top:9px;left:9px&quot;&gt;${col.badge}&lt;/span&gt;&lt;/div&gt;\n    &lt;div class=&quot;finfo&quot;&gt;\n      &lt;span class=&quot;frank&quot;&gt;★ #1 en ${col.label}&lt;/span&gt;\n      &lt;div class=&quot;fname&quot;&gt;Nombre del producto&lt;/div&gt;\n      &lt;div class=&quot;row&quot; style=&quot;gap:8px;align-items:center&quot;&gt;&lt;span class=&quot;pprice&quot; style=&quot;font-size:16px&quot;&gt;${col.items[0].p}&lt;/span&gt;&lt;span class=&quot;stars&quot;&gt;${col.items[0].s}&lt;/span&gt;&lt;span class=&quot;tiny&quot;&gt;(312)&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;fdesc&quot;&gt;Descripción breve del producto destacado: material, uso u ocasión por la que es el favorito.&lt;/div&gt;\n      &lt;span class=&quot;btn full&quot; style=&quot;margin-top:4px&quot;&gt;+ Quick add&lt;/span&gt;\n      &lt;span class=&quot;tiny&quot;&gt;✓ Envío seguro · Cambios fáciles 30 días&lt;/span&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;`;\n}\nfunction renderB_desktop(content,col){\n  content.innerHTML=featured(col)+`&lt;div class=&quot;B-side&quot;&gt;${[1,2,3].map(i=&gt;card(col,i,{sm:true})).join('')}&lt;/div&gt;`;\n}\nfunction renderB_mobile(idx){\n  const col=COLS[idx];\n  const content=document.querySelector('[data-content-m=&quot;B&quot;]');\n  content.innerHTML=featured(col)\n    +`&lt;div class=&quot;scrollrow&quot; style=&quot;margin-top:12px&quot;&gt;${[1,2,3].map(i=&gt;card(col,i,{w:148,sm:true})).join('')}&lt;/div&gt;`\n    +`&lt;span class=&quot;btn o full&quot; style=&quot;margin-top:12px&quot;&gt;Ver todos →&lt;/span&gt;`;\n}\n\n/* ---------- pill tabs (B desktop, A mobile, B mobile) ---------- */\nfunction buildPills(block,onChange){\n  const ind=block.querySelector('.ptab-ind');\n  COLS.forEach((c,i)=&gt;{\n    const b=document.createElement('button');\n    b.className='ptab'+(i===0?' on':'');\n    b.dataset.i=i;b.textContent=c.label;\n    block.appendChild(b);\n    b.onclick=()=&gt;{\n      block.querySelectorAll('.ptab').forEach(t=&gt;t.classList.toggle('on',t===b));\n      moveInd(block);onChange(i);\n    };\n  });\n  requestAnimationFrame(()=&gt;moveInd(block));\n  if(window.ResizeObserver)new ResizeObserver(()=&gt;moveInd(block)).observe(block);\n  if(window.IntersectionObserver)new IntersectionObserver(es=&gt;{es.forEach(e=&gt;{if(e.isIntersecting)moveInd(block);});}).observe(block);\n  if(document.fonts&amp;&amp;document.fonts.ready)document.fonts.ready.then(()=&gt;moveInd(block));\n}\nfunction moveInd(block){\n  const ind=block.querySelector('.ptab-ind');\n  const on=block.querySelector('.ptab.on');\n  if(!on||!on.offsetWidth)return;\n  ind.style.width=on.offsetWidth+'px';\n  ind.style.transform=`translateX(${on.offsetLeft-5}px)`;\n}\n\n/* ---------- init ---------- */\ndocument.querySelectorAll('[data-block][data-ver=&quot;A&quot;][data-dev=&quot;d&quot;]').forEach(b=&gt;renderA_desktop(b,0));\ndocument.querySelectorAll('[data-block][data-ver=&quot;B&quot;][data-dev=&quot;d&quot;]').forEach(b=&gt;{\n  const content=b.parentElement.querySelector('.B-grid');\n  renderB_desktop(content,COLS[0]);\n  buildPills(b,i=&gt;renderB_desktop(content,COLS[i]));\n});\ndocument.querySelectorAll('[data-block][data-ver=&quot;A&quot;][data-dev=&quot;m&quot;]').forEach(b=&gt;{renderA_mobile(0);buildPills(b,renderA_mobile);});\ndocument.querySelectorAll('[data-block][data-ver=&quot;B&quot;][data-dev=&quot;m&quot;]').forEach(b=&gt;{renderB_mobile(0);buildPills(b,renderB_mobile);});\nwindow.addEventListener('resize',()=&gt;document.querySelectorAll('[data-block] .ptab-ind').forEach(i=&gt;moveInd(i.parentElement)));\nwindow.addEventListener('load',()=&gt;document.querySelectorAll('[data-block] .ptab-ind').forEach(i=&gt;moveInd(i.parentElement)));\n&lt;/script&gt;\n\n&lt;template id=&quot;__bundler_thumbnail&quot;&gt;\n&lt;svg viewBox=&quot;0 0 100 100&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;&lt;rect width=&quot;100&quot; height=&quot;100&quot; fill=&quot;#f4f3ef&quot;/&gt;&lt;g stroke=&quot;#3a3a3a&quot; stroke-width=&quot;2.4&quot; fill=&quot;none&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;30&quot; width=&quot;22&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;46&quot; y=&quot;30&quot; width=&quot;36&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;22&quot; y=&quot;22&quot; width=&quot;16&quot; height=&quot;6&quot; rx=&quot;3&quot; fill=&quot;#1971c2&quot; stroke=&quot;none&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;\n&lt;/template&gt;\n\n&lt;/body&gt;\n&lt;/html&gt;\n\">\u003c/iframe>\u003c/div>\u003c/section>\n\n\n\u003c/div>\n\n\u003cscript>\nconst views=[...document.querySelectorAll('.view')],items=[...document.querySelectorAll('.navitem')];\nfunction go(id){\n  views.forEach(v=>v.classList.toggle('on',v.dataset.view===String(id)));\n  items.forEach(b=>b.classList.toggle('on',b.dataset.i===String(id)));\n  const m=document.querySelector('.main');if(m)m.scrollTop=0;\n  const f=document.querySelector('.view.on iframe');\n  if(f){const ping=()=>{try{f.contentWindow.dispatchEvent(new Event('resize'))}catch(e){}};f.addEventListener('load',ping,{once:true});ping();setTimeout(ping,140);}\n  try{localStorage.setItem('wf-view',id)}catch(e){}\n  if(window.innerWidth\u003c=860)window.scrollTo(0,0);\n}\nitems.forEach(b=>b.onclick=()=>go(b.dataset.i));\ndocument.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));\ntry{const s=localStorage.getItem('wf-view');if(s!==null&&document.querySelector('.view[data-view=\"'+s+'\"]'))go(s);}catch(e){}\ndocument.addEventListener('keydown',e=>{\n  if(e.target.closest('input,textarea'))return;\n  const order=items.map(b=>b.dataset.i),cur=order.indexOf(document.querySelector('.navitem.on').dataset.i);\n  if(e.key==='ArrowRight'&&cur\u003corder.length-1)go(order[cur+1]);\n  if(e.key==='ArrowLeft'&&cur>0)go(order[cur-1]);\n});\n\u003c/script>\n\n\n\n\n\u003c/body>\u003c/html>"</script>
