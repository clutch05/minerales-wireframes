  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

2e0da;--paper:#faf9f6;--bg:#f2f1ec;--acc:#1971c2}\nbody{font-family:'Karla',system-ui,sans-serif;color:var(--ink);background:var(--bg);height:100vh;overflow:hidden;display:flex}\na{color:var(--acc)}a:hover{color:#12558f}\n/* sidebar */\n.side{width:262px;flex:0 0 auto;background:#fff;border-right:1.5px solid var(--line);display:flex;flex-direction:column;height:100vh}\n.brand{padding:22px 20px 16px;border-bottom:1.5px solid var(--line)}\n.brand .k{font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--mut);margin-bottom:6px}\n.brand h1{font-family:'Kalam',cursive;font-size:20px;line-height:1.15;font-weight:700}\n.brand .sub{font-size:12px;color:var(--soft);margin-top:5px}\n.nav{padding:12px 10px;overflow-y:auto;flex:1}\n.navsec{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--mut);padding:10px 10px 6px}\n.navitem{width:100%;display:flex;gap:11px;align-items:baseline;text-align:left;background:none;border:none;font:inherit;font-size:14px;color:var(--soft);padding:10px 11px;border-radius:9px;cursor:pointer;transition:background .14s,color .14s}\n.navitem:hover{background:var(--paper);color:var(--ink)}\n.navitem.on{background:var(--ink);color:#fff}\n.navitem .nn{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.5px;min-width:17px}\n.navitem.on .nn{color:#a8a8a3}\n.navitem .nl{line-height:1.25}\n.legend{padding:14px 20px 18px;border-top:1.5px solid var(--line);font-size:11.5px;color:var(--soft);line-height:1.5}\n.legend b{color:var(--ink);display:block;margin-bottom:4px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase}\n/* main */\n.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}\n.view{display:none;flex-direction:column;height:100%}\n.view.on{display:flex}\n.vhead{padding:20px 26px 16px;background:#fff;border-bottom:1.5px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex:0 0 auto}\n.vh-l{display:flex;gap:14px;align-items:flex-start}\n.vnum{font-family:'Kalam',cursive;font-size:26px;font-weight:700;color:var(--line);line-height:1}\n.vhead h2{font-size:19px;font-weight:700;letter-spacing:-.2px}\n.vhead p{font-size:13.5px;color:var(--soft);margin-top:4px;max-width:640px;line-height:1.45;text-wrap:pretty}\n.vbody{flex:1;min-height:0;background:var(--bg);position:relative}\n.vbody iframe{width:100%;height:100%;border:none;display:block;background:var(--paper)}\n/* cover */\n.cover{padding:56px 60px;overflow-y:auto}\n.cover .k{font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--mut);margin-bottom:12px}\n.cover h2{font-family:'Kalam',cursive;font-size:38px;line-height:1.1;max-width:640px;margin-bottom:14px}\n.cover .lead{font-size:16px;color:var(--soft);max-width:620px;line-height:1.6;margin-bottom:34px;text-wrap:pretty}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:14px;max-width:1000px}\n.card{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:18px 18px 20px}\n.card h3{font-size:14px;margin-bottom:7px;display:flex;gap:8px;align-items:center}\n.card h3 span{width:22px;height:22px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--soft);flex:0 0 auto}\n.card p{font-size:13px;color:var(--soft);line-height:1.5;text-wrap:pretty}\n.startbtn{margin-top:34px;display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:#fff;border:none;font:inherit;font-size:14px;font-weight:600;padding:13px 22px;border-radius:10px;cursor:pointer}\n.startbtn:hover{background:#000}\n/* spec */\n.spec{overflow-y:auto;padding:34px 60px 80px;background:#fff}\n.spec-in{max-width:820px}\n.spec h2{font-size:23px;margin:30px 0 10px;padding-top:14px;border-top:1.5px solid var(--line)}\n.spec h3{font-size:17px;margin:22px 0 8px}\n.spec h4,.spec h5{font-size:14.5px;margin:16px 0 6px}\n.spec p{font-size:14px;color:#4a4a46;line-height:1.6;margin-bottom:9px}\n.spec ul{margin:0 0 12px 20px}\n.spec li{font-size:14px;color:#4a4a46;line-height:1.6;margin-bottom:4px}\n.spec code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 5px}\n.spec pre{background:#2b2b28;color:#e8e6df;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.55;padding:14px 16px;border-radius:9px;overflow-x:auto;margin:0 0 14px;white-space:pre-wrap}\n.spec blockquote{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:0 0 12px;font-size:13.5px;color:var(--soft)}\n.spec hr{border:none;border-top:1.5px dashed var(--line);margin:22px 0}\n.notice{background:#fff8e6;border:1.5px solid #f0dfae;border-radius:11px;padding:15px 17px;margin-bottom:26px;font-size:13.5px;color:#6b5a2a;line-height:1.5}\n/* mobile */\n@media (max-width:860px){\n  body{flex-direction:column;overflow:auto;height:auto}\n  .side{width:100%;height:auto;border-right:none;border-bottom:1.5px solid var(--line);position:sticky;top:0;z-index:20}\n  .nav{display:flex;gap:6px;overflow-x:auto;padding:9px 10px;flex:0 0 auto}\n  .navsec,.legend{display:none}\n  .navitem{width:auto;white-space:nowrap;flex:0 0 auto;font-size:13px}\n  .navitem .nl{display:block;font-size:12.5px}\n  .navitem .nn{min-width:0;font-size:11px}\n  .main{height:auto}\n  .view.on{height:auto}\n  .vbody{height:78vh}\n  .cover{padding:34px 22px}\n  .cover h2{font-size:28px}\n  .spec{padding:24px 22px 60px}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003caside class=\"side\">\n  \u003cdiv class=\"brand\">\n    \u003cdiv class=\"k\">Revisión de equipo\u003c/div>\n    \u003ch1>Wireframes · Tienda Shopify\u003c/h1>\n    \u003cdiv class=\"sub\">Estructura de las 5 pantallas principales\u003c/div>\n  \u003c/div>\n  \u003cnav class=\"nav\">\n    \u003cdiv class=\"navsec\">Empezar aquí\u003c/div>\n    \u003cbutton class=\"navitem on\" data-i=\"cover\">\u003cspan class=\"nn\">—\u003c/span>\u003cspan class=\"nl\">Cómo leer esto\u003c/span>\u003c/button>\n    \u003cdiv class=\"navsec\">Pantallas\u003c/div>\n    \u003cbutton class=\"navitem\" data-i=\"0\">\u003cspan class=\"nn\">01\u003c/span>\u003cspan class=\"nl\">Página de inicio\u003c/span>\u003c/button>\u003cbutton class=\"navitem\" data-i=\"1\">\u003cspan class=\"nn\">02\u003c/span>\u003cspan class=\"nl\">Menú de navegación\u003c/span>\u003c/button>\u003cbutton class=\"navitem\" data-i=\"2\">\u003cspan class=\"nn\">03\u003c/span>\u003cspan class=\"nl\">Página de categoría\u003c/span>\u003c/button>\u003cbutton class=\"navitem\" data-i=\"3\">\u003cspan class=\"nn\">04\u003c/span>\u003cspan class=\"nl\">Página de producto\u003c/span>\u003c/button>\u003cbutton class=\"navitem\" data-i=\"4\">\u003cspan class=\"nn\">05\u003c/span>\u003cspan class=\"nl\">Carrito\u003c/span>\u003c/button>\u003cbutton class=\"navitem\" data-i=\"5\">\u003cspan class=\"nn\">06\u003c/span>\u003cspan class=\"nl\">Sección de colecciones · 2 propuestas\u003c/span>\u003c/button>\n  \u003c/nav>\n  \u003cdiv class=\"legend\">\n    \u003cb>Nota\u003c/b>Todo está en gris a propósito: primero acordamos qué va en cada pantalla y en qué orden. Colores, fotos y tipografías vienen después.\n  \u003c/div>\n\u003c/aside>\n\n\u003cdiv class=\"main\">\n\n  \u003csection class=\"view on cover\" data-view=\"cover\">\n    \u003cdiv class=\"k\">Antes de empezar\u003c/div>\n    \u003ch2>Esto es el plano de la tienda, no el diseño final.\u003c/h2>\n    \u003cp class=\"lead\">Cada pantalla muestra qué información aparece, en qué orden y qué puede hacer el cliente en cada paso. Revísalo pensando en el contenido y el recorrido de compra: si algo falta, sobra o está fuera de lugar, ese es el momento de decirlo.\u003c/p>\n    \u003cdiv class=\"cards\">\n      \u003cdiv class=\"card\">\u003ch3>\u003cspan>1\u003c/span>Usa el menú de la izquierda\u003c/h3>\u003cp>Cada pantalla es una sección. Puedes ir y venir libremente; dentro de cada una se hace scroll como en la tienda real.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch3>\u003cspan>2\u003c/span>Los grises son marcadores\u003c/h3>\u003cp>Los rectángulos con una X son fotos por definir. Los textos son de ejemplo: solo indican largo y jerarquía.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch3>\u003cspan>3\u003c/span>Hay cosas que sí funcionan\u003c/h3>\u003cp>Algunos elementos son interactivos para explicar la idea: pestañas, filtros y selectores se pueden hacer clic.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch3>\u003cspan>4\u003c/span>Qué necesitamos de ti\u003c/h3>\u003cp>Comentarios sobre orden de secciones, qué mensajes son prioritarios y una decisión en la pantalla 06 (propuesta A o B).\u003c/p>\u003c/div>\n    \u003c/div>\n    \u003cbutton class=\"startbtn\" data-goto=\"0\">Ver la página de inicio →\u003c/button>\n  \u003c/section>\n\n  \u003csection class=\"view\" data-view=\"0\">\u003cdiv class=\"vhead\">\u003cdiv class=\"vh-l\">\u003cspan class=\"vnum\">01\u003c/span>\u003cdiv>\u003ch2>Página de inicio\u003c/h2>\u003cp>Todo el home de arriba a abajo: portada, colecciones, beneficios, reseñas y cierre. Es el recorrido completo que ve un visitante nuevo.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"vbody\">\u003ciframe loading=\"lazy\" title=\"Página de inicio\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;es&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;Shopify Fashion Homepage — Wireframe&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;style&gt;/* ============================================================\n   Low-fi wireframe system — Excalidraw / hand-drawn vibe\n   Grayscale wireframe + single accent for CRO sticky-notes\n   ============================================================ */\n\n:root{\n  --canvas:#f4f3ef;\n  --paper:#ffffff;\n  --ink:#2b2b2b;\n  --stroke:#3a3a3a;\n  --stroke-soft:#8c8c8c;\n  --fill:#e9e8e4;\n  --fill-2:#dedcd6;\n  --muted:#9a9a96;\n  --note:#fff3bf;        /* sticky note */\n  --note-ink:#5b4b00;\n  --note-edge:#e2cf6b;\n  --accent:#1971c2;      /* arrows / pin */\n  --r:7px;\n}\n\n*{box-sizing:border-box;}\nhtml,body{margin:0;padding:0;}\nbody{\n  background:var(--canvas);\n  color:var(--ink);\n  font-family:'Kalam', 'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Sans MS', cursive;\n  -webkit-font-smoothing:antialiased;\n  /* faint grid like a sketch canvas */\n  background-image:\n    linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(0,0,0,.025) 1px, transparent 1px);\n  background-size:26px 26px;\n}\n\n/* ---------- hand-drawn border via displacement filter ---------- */\n.sketch{position:relative;}\n.sketch::before{\n  content:&quot;&quot;;\n  position:absolute; inset:0;\n  border:1.7px solid var(--stroke);\n  border-radius:9px 7px 10px 8px / 8px 10px 7px 9px;\n  filter:url(#rough);\n  pointer-events:none;\n}\n.sketch.soft::before{border-color:var(--stroke-soft);}\n.sketch.dash::before{border-style:dashed;}\n\n/* ---------- image placeholder ---------- */\n.img{\n  background:var(--fill);\n  background-image:\n    linear-gradient(to top right, transparent calc(50% - .9px), var(--stroke-soft) calc(50% - .9px), var(--stroke-soft) calc(50% + .9px), transparent calc(50% + .9px)),\n    linear-gradient(to top left,  transparent calc(50% - .9px), var(--stroke-soft) calc(50% - .9px), var(--stroke-soft) calc(50% + .9px), transparent calc(50% + .9px));\n  display:flex; align-items:center; justify-content:center;\n  color:var(--muted); font-size:13px; letter-spacing:.5px;\n  min-height:60px; overflow:hidden;\n}\n.img span{background:var(--fill); padding:2px 8px; border-radius:4px;}\n.img.tall{min-height:240px;}\n\n/* ---------- text placeholders ---------- */\n.bar{height:9px;background:var(--fill-2);border-radius:6px;margin:7px 0;}\n.bar.dark{background:#cfcdc6;}\n.h{font-weight:700;line-height:1.12;color:var(--ink);}\n.h1{font-size:30px;}\n.h2{font-size:22px;}\n.h3{font-size:17px;}\n.sub{font-size:14px;color:#6b6b67;line-height:1.3;}\n.tiny{font-size:12px;color:var(--muted);}\n.kicker{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}\n\n/* ---------- buttons ---------- */\n.btn{\n  display:inline-flex;align-items:center;gap:6px;justify-content:center;\n  background:var(--stroke);color:#fff;font-family:inherit;font-size:14px;font-weight:700;\n  padding:10px 18px;border-radius:8px 10px 9px 11px / 11px 9px 10px 8px;\n  position:relative;white-space:nowrap;\n}\n.btn.o{background:transparent;color:var(--ink);}\n.btn.o::before{\n  content:&quot;&quot;;position:absolute;inset:0;border:1.7px solid var(--stroke);\n  border-radius:inherit;filter:url(#rough);\n}\n.btn.sm{padding:6px 12px;font-size:12px;}\n.btn.full{display:flex;width:100%;}\n\n/* ---------- pills / badges / chips ---------- */\n.badge{\n  display:inline-block;font-size:11px;font-weight:700;color:var(--ink);\n  background:var(--paper);padding:3px 9px;border-radius:20px;position:relative;\n}\n.badge::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px solid var(--stroke);border-radius:20px;filter:url(#rough);}\n.chip{\n  display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);\n  background:var(--paper);padding:7px 13px;border-radius:20px;position:relative;white-space:nowrap;\n}\n.chip::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:20px;filter:url(#rough);}\n\n/* ---------- icon placeholder ---------- */\n.ico{\n  width:42px;height:42px;border-radius:50%;background:var(--fill);\n  display:flex;align-items:center;justify-content:center;color:var(--stroke-soft);\n  font-size:18px;position:relative;flex:0 0 auto;\n}\n.ico::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.stars{color:#3a3a3a;letter-spacing:2px;font-size:14px;}\n\n/* ---------- generic blocks ---------- */\n.card{background:var(--paper);padding:12px;border-radius:var(--r);position:relative;}\n.row{display:flex;gap:14px;}\n.col{display:flex;flex-direction:column;}\n.center{align-items:center;text-align:center;}\n.between{justify-content:space-between;align-items:center;}\n.wrap{flex-wrap:wrap;}\n.grow{flex:1 1 0;min-width:0;}\n\n/* ============================================================\n   DEVICE FRAMES\n   ============================================================ */\n.stage{\n  display:flex;flex-direction:column;align-items:center;\n  padding:30px 470px 120px 40px;   /* right padding leaves room for notes */\n}\n@media(max-width:1180px){ .stage{padding-right:40px;} .note{display:none!important;} }\n\n.devwrap{position:relative;}\n\n/* browser chrome (desktop) */\n.browser{width:980px;max-width:100%;background:var(--paper);position:relative;border-radius:12px;}\n.browser&gt;.chrome{\n  height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;\n  border-bottom:1.6px solid var(--fill-2);\n}\n.dot{width:11px;height:11px;border-radius:50%;background:var(--fill-2);}\n.urlbar{flex:1;height:20px;background:var(--fill);border-radius:20px;margin-left:10px;}\n\n/* phone chrome (mobile) */\n.phone{width:392px;max-width:100%;background:var(--paper);position:relative;border-radius:34px;padding:12px;}\n.phone::before{content:&quot;&quot;;position:absolute;inset:0;border:2px solid var(--stroke);border-radius:34px;filter:url(#rough);}\n.phone .screen{border-radius:24px;overflow:hidden;background:var(--paper);position:relative;}\n.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:120px;height:18px;background:var(--stroke);border-radius:20px;z-index:5;}\n\n/* a screen section */\n.section{position:relative;padding:16px;border-bottom:1.4px dashed #e2e0da;}\n.section:last-child{border-bottom:none;}\n.section .secno{\n  position:absolute;left:-13px;top:12px;width:26px;height:26px;border-radius:50%;\n  background:var(--accent);color:#fff;font-size:13px;font-weight:700;\n  display:flex;align-items:center;justify-content:center;z-index:6;\n  box-shadow:0 1px 0 rgba(0,0,0,.15);\n}\n.phone .section .secno{left:-2px;}\n\n/* ---------- CRO sticky notes ---------- */\n.note{\n  position:absolute;left:100%;top:8px;margin-left:54px;width:360px;\n  background:var(--note);color:var(--note-ink);\n  padding:13px 15px 14px;border-radius:3px;\n  box-shadow:2px 3px 0 rgba(0,0,0,.10);\n  transform:rotate(var(--rot,-.5deg)) translateY(var(--ty,0px));font-size:14px;line-height:1.34;\n}\n.note:nth-child(even){--rot:.6deg;}\n.note::before{ /* arrow toward the section */\n  content:&quot;&quot;;position:absolute;right:100%;top:18px;\n  border:9px solid transparent;border-right-color:var(--note);\n  filter:drop-shadow(-1px 1px 0 rgba(0,0,0,.06));\n}\n.note .nt{font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8a6d00;display:block;margin-bottom:3px;}\n.note .obj{display:block;margin-top:7px;font-size:12.5px;color:#6b5600;border-top:1px dashed var(--note-edge);padding-top:6px;}\n.note .obj b{color:#4d3d00;}\n.phone .note{margin-left:46px;}\n\n/* connector pin dot on the section for mobile notes spacing */\n\n/* ---------- layout helpers for content ---------- */\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\n.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}\n.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}\n.scrollrow{display:flex;gap:12px;overflow:hidden;}\n.scrollrow&gt;*{flex:0 0 auto;}\n\n/* announcement bar */\n.annbar{background:var(--stroke);color x;filter:url(#rough);}\n.tab.active{color:var(--ink);font-weight:700;background:var(--paper);}\n.tab.active::before{border-color:var(--stroke);}\n.spacer{flex:1;}\n.toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:#555;cursor:pointer;user-select:none;}\n.toggle input{width:34px;height:19px;appearance:none;background:var(--fill-2);border-radius:20px;position:relative;cursor:pointer;outline:none;transition:.15s;}\n.toggle input:checked{background:var(--accent);}\n.toggle input::after{content:&quot;&quot;;position:absolute;top:2px;left:2px;width:15px;height:15px;background:#fff;border-radius:50%;transition:.15s;}\n.toggle input:checked::after{left:17px;}\n\n.view{display:none;}\n.view.active{display:block;}\n\n/* color-off (pure grayscale) */\nbody.mono{--accent:#3a3a3a;--note:#ececec;--note-ink:#333;--note-edge:#cfcfcf;}\nbody.mono .note .nt{color:#444;}\nbody.mono .note .obj,body.mono .note .obj b{color:#555;}\n\n/* hide notes toggle */\nbody.nonotes .note{display:none;}\nbody.nonotes .stage{padding-right:40px;}\n\n/* ============================================================\n   SHOPIFY MODULES SHEET\n   ============================================================ */\n.sheet{max-width:1080px;margin:0 auto;padding:34px 30px 120px;}\n.sheet h2{font-size:26px;margin:0 0 6px;}\n.sheet .lead{color:#6b6b67;font-size:15px;margin:0 0 26px;max-width:680px;}\n.modgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}\n@media(max-width:760px){.modgrid{grid-template-columns:1fr;}}\n.mod{background:var(--paper);border-radius:10px;padding:16px 18px;position:relative;}\n.mod&gt;.mh{display:flex;align-items:center;gap:10px;margin-bottom:9px;}\n.mod .mn{min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}\n.mod h3{font-size:16px;margin:0;}\n.mod .mtag{font-size:11px;color:var(--muted);}\n.mod .purpose{font-size:13px;color:#6b6b67;line-height:1.4;margin:0 0 11px;}\n.mod .slabel{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8a8a86;margin:0 0 6px;}\n.mod ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px;}\n.mod li{font-size:12px;background:var(--fill);color:#444;padding:4px 9px;border-radius:6px;}\n.mod li.blk{background:#e7eef7;color:#235a8c;}\n\n/* ============================================================\n   COLLECTION PAGE (PLP)\n   ============================================================ */\n/* mini hero band */\n.cmini{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;}\n.cmini .bullets{display:flex;flex-direction:column;gap:5px;margin-top:8px;}\n.cmini .bl{display:flex;align-items:center;gap:7px;font-size:13px;color:#555;}\n\n/* toolbar: count + sort + filter btn */\n.ctoolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;}\n.sortsel{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#444;background:var(--paper);padding:8px 13px;border-radius:8px;position:relative;cursor:pointer;}\n.sortsel::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:8px;filter:url(#rough);}\n.fchips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}\n.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--fill);color:#444;padding:5px 10px;border-radius:20px;}\n.fchip .x{opacity:.6;}\n\n/* filter sidebar */\n.plp{display:flex;gap:22px;align-items:flex-start;}\n.filters{width:212px;flex:0 0 auto;}\n.fgroup{padding:13px 0;border-bottom:1.4px dashed #e2e0da;}\n.fgroup:first-child{padding-top:0;}\n.fgroup h4{font-size:12px;margin:0 0 9px;letter-spacing:1px;text-transform:uppercase;color:#666;display:flex;justify-content:space-between;}\n.fopt{display:flex;align-items:center;gap:8px;font-size:13px;color:#444;margin:8px 0;}\n.fopt .cnt{margin-left:auto; ;font-size:15px;color:#555;z-index:2;opacity:0;transition:opacity .15s;}\n.pimg .garrow::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.pimg .garrow.l{left:7px;}\n.pimg .garrow.r{right:7px;}\n.pcard:hover .pimg .garrow{opacity:1;}\n.pimg .gdots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:#fff;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.4);}\n.pimg .ghint{position:absolute;bottom:8px;right:8px;font-size:9px;color:#777;background:var(--paper);padding:1px 6px;border-radius:8px;z-index:2;}\n\n/* promo tile inside grid */\n.promotile{background:#2f2f2f;color:#fff;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:18px;min-height:200px;position:relative;}\n.promotile .kicker{color:#bdbdbd;}\n.promotile .h{color:#fff;}\n\n/* pagination */\n.loadmore{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0;}\n.pdots{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:13px;}\n\n/* SEO collapsible */\n.seo{padding:14px 0;}\n.seo .barwrap{max-width:760px;}\n\n/* ============================================================\n   PRODUCT PAGE (PDP)\n   ============================================================ */\n.gallery{display:flex;gap:12px;}\n.gthumbs{display:flex;flex-direction:column;gap:9px;width:62px;flex:0 0 auto;}\n.gthumb{aspect-ratio:1;}\n.gthumb.on::before{border-width:2.4px;border-color:var(--stroke);}\n.gmain{flex:1 1 0;min-width:0;aspect-ratio:4/5;position:relative;}\n.buybox{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:13px;}\n.price{display:flex;align-items:center;gap:9px;}\n.price .now{font-size:25px;font-weight:700;}\n.price .was{font-size:15px;color:var(--muted);text-decoration:line-through;}\n.price .off{font-size:11px;font-weight:700;background:var(--stroke);color:#fff;padding:3px 8px;border-radius:5px;}\n.optlabel{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:#666;display:flex;justify-content:space-between;margin-bottom:8px;}\n.optlabel a{color:var(--accent);text-transform:none;letter-spacing:0;}\n.optrow{display:flex;gap:8px;flex-wrap:wrap;}\n.optbox{min-width:44px;text-align:center;padding:10px 13px;border-radius:7px;position:relative;font-size:13px;color:#2b2b2b;cursor:pointer;}\n.optbox::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:7px;filter:url(#rough);}\n.optbox.on{background:var(--stroke);color:#fff;}\n.optbox.on::before{border-color:var(--stroke);}\n.optbox.soldout{opacity:.42;text-decoration:line-through;}\n.swbig{width:32px;height:32px;border-radius:50%;position:relative;cursor:pointer;}\n.swbig::before{content:&quot;&quot;;position:absolute;inset:-1px;border:1.5px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.swbig.on::after{content:&quot;&quot;;position:absolute;inset:-5px;border:1.7px solid var(--stroke);border-radius:50%;}\n.qtybox{display:inline-flex;align-items:center;border-radius:8px;position:relative;}\n.qtybox::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:8px;filter:url(#rough);}\n.qtybox span{padding:9px 13px;font-size:15px;}\n.qtybox .n{min-width:34px;text-align:center;font-weight:700;}\n.atc{display:flex;width:100%;padding:15px;font-size:15px;}\n.express{display:flex;flex-direction:column;gap:7px;}\n.exbtn{display:flex;align-items:center;justify-content:center;width:100%;padding:12px;border-radius:8px;position:relative;font-size:13px;color:#444;background:var(--fill);}\n.exbtn::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:8px;filter:url(#rough);}\n.urgency{display:flex;align-items:center;gap:8px;font-size:13px;color:#7a4a00;}\n.urgency .dotred{width:8px;height:8px;border-radius:50%;background:#b06a00;flex:0 0 auto;}\n.acc{border-top:1 ============= */\n.cartdrawer{width:432px;max-width:100%;background:var(--paper);border-radius:14px;position:relative;}\n.metabar{display:flex;flex-direction:column;gap:7px;}\n.mtrack{height:11px;background:var(--fill);border-radius:7px;overflow:hidden;position:relative;}\n.mfill{height:100%;background:#4a4a4a;border-radius:7px;}\n.metatiers{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}\n.metatiers b{color:#2b2b2b;}\n.litem{display:flex;gap:12px;padding:13px 0;border-bottom:1.4px dashed #e2e0da;}\n.litem .limg{width:70px;height:86px;flex:0 0 auto;}\n.litem .lrm{font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer;}\n.codebox{display:flex;gap:8px;}\n.codebox .field{flex:1;height:40px;display:flex;align-items:center;padding:0 12px;color:var(--muted);font-size:13px;position:relative;background:var(--paper);border-radius:8px;}\n.codebox .field::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:8px;filter:url(#rough);}\n.paystrip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center;}\n.guar{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:2px;}\n.guar .g{display:flex;align-items:center;gap:6px;font-size:12px;color:#666;}\n.upsell{display:flex;align-items:center;gap:11px;padding:10px;background:#fafaf8;border-radius:9px;position:relative;}\n.upsell::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px dashed var(--stroke-soft);border-radius:9px;filter:url(#rough);}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n\n&lt;!-- hand-drawn displacement filter --&gt;\n&lt;svg width=&quot;0&quot; height=&quot;0&quot; style=&quot;position:absolute&quot;&gt;\n  &lt;filter id=&quot;rough&quot;&gt;\n    &lt;feTurbulence type=&quot;fractalNoise&quot; baseFrequency=&quot;0.013&quot; numOctaves=&quot;2&quot; seed=&quot;7&quot; result=&quot;noise&quot;/&gt;\n    &lt;feDisplacementMap in=&quot;SourceGraphic&quot; in2=&quot ecno&quot;&gt;12&lt;/span&gt;\n    &lt;div class=&quot;h h3&quot; style=&quot;margin-bottom:10px&quot;&gt;FAQ&lt;/div&gt;\n    &lt;div class=&quot;col&quot; style=&quot;gap:8px&quot;&gt;\n      &lt;div class=&quot;card sketch row between&quot;&gt;&lt;span style=&quot;font-size:13px&quot;&gt;¿Cuánto tarda el envío?&lt;/span&gt;&lt;span class=&quot;tiny&quot;&gt;+&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;card sketch row between&quot;&gt;&lt;span style=&quot;font-size:13px&quot;&gt;¿Puedo hacer cambios?&lt;/span&gt;&lt;span class=&quot;tiny&quot;&gt;+&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;card sketch row between&quot;&gt;&lt;span style=&quot;font-size:13px&quot;&gt;¿Se ve como en fotos?&lt;/span&gt;&lt;span class=&quot;tiny&quot;&gt;+&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;card sketch row between&quot;&gt;&lt;span style=&quot;font-size:13px&quot;&gt;¿Sirve para regalo?&lt;/span&gt;&lt;span class=&quot;tiny&quot;&gt;+&lt;/span&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;nt&quot;&gt;FAQ&lt;/span&gt;Acordeón, máx. 5, respuestas cortas.&lt;span class=&quot;obj&quot;&gt;&lt;b&gt;CRO:&lt;/b&gt; resuelve objeciones finales.&lt;/span&gt;&lt;/div&gt;\n  &lt;/div&gt;\n\n  &lt;!-- 13 FINAL CTA --&gt;\n  &lt;div class=&quot;section&quot;&gt;\n    &lt;span class=&quot;secno&quot;&gt;13&lt;/span&gt;\n    &lt;div class=&quot;img sketch&quot; style=&quot;aspect-ratio:4/3;align-items:center;justify-content:center&quot;&gt;\n      &lt;div class=&quot;col center&quot; style=&quot;gap:10px;z-index:2;padding:0 16px&quot;&gt;&lt;div class=&quot;h h2&quot; style=&quot;font-size:20px;color:#3a3a3a&quot;&gt;Encuentra la pieza que completa tu estilo&lt;/div&gt;&lt;span class=&quot;btn&quot;&gt;Ver colección →&lt;/span&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;nt&quot;&gt;Final CTA&lt;/span&gt;Cierre corto y directo sobre imagen.&lt;span class=&quot;obj&quot;&gt;&lt;b&gt;CRO:&lt;/b&gt; última conversión hacia la colección.&lt;/span&gt;&lt;/div&gt;\n  &lt;/div&gt;\n\n  &lt;!-- 14 FOOTER --&gt;\n  &lt;div class=&quot;section&quot; style=&quot;background:#fafaf8&quot;&gt;\n    &lt;span class=&quot;secno&quot;&gt;14&lt;/span&gt;\n    &lt;div class=&quot;col&quot; style=&quot;gap:10px&quot;&gt;\n      &lt;div class=&quot;logo&quot;&gt;LOGO&lt;/div&gt;\n      &lt;span class=&quot;tiny&quot;&gt;Newsletter — 10% en tu 1ra compra&lt;/span&gt;\n      &lt;div class=&quot;row&quot; style=&quot;gap:6px&quot;&gt;&lt;div class=&quot;img sketch grow&quot; style=&quot;min-height:32px&quot;&gt;&lt;span&gt;tu@email&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;btn sm&quot;&gt;Unirme&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;row wrap&quot; style=&quot;gap:10px;margin-top:4px&quot;&gt;&lt;span class=&quot;tiny&quot;&gt;Tienda&lt;/span&gt;&lt;span class=&quot;tiny&quot;&gt;Ayuda&lt;/span&gt;&lt;span class=&quot;tiny&quot;&gt;Contacto&lt;/span&gt;&lt;span class=&quot;tiny&quot;&gt;Políticas&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;row&quot; style=&quot;gap:8px&quot;&gt;&lt;div class=&quot;ico&quot; style=&quot;width:28px;height:28px&quot;&gt;◯&lt;/div&gt;&lt;div class=&quot;ico&quot; style=&quot;width:28px;height:28px&quot;&gt;◯&lt;/div&gt;&lt;div class=&quot;ico&quot; style=&quot;width:28px;height:28px&quot;&gt;◯&lt;/div&gt;&lt;/div&gt;\n      &lt;div class=&quot;row wrap&quot; style=&quot;gap:6px;border-top:1.4px dashed #ddd;padding-top:10px&quot;&gt;&lt;span class=&quot;badge&quot;&gt;VISA&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;MC&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;AMEX&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;PayPal&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;OXXO&lt;/span&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;nt&quot;&gt;Footer&lt;/span&gt;Links, políticas, redes, pagos, newsletter.&lt;span class=&quot;obj&quot;&gt;&lt;b&gt;CRO:&lt;/b&gt; confianza final + captura de email.&lt;/span&gt;&lt;/div&gt;\n  &lt;/div&gt;\n\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;!-- ===================================================================\n     SHOPIFY MODULES SHEET\n     =================================================================== --&gt;\n&lt;div class=&quot;view&quot; id=&quot;view-modules&quot;&gt;\n&lt;div class=&quot;sheet&quot;&gt;\n  &lt;h2&gt;Secciones editables de Shopify&lt;/h2&gt;\n  &lt;p class=&quot;lead&quot;&gt;Cada bloque del wireframe se construye como una &lt;b&gt;section&lt;/b&gt; del theme con su schema de settings. Todas incluyen: activar/desactivar sección, color de fondo, alineación, padding superior/inferior, imagen desktop + imagen mobile, y bloques repetibles donde aplica. Etiquetas en &lt;span style=&quot;color:#235a8c&quot;&gt;azul&lt;/span&gt; = settings clave de conversión.&lt;/p&gt;\n  &lt;div class=&quot;modgrid&quot; id=&quot;modgrid&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;script&gt;\n/* ---------- view switcher ---------- */\nconst tabs=document.querySelectorAll('.tab');\nconst views={desktop:'view-desktop',mobile:'view-mobile',modules:'view-modules'};\nfunction setView(v){\n  tabs.forEach(t=&gt;t.classList.toggle('active',t.dataset.view===v));\n  Object.entries(views).forEach(([k,id])=&gt;document.getElementById(id).classList.toggle('active',k===v));\n  localStorage.setItem('wf_view',v);\n  window.scrollTo(0,0);\n  if(typeof layoutNotes==='function') requestAnimationFrame(layoutNotes);\n}\ntabs.forEach(t=&gt;t.addEventListener('click',()=&gt;setView(t.dataset.view)));\nsetView(localStorage.getItem('wf_view')||'desktop');\n\n/* ---------- toggles ---------- */\nconst tNotes=document.getElementById('t-notes'), tColor=document.getElementById('t-color');\nfunction applyToggles(){\n  document.body.classList.toggle('nonotes',!tNotes.checked);\n  document.body.classList.toggle('mono',!tColor.checked);\n  localStorage.setItem('wf_notes',tNotes.checked);localStorage.setItem('wf_color',tColor.checked);\n  if(typeof layoutNotes==='function') requestAnimationFrame(layoutNotes);\n}\ntNotes.checked=localStorage.getItem('wf_notes')!=='false';\ntColor.checked=localStorage.getItem('wf_color')!=='false';\ntNotes.addEventListener('change',applyToggles);tColor.addEventListener('change',applyToggles);\napplyToggles();\n\n/* ---------- note collision avoidance ----------\n   Absolute notes anchor to their section top; on short sections a note\n   would overlap the next one. Push each note down so it never starts\n   before the previous note ends. Re-runs on view/toggle/resize/fonts. */\nfunction layoutNotes(){\n  if(document.body.classList.contains('nonotes')) return;\n  const active=document.querySelector('.view.active');\n  if(!active) return;\n  const notes=[...active.querySelectorAll('.note')];\n  notes.forEach(n=&gt;n.style.setProperty('--ty','0px'));\n  const GAP=16; let prevBottom=-Infinity;\n  notes.forEach(n=&gt;{\n    const r=n.getBoundingClientRect();\n    if(r.height===0) return;\n    let ty=0;\n    if(r.top &lt; prevBottom+GAP){ ty=(prevBottom+GAP)-r.top; n.style.setProperty('--ty',ty+'px'); }\n    prevBottom=r.top+ty+r.height;\n  });\n}\nlet rT;\nfunction scheduleLayout(){clearTimeout(rT);rT=setTimeout(layoutNotes,60);}\nwindow.addEventListener('resize',scheduleLayout);\nwindow.addEventListener('load',layoutNotes);\nif(document.fonts&amp;&amp;document.fonts.ready){document.fonts.ready.then(layoutNotes);}\nsetTimeout(layoutNotes,300);\n\n/* ---------- collection tabs (bestsellers) ---------- */\ndocument.querySelectorAll('.wtabs[data-tabs]').forEach(group=&gt;{\n  const key=group.dataset.tabs;\n  const panes=document.querySelector('[data-panes=&quot;'+key+'&quot;]');\n  group.querySelectorAll('.wtab').forEach(tab=&gt;{\n    tab.addEventListener('click',()=&gt;{\n      group.querySelectorAll('.wtab').forEach(t=&gt;t.classList.toggle('on',t===tab));\n      const i=+tab.dataset.tab;\n      panes.querySelectorAll(':scope &gt; .tabpane').forEach((p,idx)=&gt;p.classList.toggle('on',idx===i));\n      if(typeof layoutNotes==='function') requestAnimationFrame(layoutNotes);\n    });\n  });\n});\n\n/* ---------- modules data ---------- */\nconst MODS=[\n {n:1,name:'Announcement bar',tag:'announcement-bar.liquid',purpose:'Barra superior delgada con mensaje de confianza u oferta, rotatorio.',s:['mensaje (rich text)','*múltiples mensajes (blocks)*','*velocidad rotación*','link opcional','color fondo/texto','mostrar/ocultar']},\n {n:2,name:'Header',tag:'header.liquid',purpose:'Logo, menú principal, búsqueda, cuenta y carrito. Sticky.',s:['logo + ancho','menú (linklist)','*sticky on/off*','*mostrar búsqueda*','icono cuenta','*carrito tipo (drawer/page)*','transparente sobre hero']},\n {n:3,name:'Hero lifestyle',tag:'hero-banner.liquid',purpose:'Banner aspiracional con 3 layouts seleccionables: imagen+lista, centrado+reviews, dark overlay.',s:['*layout (V1/V2/V3)*','imagen desktop','imagen mobile','*rating + nº reviews*','headline','*beneficios checklist (blocks)*','*CTA texto/link*','chips / &quot;visto en&quot;','tema claro/oscuro','overlay %','altura']},\n {n:'OPC',name:'Press / logos (opcional)',tag:'logo-list.liquid',purpose:'Tira delgada de logos de prensa bajo el hero. Activar solo si la marca tiene menciones reales.',s:['*activar/desactivar sección*','logos (blocks img)','título (&quot;Visto en prensa&quot;)','*nº por fila desktop/mobile*','escala de grises on/off','color fondo']},\n {n:4,name:'Featured collection',tag:'featured-collection.liquid',purpose:'Bestsellers con tabs de colección (Más vendidos, Nuevos, Regalos, Edición limitada) y product cards.',s:['*tabs de colección (blocks)*','*colección por tab*','*nº productos*','*subtítulo/categoría/vendor*','*descripción breve*','*mostrar precio/rating*','*badges*','*quick add on/off*','columnas desktop/mobile','*posición &quot;ver todos&quot;*']},\n {n:5,name:'Category cards',tag:'collection-list.liquid',purpose:'Grid de categorías por estilo u ocasión.',s:['bloques de categoría (img+título+link)','*columnas desktop (3/4)*','*columnas mobile (2/carrusel)*','forma imagen','mostrar CTA','título sección']},\n {n:6,name:'Brand mood (image+text)',tag:'image-with-text.liquid',purpose:'Bloque emocional imagen + texto aspiracional.',s:['imagen desktop/mobile','headline','texto (2 líneas)','CTA texto/link','*posición imagen (izq/der)*','color fondo','alineación']},\n {n:7,name:'UGC / video grid',tag:'ugc-grid.liquid',purpose:'Grid de fotos/videos reales tipo IG/TikTok, con producto destacado opcional bajo cada uno (shoppable).',s:['bloques (img o video/url)','*producto destacado por video*','*nº items (4–6)*','*aspect ratio (9:16)*','autoplay mute','desktop grid / mobile carrusel','título']},\n {n:8,name:'Benefits icons',tag:'icon-benefits.liquid',purpose:'3–5 diferenciadores con ícono, título y 1 línea.',s:['bloques (icono+título+texto)','*nº columnas desktop*','mobile (stack/carrusel)','set de iconos','color fondo','alineación']},\n {n:9,name:'Featured reviews',tag:'reviews.liquid',purpose:'Reviews destacadas con estrellas, imagen del producto comprado y comprador.',s:['bloques (texto+nombre+rating+*imagen producto*)','*rating promedio + total*','*columnas / carrusel*','fuente (manual o app)','título']},\n {n:10,name:'Lookbook grid',tag:'lookbook.liquid',purpose:'Collage editorial de looks con CTA a colección.',s:['bloques look (img+label+link)','*nº looks (2–3)*','layout (collage/row)','mobile carrusel','CTA colección']},\n {n:11,name:'Brand story',tag:'image-with-text.liquid',purpose:'Historia de marca corta y aspiracional.',s:['imagen','kicker','headline','texto (≤3 líneas)','CTA secundario','posición imagen','color fondo']},\n {n:12,name:'FAQ accordion',tag:'faq.liquid',purpose:'Acordeón de objeciones finales, máx. 5.',s:['bloques (pregunta+respuesta)','*nº visible*','abrir primera','título','color fondo','alineación']},\n {n:13,name:'Final CTA banner',tag:'cta-banner.liquid',purpose:'Cierre visual que regresa a la colección.',s:['imagen / color fondo','headline','*CTA texto/link*','overlay %','altura','alineación']},\n {n:14,name:'Footer',tag:'footer.liquid',purpose:'Links, políticas, redes, pagos y newsletter.',s:['menús (linklists)','*newsletter on/off*','redes sociales','*métodos de pago*','texto legal','logo','color fondo']},\n];\nconst grid=document.getElementById('modgrid');\ngrid.innerHTML=MODS.map(m=&gt;`\n &lt;div class=&quot;mod sketch&quot;&gt;\n   &lt;div class=&quot;mh&quot;&gt;&lt;span class=&quot;mn&quot;&gt;${m.n}&lt;/span&gt;&lt;div&gt;&lt;h3&gt;${m.name}&lt;/h3&gt;&lt;span class=&quot;mtag&quot;&gt;${m.tag}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\n   &lt;p class=&quot;purpose&quot;&gt;${m.purpose}&lt;/p&gt;\n   &lt;p class=&quot;slabel&quot;&gt;Settings&lt;/p&gt;\n   &lt;ul&gt;${m.s.map(x=&gt;{const b=x.startsWith('*');const t=x.replace(/\\*/g,'');return `&lt;li class=&quot;${b?'blk':''}&quot;&gt;${t}&lt;/li&gt;`;}).join('')}&lt;/ul&gt;\n &lt;/div&gt;`).join('');\n&lt;/script&gt;\n\n&lt;template id=&quot;__bundler_thumbnail&quot;&gt;\n&lt;svg viewBox=&quot;0 0 100 100&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;&lt;rect width=&quot;100&quot; height=&quot;100&quot; fill=&quot;#f4f3ef&quot;/&gt;&lt;g stroke=&quot;#3a3a3a&quot; stroke-width=&quot;2.4&quot; fill=&quot;none&quot;&gt;&lt;rect x=&quot;30&quot; y=&quot;22&quot; width=&quot;40&quot; height=&quot;56&quot; rx=&quot;5&quot;/&gt;&lt;line x1=&quot;30&quot; y1=&quot;34&quot; x2=&quot;70&quot; y2=&quot;34&quot;/&gt;&lt;rect x=&quot;36&quot; y=&quot;40&quot; width=&quot;28&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;#e9e8e4&quot;/&gt;&lt;line x1=&quot;36&quot; y1=&quot;62&quot; x2=&quot;58&quot; y2=&quot;62&quot;/&gt;&lt;line x1=&quot;36&quot; y1=&quot;68&quot; x2=&quot;64&quot; y2=&quot;68&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;\n&lt;/template&gt;\n\n&lt;/body&gt;\n&lt;/html&gt;\n\">\u003c/iframe>\u003c/div>\u003c/section>\u003csection class=\"view\" data-view=\"1\">\u003cdiv class=\"vhead\">\u003cdiv class=\"vh-l\">\u003cspan class=\"vnum\">02\u003c/span>\u003cdiv>\u003ch2>Menú de navegación\u003c/h2>\u003cp>Cómo se abre el menú y cómo el cliente encuentra las categorías, en computadora y en celular.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"vbody\">\u003ciframe loading=\"lazy\" title=\"Menú de navegación\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;es&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;Navigation Menu — Wireframe&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;style&gt;/* ============================================================\n   Low-fi wireframe system — Excalidraw / hand-drawn vibe\n   Grayscale wireframe + single accent for CRO sticky-notes\n   ============================================================ */\n\n:root{\n  --canvas:#f4f3ef;\n  --paper:#ffffff;\n  --ink:#2b2b2b;\n  --stroke:#3a3a3a;\n  --stroke-soft:#8c8c8c;\n  --fill:#e9e8e4;\n  --fill-2:#dedcd6;\n  --muted:#9a9a96;\n  --note:#fff3bf;        /* sticky note */\n  --note-ink:#5b4b00;\n  --note-edge:#e2cf6b;\n  --accent:#1971c2;      /* arrows / pin */\n  --r:7px;\n}\n\n*{box-sizing:border-box;}\nhtml,body{margin:0;padding:0;}\nbody{\n  background:var(--canvas);\n  color:var(--ink);\n  font-family:'Kalam', 'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Sans MS', cursive;\n  -webkit-font-smoothing:antialiased;\n  /* faint grid like a sketch canvas */\n  background-image:\n    linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(0,0,0,.025) 1px, transparent 1px);\n  background-size:26px 26px;\n}\n\n/* ---------- hand-drawn border via displacement filter ---------- */\n.sketch{position:relative;}\n.sketch::before{\n  content:&quot;&quot;;\n  position:absolute; inset:0;\n  border:1.7px solid var(--stroke);\n  border-radius:9px 7px 10px 8px / 8px 10px 7px 9px;\n  filter:url(#rough);\n  pointer-events:none;\n}\n.sketch.soft::before{border-color:var(--stroke-soft);}\n.sketch.dash::before{border-style:dashed;}\n\n/* ---------- image placeholder ---------- */\n.img{\n  background:var(--fill);\n  background-image:\n    linear-gradient(to top right, transparent calc(50% - .9px), var(--stroke-soft) calc(50% - .9px), var(--stroke-soft) calc(50% + .9px), transparent calc(50% + .9px)),\n    linear-gradient(to top left,  transparent calc(50% - .9px), var(--stroke-soft) calc(50% - .9px), var(--stroke-soft) calc(50% + .9px), transparent calc(50% + .9px));\n  display:flex; align-items:center; justify-content:center;\n  color:var(--muted); font-size:13px; letter-spacing:.5px;\n  min-height:60px; overflow:hidden;\n}\n.img span{background:var(--fill); padding:2px 8px; border-radius:4px;}\n.img.tall{min-height:240px;}\n\n/* ---------- text placeholders ---------- */\n.bar{height:9px;background:var(--fill-2);border-radius:6px;margin:7px 0;}\n.bar.dark{background:#cfcdc6;}\n.h{font-weight:700;line-height:1.12;color:var(--ink);}\n.h1{font-size:30px;}\n.h2{font-size:22px;}\n.h3{font-size:17px;}\n.sub{font-size:14px;color:#6b6b67;line-height:1.3;}\n.tiny{font-size:12px;color:var(--muted);}\n.kicker{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}\n\n/* ---------- buttons ---------- */\n.btn{\n  display:inline-flex;align-items:center;gap:6px;justify-content:center;\n  background:var(--stroke);color:#fff;font-family:inherit;font-size:14px;font-weight:700;\n  padding:10px 18px;border-radius:8px 10px 9px 11px / 11px 9px 10px 8px;\n  position:relative;white-space:nowrap;\n}\n.btn.o{background:transparent;color:var(--ink);}\n.btn.o::before{\n  content:&quot;&quot;;position:absolute;inset:0;border:1.7px solid var(--stroke);\n  border-radius:inherit;filter:url(#rough);\n}\n.btn.sm{padding:6px 12px;font-size:12px;}\n.btn.full{display:flex;width:100%;}\n\n/* ---------- pills / badges / chips ---------- */\n.badge{\n  display:inline-block;font-size:11px;font-weight:700;color:var(--ink);\n  background:var(--paper);padding:3px 9px;border-radius:20px;position:relative;\n}\n.badge::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px solid var(--stroke);border-radius:20px;filter:url(#rough);}\n.chip{\n  display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);\n  background:var(--paper);padding:7px 13px;border-radius:20px;position:relative;white-space:nowrap;\n}\n.chip::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:20px;filter:url(#rough);}\n\n/* ---------- icon placeholder ---------- */\n.ico{\n  width:42px;height:42px;border-radius:50%;background:var(--fill);\n  display:flex;align-items:center;justify-content:center;color:var(--stroke-soft);\n  font-size:18px;position:relative;flex:0 0 auto;\n}\n.ico::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.stars{color:#3a3a3a;letter-spacing:2px;font-size:14px;}\n\n/* ---------- generic blocks ---------- */\n.card{background:var(--paper);padding:12px;border-radius:var(--r);position:relative;}\n.row{display:flex;gap:14px;}\n.col{display:flex;flex-direction:column;}\n.center{align-items:center;text-align:center;}\n.between{justify-content:space-between;align-items:center;}\n.wrap{flex-wrap:wrap;}\n.grow{flex:1 1 0;min-width:0;}\n\n/* ============================================================\n   DEVICE FRAMES\n   ============================================================ */\n.stage{\n  display:flex;flex-direction:column;align-items:center;\n  padding:30px 470px 120px 40px;   /* right padding leaves room for notes */\n}\n@media(max-width:1180px){ .stage{padding-right:40px;} .note{display:none!important;} }\n\n.devwrap{position:relative;}\n\n/* browser chrome (desktop) */\n.browser{width:980px;max-width:100%;background:var(--paper);position:relative;border-radius:12px;}\n.browser&gt;.chrome{\n  height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;\n  border-bottom:1.6px solid var(--fill-2);\n}\n.dot{width:11px;height:11px;border-radius:50%;background:var(--fill-2);}\n.urlbar{flex:1;height:20px;background:var(--fill);border-radius:20px;margin-left:10px;}\n\n/* phone chrome (mobile) */\n.phone{width:392px;max-width:100%;background:var(--paper);position:relative;border-radius:34px;padding:12px;}\n.phone::before{content:&quot;&quot;;position:absolute;inset:0;border:2px solid var(--stroke);border-radius:34px;filter:url(#rough);}\n.phone .screen{border-radius:24px;overflow:hidden;background:var(--paper);position:relative;}\n.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:120px;height:18px;background:var(--stroke);border-radius:20px;z-index:5;}\n\n/* a screen section */\n.section{position:relative;padding:16px;border-bottom:1.4px dashed #e2e0da;}\n.section:last-child{border-bottom:none;}\n.section .secno{\n  position:absolute;left:-13px;top:12px;width:26px;height:26px;border-radius:50%;\n  background:var(--accent);color:#fff;font-size:13px;font-weight:700;\n  display:flex;align-items:center;justify-content:center;z-index:6;\n  box-shadow:0 1px 0 rgba(0,0,0,.15);\n}\n.phone .section .secno{left:-2px;}\n\n/* ---------- CRO sticky notes ---------- */\n.note{\n  position:absolute;left:100%;top:8px;margin-left:54px;width:360px;\n  background:var(--note);color:var(--note-ink);\n  padding:13px 15px 14px;border-radius:3px;\n  box-shadow:2px 3px 0 rgba(0,0,0,.10);\n  transform:rotate(var(--rot,-.5deg)) translateY(var(--ty,0px));font-size:14px;line-height:1.34;\n}\n.note:nth-child(even){--rot:.6deg;}\n.note::before{ /* arrow toward the section */\n  content:&quot;&quot;;position:absolute;right:100%;top:18px;\n  border:9px solid transparent;border-right-color:var(--note);\n  filter:drop-shadow(-1px 1px 0 rgba(0,0,0,.06));\n}\n.note .nt{font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8a6d00;display:block;margin-bottom:3px;}\n.note .obj{display:block;margin-top:7px;font-size:12.5px;color:#6b5600;border-top:1px dashed var(--note-edge);padding-top:6px;}\n.note .obj b{color:#4d3d00;}\n.phone .note{margin-left:46px;}\n\n/* connector pin dot on the section for mobile notes spacing */\n\n/* ---------- layout helpers for content ---------- */\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\n.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}\n.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}\n.scrollrow{display:flex;gap:12px;overflow:hidden;}\n.scrollrow&gt;*{flex:0 0 auto;}\n\n/* announcement bar */\n.annbar{background:var(--stroke);color:#fff;text-align:center;font-size:12px;letter-spacing:1px;padding:8px;display:flex;align-items:center;justify-content:center;gap:14px;}\n.annbar .ar{opacity:.6;}\n\n/* header */\n.hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 2px;}\n.logo{font-weight:700;font-size:18px;letter-spacing:1px;}\n.nav{display:flex;gap:16px;font-size:13px;color:#555;}\n\n/* product card */\n.pcard .pimg{aspect-ratio:3/4;}\n.pcard .pcat{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-top:8px;}\n.pcard .pname{font-size:13px;margin-top:2px;}\n.pcard .pprice{font-size:13px;font-weight:700;}\n.pcard .pdesc{font-size:11.5px;color:#7a7a76;line-height:1.3;margin-top:5px;}\n\n/* press logos strip */\n.logoph{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:19px;letter-spacing:1px;color:#8a8a86;}\n.section.opt .secno{background:transparent;color:var(--accent);border:1.6px dashed var(--accent);width:auto;min-width:26px;padding:0 7px;border-radius:13px;font-size:10px;letter-spacing:.5px;}\nbody.mono .section.opt .secno{color:#555;border-color:#888;}\n\n/* featured product under UGC video */\n.miniprod{display:flex;align-items:center;gap:8px;padding:7px;margin-top:8px;background:var(--paper);border-radius:7px;}\n.miniprod .mp-img{width:34px;height:34px;flex:0 0 auto;}\n.miniprod .mp-name{font-size:12px;font-weight:700;color:#2b2b2b;line-height:1.1;}\n\n/* collection tabs (inside a wireframe section) */\n.wtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}\n.wtab{\n  font-family:inherit;font-size:13px;cursor:pointer;background:var(--paper);\n  color:#666;padding:6px 13px;border-radius:20px;position:relative;white-space:nowrap;\n}\n.wtab::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:20px;filter:url(#rough);}\n.wtab.on{color:var(--ink);font-weight:700;background:var(--stroke);color:#fff;}\n.wtab.on::before{border-color:var(--stroke);}\n.wtab.scroll{overflow-x:auto;}\n.tabpane:not(.on){display:none!important;}\n\n/* hero variant helpers */\n.btn.inv{background:#fff;color:#2b2b2b;}\n.checklist{display:flex;flex-direction:column;gap:8px;}\n.ck{display:flex;gap:8px;align-items:center;font-size:14px;}\n.ck-mark{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--fill-2);color:#444;flex:0 0 auto;}\n.avstack{display:flex;align-items:center;}\n.avstack .av{width:26px;height:26px;border-radius:50%;background:var(--fill-2);border:2px solid #fff;margin-left:-8px;position:relative;}\n.avstack .av:first-child{margin-left:0;}\n.darkhero{background:#2f2f2f;color:#fff;border-radius:10px;overflow:hidden;position:relative;}\n.darkhero .kicker,.darkhero .sub,.darkhero .tiny{color:#c9c9c9;}\n.darkhero .chip{color:#fff;background:rgba(255,255,255,.06);}\n.darkhero .chip::before{border-color:#7d7d7d;}\n.darkhero .ck-mark{backg es toggle */\nbody.nonotes .note{display:none;}\nbody.nonotes .stage{padding-right:40px;}\n\n/* ============================================================\n   SHOPIFY MODULES SHEET\n   ============================================================ */\n.sheet{max-width:1080px;margin:0 auto;padding:34px 30px 120px;}\n.sheet h2{font-size:26px;margin:0 0 6px;}\n.sheet .lead{color:#6b6b67;font-size:15px;margin:0 0 26px;max-width:680px;}\n.modgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}\n@media(max-width:760px){.modgrid{grid-template-columns:1fr;}}\n.mod{background:var(--paper);border-radius:10px;padding:16px 18px;position:relative;}\n.mod&gt;.mh{display:flex;align-items:center;gap:10px;margin-bottom:9px;}\n.mod .mn{min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}\n.mod h3{font-size:16px;margin:0;}\n.mod .mtag{font-size:11px;color:var(--muted);}\n.mod .purpose{font-size:13px;color:#6b6b67;line-height:1.4;margin:0 0 11px;}\n.mod .slabel{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8a8a86;margin:0 0 6px;}\n.mod ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px;}\n.mod li{font-size:12px;background:var(--fill);color:#444;padding:4px 9px;border-radius:6px;}\n.mod li.blk{background:#e7eef7;color:#235a8c;}\n\n/* ============================================================\n   COLLECTION PAGE (PLP)\n   ============================================================ */\n/* mini hero band */\n.cmini{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;}\n.cmini .bullets{display:flex;flex-direction:column;gap:5px;margin-top:8px;}\n.cmini .bl{display:flex;align-items:center;gap:7px;font-size:13px;color:#555;}\n\n/* toolbar: count + sort + filter btn */\n.ctoolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:w ot;;position:absolute;inset:-5px;border:1.7px solid var(--stroke);border-radius:50%;}\n.qtybox{display:inline-flex;align-items:center;border-radius:8px;position:relative;}\n.qtybox::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:8px;filter:url(#rough);}\n.qtybox span{padding:9px 13px;font-size:15px;}\n.qtybox .n{min-width:34px;text-align:center;font-weight:700;}\n.atc{display:flex;width:100%;padding:15px;font-size:15px;}\n.express{display:flex;flex-direction:column;gap:7px;}\n.exbtn{display:flex;align-items:center;justify-content:center;width:100%;padding:12px;border-radius:8px;position:relative;font-size:13px;color:#444;background:var(--fill);}\n.exbtn::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:8px;filter:url(#rough);}\n.urgency{display:flex;align-items:center;gap:8px;font-size:13px;color:#7a4a00;}\n.urgency .dotred{width:8px;height:8px;border-radius:50%;background:#b06a00;flex:0 0 auto;}\n.acc{border-top:1.4px dashed #e2e0da;}\n.acc:last-of-type{border-bottom:1.4px dashed #e2e0da;}\n.acc .ahead{display:flex;align-items:center;justify-content:space-between;padding:13px 0;font-size:14px;font-weight:700;}\n/* review breakdown */\n.revsum{display:flex;gap:26px;align-items:center;flex-wrap:wrap;}\n.revbars{flex:1 1 240px;min-width:200px;display:flex;flex-direction:column;gap:5px;}\n.revrow{display:flex;align-items:center;gap:9px;font-size:12px;color:#666;}\n.revrow .track{flex:1;height:8px;background:var(--fill);border-radius:5px;overflow:hidden;}\n.revrow .fill{height:100%;background:#4a4a4a;}\n.bignum{font-size:40px;font-weight:700;line-height:1;}\n/* sticky add-to-cart bar (mobile) */\n.stickybar{position:sticky;bottom:0;z-index:8;background:var(--paper);border-top:1.5px solid #e2e0da;display:flex;align-items:center;gap:10px;padding:10px 14px;}\n.stickybar .sp{display:flex;flex-direction:column;}\n/* complete the look */\n.cline{display:flex;ali
