t;/span&gt;&lt;div class=&quot;ctitle&quot;&gt;Sport Luxury&lt;/div&gt;&lt;div class=&quot;cdesc&quot;&gt;Cómodo y premium&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;/div&gt;\n          &lt;/div&gt;\n          &lt;div class=&quot;row&quot; style=&quot;gap:16px;margin-top:14px;flex-wrap:wrap&quot;&gt;\n            &lt;span class=&quot;qlink&quot; style=&quot;border:none;padding:6px 0&quot;&gt;Ver todo →&lt;/span&gt;\n            &lt;span class=&quot;qlink&quot; style=&quot;border:none;padding:6px 0&quot;&gt;Shop Bundles &lt;span class=&quot;badge&quot; style=&quot;margin-left:4px&quot;&gt;Ahorra 50%&lt;/span&gt;&lt;/span&gt;\n            &lt;span class=&quot;qlink&quot; style=&quot;border:none;padding:6px 0&quot;&gt;Regalos →&lt;/span&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n        &lt;!-- featured + social proof --&gt;\n        &lt;div class=&quot;col&quot; style=&quot;flex:1 1 0;gap:12px;border-left:1.4px dashed #e2e0da;padding-left:18px&quot;&gt;\n          &lt;div class=&quot;kicker&quot;&gt;Destacado&lt;/div&gt;\n          &lt;div class=&quot;pcard col&quot;&gt;&lt;div class=&quot;img sketch pimg&quot; style=&quot;position:relative&quot;&gt;&lt;span&gt;Producto&lt;/span&gt;&lt;span class=&quot;badge&quot; style=&quot;position:absolute;top:8px;left:8px&quot;&gt;Bestseller&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pcat&quot;&gt;Categoría · Vendor&lt;/div&gt;&lt;div class=&quot;pname&quot;&gt;Nombre del producto&lt;/div&gt;&lt;div class=&quot;row between&quot;&gt;&lt;span class=&quot;pprice&quot;&gt;$1,299&lt;/span&gt;&lt;span class=&quot;stars&quot;&gt;★★★★★&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;btn sm full&quot; style=&quot;margin-top:6px&quot;&gt;Comprar →&lt;/span&gt;&lt;/div&gt;\n          &lt;div class=&quot;spstrip&quot;&gt;&lt;div class=&quot;spavatars&quot;&gt;&lt;span class=&quot;av&quot;&gt;&lt;/span&gt;&lt;span class=&quot;av&quot;&gt;&lt;/span&gt;&lt;span class=&quot;av&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;col&quot;&gt;&lt;span style=&quot;font-size:13px;font-weight:700&quot;&gt;★ 4.9 / 5.0&lt;/span&gt;&lt;span class=&quot;tiny&quot;&gt;+10,000 clientes · Reviews verificadas&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;nt&quot;&gt;Mega menú&lt;/span&gt;Cada categoría con &lt;b&gt;imagen, título, descripción breve y badge&lt;/b&gt; + producto destacado y &lt;b&gt;social proof&lt;/b&gt; (rating + avatares).&lt;span class=&quot;obj&quot;&gt;&lt;b&gt;CRO:&lt;/b&gt; el menú vende: imágenes y badges guían la intención; el destacado + prueba social empujan clic a compra desde la navegación.&lt;/span&gt;&lt;/div&gt;\n  &lt;/div&gt;\n\n  &lt;!-- page dimmed behind --&gt;\n  &lt;div class=&quot;section&quot; style=&quot;opacity:.4&quot;&gt;\n    &lt;span class=&quot;secno&quot; style=&quot;opacity:.5&quot;&gt;·&lt;/span&gt;\n    &lt;div class=&quot;img sketch&quot; style=&quot;min-height:120px&quot;&gt;&lt;span&gt;(Página atenuada detrás del menú)&lt;/span&gt;&lt;/div&gt;\n  &lt;/div&gt;\n\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;!-- =================== MOBILE =================== --&gt;\n&lt;div class=&quot;view&quot; id=&quot;view-mobile&quot;&gt;\n&lt;div class=&quot;stage&quot;&gt;\n&lt;div class=&quot;devwrap&quot;&gt;\n&lt;div class=&quot;phone&quot;&gt;\n&lt;div class=&quot;notch&quot;&gt;&lt;/div&gt;\n&lt;div class=&quot;screen&quot;&gt;\n\n  &lt;!-- drawer --&gt;\n  &lt;div class=&quot;section&quot; style=&quot;min-height:760px&quot;&gt;\n    &lt;span class=&quot;secno&quot;&gt;1&lt;/span&gt;\n    &lt;div class=&quot;drawer&quot;&gt;\n      &lt;div class=&quot;drawerhead&quot;&gt;&lt;div class=&quot;logo&quot;&gt;LOGO&lt;/div&gt;&lt;span style=&quot;font-size:18px;color:#555&quot;&gt;✕&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;img sketch&quot; style=&quot;min-height:36px;margin:12px 0&quot;&gt;&lt;span&gt;⌕ Buscar productos&lt;/span&gt;&lt;/div&gt;\n\n      &lt;!-- category rows --&gt;\n      &lt;div class=&quot;menurow&quot;&gt;&lt;div class=&quot;img sketch mimg&quot;&gt;&lt;span style=&quot;font-size:9px&quot;&gt;IMG&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;col grow&quot;&gt;&lt;div class=&quot;row&quot; style=&quot;gap:8px;align-items:center&quot;&gt;&lt;span class=&quot;mtitle&quot;&gt;NUEVOS&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;Lo último&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;Recién llegados&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;chev&quot;&gt;›&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;menurow&quot;&gt;&lt;div class=&quot;img sketch mimg&quot;&gt;&lt;span style=&quot;font-size:9px&quot;&gt;IMG&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;col grow&quot;&gt;&lt;div class=&quot;row&quot; style=&quot;gap:8px;align-items:center&quot;&gt;&lt;span class=&quot;mtitle&quot;&gt;BESTSELLERS&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;Top&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;Los más vendidos&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;chev&quot;&gt;›&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;menurow&quot;&gt;&lt;div class=&quot;img sketch mimg&quot;&gt;&lt;span style=&quot;font-size:9px&quot;&gt;IMG&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;col grow&quot;&gt;&lt;span class=&quot;mtitle&quot;&gt;DIARIO&lt;/span&gt;&lt;div class=&quot;mdesc&quot;&gt;Para todos los días&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;chev&quot;&gt;›&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;menurow&quot;&gt;&lt;div class=&quot;img sketch mimg&quot;&gt;&lt;span style=&quot;font-size:9px&quot;&gt;IMG&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;col grow&quot;&gt;&lt;span class=&quot;mtitle&quot;&gt;NOCHE&lt;/span&gt;&lt;div class=&quot;mdesc&quot;&gt;Para salir y eventos&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;chev&quot;&gt;›&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;menurow&quot;&gt;&lt;div class=&quot;img sketch mimg&quot;&gt;&lt;span style=&quot;font-size:9px&quot;&gt;IMG&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;col grow&quot;&gt;&lt;div class=&quot;row&quot; style=&quot;gap:8px;align-items:center&quot;&gt;&lt;span class=&quot;mtitle&quot;&gt;REGALOS&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;Ideas&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;Para sorprender&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;chev&quot;&gt;›&lt;/span&gt;&lt;/div&gt;\n\n      &lt;!-- social proof --&gt;\n      &lt;div class=&quot;spstrip&quot; style=&quot;margin:14px 0&quot;&gt;&lt;div class=&quot;spavatars&quot;&gt;&lt;span class=&quot;av&quot;&gt;&lt;/span&gt;&lt;span class=&quot;av&quot;&gt;&lt;/span&gt;&lt;span class=&quot;av&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;col&quot;&gt;&lt;span style=&quot;font-size:13px;font-weight:700&quot;&gt;★ 4.9 / 5.0 · +10,000 clientes&lt;/span&gt;&lt;span class=&quot;tiny&quot;&gt;Reviews verificadas · Compra segura&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\n\n      &lt;!-- quick links --&gt;\n      &lt;div class=&quot;qlink&quot;&gt;Shop All &lt;span class=&quot;chev&quot;&gt;›&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;qlink&quot;&gt;Shop Bundles &lt;span class=&quot;badge&quot; style=&quot;margin-left:8px&quot;&gt;Ahorra 50%&lt;/span&gt;&lt;span class=&quot;chev&quot;&gt;›&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;qlink&quot;&gt;Reviews &lt;span class=&quot;chev&quot;&gt;›&lt;/span&gt;&lt;/div&gt;\n\n      &lt;!-- footer of drawer --&gt;\n      &lt;div class=&quot;row&quot; style=&quot;gap:14px;margin-top:14px;color:#666;font-size:14px&quot;&gt;&lt;span&gt;◌ Cuenta&lt;/span&gt;&lt;span&gt;♡ Favoritos&lt;/span&gt;&lt;span&gt;🌐 MX · $&lt;/span&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;nt&quot;&gt;Mobile drawer&lt;/span&gt;Filas con &lt;b&gt;imagen, título, descripción y badge&lt;/b&gt; (estilo Ridge) + bloque de &lt;b&gt;social proof&lt;/b&gt; y accesos rápidos.&lt;span class=&quot;obj&quot;&gt;&lt;b&gt;CRO:&lt;/b&gt; navegación táctil rica; las imágenes y descripciones aumentan el clic; la prueba social refuerza confianza dentro del menú.&lt;/span&gt;&lt;/div&gt;\n  &lt;/div&gt;\n\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;!-- =================== MODULES =================== --&gt;\n&lt;div class=&quot;view&quot; id=&quot;view-modules&quot;&gt;\n&lt;div class=&quot;sheet&quot;&gt;\n  &lt;h2&gt;Secciones editables — Navegación&lt;/h2&gt;\n  &lt;p class=&quot;lead&quot;&gt;El menú se arma con &lt;b&gt;linklists&lt;/b&gt; + un bloque de mega-menú/drawer enriquecido. Settings clave de conversión en &lt;span style=&quot;color:#235a8c&quot;&gt;azul&lt;/span&gt;.&lt;/p&gt;\n  &lt;div class=&quot;modgrid&quot; id=&quot;modgrid&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;script&gt;\nconst tabs=document.querySelectorAll('.tab[data-view]');\nconst views={desktop:'view-desktop',mobile:'view-mobile',modules:'view-modules'};\nfunction setView(v){\n  tabs.forEach(t=&gt;t.classList.toggle('active',t.dataset.view===v));\n  Object.entries(views).forEach(([k,id])=&gt;document.getElementById(id).classList.toggle('active',k===v));\n  localStorage.setItem('nav_view',v);window.scrollTo(0,0);\n  if(typeof layoutNotes==='function') requestAnimationFrame(layoutNotes);\n}\ntabs.forEach(t=&gt;t.addEventListener('click',()=&gt;setView(t.dataset.view)));\n\nconst tNotes=document.getElementById('t-notes'),tColor=document.getElementById('t-color');\nfunction applyToggles(){\n  document.body.classList.toggle('nonotes',!tNotes.checked);\n  document.body.classList.toggle('mono',!tColor.checked);\n  localStorage.setItem('nav_notes',tNotes.checked);localStorage.setItem('nav_color',tColor.checked);\n  if(typeof layoutNotes==='function') requestAnimationFrame(layoutNotes);\n}\ntNotes.checked=localStorage.getItem('nav_notes')!=='false';\ntColor.checked=localStorage.getItem('nav_color')!=='false';\ntNotes.addEventListener('change',applyToggles);tColor.addEventListener('change',applyToggles);\n\nfunction layoutNotes(){\n  if(document.body.classList.contains('nonotes')) return;\n  const active=document.querySelector('.view.active'); if(!active) return;\n  const notes=[...active.querySelectorAll('.note')];\n  notes.forEach(n=&gt;n.style.setProperty('--ty','0px'));\n  const GAP=16; let prevBottom=-Infinity;\n  notes.forEach(n=&gt;{const r=n.getBoundingClientRect();if(r.height===0)return;let ty=0;if(r.top&lt;prevBottom+GAP){ty=(prevBottom+GAP)-r.top;n.style.setProperty('--ty',ty+'px');}prevBottom=r.top+ty+r.height;});\n}\nlet rT;function scheduleLayout(){clearTimeout(rT);rT=setTimeout(layoutNotes,60);}\nwindow.addEventListener('resize',scheduleLayout);\nwindow.addEventListener('load',layoutNotes);\nif(document.fonts&amp;&amp;document.fonts.ready)document.fonts.ready.then(layoutNotes);\nsetTimeout(layoutNotes,300);\n\nconst MODS=[\n {n:1,name:'Header / nav',tag:'header.liquid',purpose:'Logo, menú principal, búsqueda, cuenta, carrito.',s:['menú principal (linklist)','*sticky*','*trigger mega menú (hover/click)*','búsqueda','iconos cuenta/carrito']},\n {n:2,name:'Mega menu (desktop)',tag:'mega-menu.liquid',purpose:'Panel con categorías enriquecidas + destacado + social proof.',s:['*items: imagen + título + descripción + badge (blocks)*','*nº columnas*','*producto destacado*','*social proof (rating+avatares)*','quick links','color fondo']},\n {n:3,name:'Mobile drawer',tag:'drawer-menu.liquid',purpose:'Menú lateral con filas imagen+texto+badge.',s:['*items: imagen + título + descripción + badge*','*social proof block*','búsqueda','quick links','cuenta/idioma']},\n {n:'+',name:'Menu badges',tag:'(metafield / block)',purpose:'Etiquetas por item (Popular, Nuevo, Ahorra 50%).',s:['*texto badge*','*color badge*','por item','activar/desactivar']},\n];\nconst grid=document.getElementById('modgrid');\ngrid.innerHTML=MODS.map(m=&gt;`\n &lt;div class=&quot;mod sketch&quot;&gt;\n   &lt;div class=&quot;mh&quot;&gt;&lt;span class=&quot;mn&quot;&gt;${m.n}&lt;/span&gt;&lt;div&gt;&lt;h3&gt;${m.name}&lt;/h3&gt;&lt;span class=&quot;mtag&quot;&gt;${m.tag}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\n   &lt;p class=&quot;purpose&quot;&gt;${m.purpose}&lt;/p&gt;\n   &lt;p class=&quot;slabel&quot;&gt;Settings&lt;/p&gt;\n   &lt;ul&gt;${m.s.map(x=&gt;{const b=x.startsWith('*');const t=x.replace(/\\*/g,'');return `&lt;li class=&quot;${b?'blk':''}&quot;&gt;${t}&lt;/li&gt;`;}).join('')}&lt;/ul&gt;\n &lt;/div&gt;`).join('');\n\nsetView(localStorage.getItem('nav_view')||'desktop');\napplyToggles();\n&lt;/script&gt;\n\n&lt;template id=&quot;__bundler_thumbnail&quot;&gt;\n&lt;svg viewBox=&quot;0 0 100 100&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;&lt;rect width=&quot;100&quot; height=&quot;100&quot; fill=&quot;#f4f3ef&quot;/&gt;&lt;g stroke=&quot;#3a3a3a&quot; stroke-width=&quot;2.4&quot; fill=&quot;none&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;24&quot; width=&quot;60&quot; height=&quot;10&quot; rx=&quot;2&quot;/&gt;&lt;rect x=&quot;20&quot; y=&quot;40&quot; width=&quot;26&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;#e9e8e4&quot;/&gt;&lt;line x1=&quot;52&quot; y1=&quot;44&quot; x2=&quot;78&quot; y2=&quot;44&quot;/&gt;&lt;line x1=&quot;52&quot; y1=&quot;51&quot; x2=&quot;70&quot; y2=&quot;51&quot;/&gt;&lt;rect x=&quot;20&quot; y=&quot;62&quot; width=&quot;26&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;#e9e8e4&quot;/&gt;&lt;line x1=&quot;52&quot; y1=&quot;66&quot; x2=&quot;78&quot; y2=&quot;66&quot;/&gt;&lt;line x1=&quot;52&quot; y1=&quot;73&quot; x2=&quot;70&quot; y2=&quot;73&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;\n&lt;/template&gt;\n\n&lt;/body&gt;\n&lt;/html&gt;\n\">\u003c/iframe>\u003c/div>\u003c/section>\u003csection class=\"view\" data-view=\"2\">\u003cdiv class=\"vhead\">\u003cdiv class=\"vh-l\">\u003cspan class=\"vnum\">03\u003c/span>\u003cdiv>\u003ch2>Página de categoría\u003c/h2>\u003cp>La pantalla donde el cliente ve todos los productos de una categoría y puede filtrar y ordenar.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"vbody\">\u003ciframe loading=\"lazy\" title=\"Página de categoría\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;es&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;Collection Page — Wireframe&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;style&gt;/* ============================================================\n   Low-fi wireframe system — Excalidraw / hand-drawn vibe\n   Grayscale wireframe + single accent for CRO sticky-notes\n   ============================================================ */\n\n:root{\n  --canvas:#f4f3ef;\n  --paper:#ffffff;\n  --ink:#2b2b2b;\n  --stroke:#3a3a3a;\n  --stroke-soft:#8c8c8c;\n  --fill:#e9e8e4;\n  --fill-2:#dedcd6;\n  --muted:#9a9a96;\n  --note:#fff3bf;        /* sticky note */\n  --note-ink:#5b4b00;\n  --note-edge:#e2cf6b;\n  --accent:#1971c2;      /* arrows / pin */\n  --r:7px;\n}\n\n*{box-sizing:border-box;}\nhtml,body{margin:0;padding:0;}\nbody{\n  background:var(--canvas);\n  color:var(--ink);\n  font-family:'Kalam', 'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Sans MS', cursive;\n  -webkit-font-smoothing:antialiased;\n  /* faint grid like a sketch canvas */\n  background-image:\n    linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(0,0,0,.025) 1px, transparent 1px);\n  background-size:26px 26px;\n}\n\n/* ---------- hand-drawn border via displacement filter ---------- */\n.sketch{position:relative;}\n.sketch::before{\n  content:&quot;&quot;;\n  position:absolute; inset:0;\n  border:1.7px solid var(--stroke);\n  border-radius:9px 7px 10px 8px / 8px 10px 7px 9px;\n  filter:url(#rough);\n  pointer-events:none;\n}\n.sketch.soft::before{border-color:var(--stroke-soft);}\n.sketch.dash::before{border-style:dashed;}\n\n/* ---------- image placeholder ---------- */\n.img{\n  background:var(--fill);\n  background-image:\n    linear-gradient(to top right, transparent calc(50% - .9px), var(--stroke-soft) calc(50% - .9px), var(--stroke-soft) calc(50% + .9px), transparent calc(50% + .9px)),\n    linear-gradient(to top left,  transparent calc(50% - .9px), var(--stroke-soft) calc(50% - .9px), var(--stroke-soft) calc(50% + .9px), transparent calc(50% + .9px));\n  display:flex; align-items:center; justify-content:center;\n  color:var(--muted); font-size:13px; letter-spacing:.5px;\n  min-height:60px; overflow:hidden;\n}\n.img span{background:var(--fill); padding:2px 8px; border-radius:4px;}\n.img.tall{min-height:240px;}\n\n/* ---------- text placeholders ---------- */\n.bar{height:9px;background:var(--fill-2);border-radius:6px;margin:7px 0;}\n.bar.dark{background:#cfcdc6;}\n.h{font-weight:700;line-height:1.12;color:var(--ink);}\n.h1{font-size:30px;}\n.h2{font-size:22px;}\n.h3{font-size:17px;}\n.sub{font-size:14px;color:#6b6b67;line-height:1.3;}\n.tiny{font-size:12px;color:var(--muted);}\n.kicker{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}\n\n/* ---------- buttons ---------- */\n.btn{\n  display:inline-flex;align-items:center;gap:6px;justify-content:center;\n  background:var(--stroke);color:#fff;font-family:inherit;font-size:14px;font-weight:700;\n  padding:10px 18px;border-radius:8px 10px 9px 11px / 11px 9px 10px 8px;\n  position:relative;white-space:nowrap;\n}\n.btn.o{background:transparent;color:var(--ink);}\n.btn.o::before{\n  content:&quot;&quot;;position:absolute;inset:0;border:1.7px solid var(--stroke);\n  border-radius:inherit;filter:url(#rough);\n}\n.btn.sm{padding:6px 12px;font-size:12px;}\n.btn.full{display:flex;width:100%;}\n\n/* ---------- pills / badges / chips ---------- */\n.badge{\n  display:inline-block;font-size:11px;font-weight:700;color:var(--ink);\n  background:var(--paper);padding:3px 9px;border-radius:20px;position:relative;\n}\n.badge::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px solid var(--stroke);border-radius:20px;filter:url(#rough);}\n.chip{\n  display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);\n  background:var(--paper);padding:7px 13px;border-radius:20px;position:relative;white-space:nowrap;\n}\n.chip::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:20px;filter:url(#rough);}\n\n/* ---------- icon placeholder ---------- */\n.ico{\n  width:42px;height:42px;border-radius:50%;background:var(--fill);\n  display:flex;align-items:center;justify-content:center;color:var(--stroke-soft);\n  font-size:18px;position:relative;flex:0 0 auto;\n}\n.ico::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.stars{color:#3a3a3a;letter-spacing:2px;font-size:14px;}\n\n/* ---------- generic blocks ---------- */\n.card{background:var(--paper);padding:12px;border-radius:var(--r);position:relative;}\n.row{display:flex;gap:14px;}\n.col{display:flex;flex-direction:column;}\n.center{align-items:center;text-align:center;}\n.between{justify-content:space-between;align-items:center;}\n.wrap{flex-wrap:wrap;}\n.grow{flex:1 1 0;min-width:0;}\n\n/* ============================================================\n   DEVICE FRAMES\n   ============================================================ */\n.stage{\n  display:flex;flex-direction:column;align-items:center;\n  padding:30px 470px 120px 40px;   /* right padding leaves room for notes */\n}\n@media(max-width:1180px){ .stage{padding-right:40px;} .note{display:none!important;} }\n\n.devwrap{position:relative;}\n\n/* browser chrome (desktop) */\n.browser{width:980px;max-width:100%;background:var(--paper);position:relative;border-radius:12px;}\n.browser&gt;.chrome{\n  height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;\n  border-bottom:1.6px solid var(--fill-2);\n}\n.dot{width:11px;height:11px;border-radius:50%;background:var(--fill-2);}\n.urlbar{flex:1;height:20px;background:var(--fill);border-radius:20px;margin-left:10px;}\n\n/* phone chrome (mobile) */\n.phone{width:392px;max-width:100%;background:var(--paper);position:relative;border-radius:34px;padding:12px;}\n.phone::before{content:&quot;&quot;;position:absolute;inset:0;border:2px solid var(--stroke);border-radius:34px;filter:url(#rough);}\n.phone .screen{border-radius:24px;overflow:hidden;background:var(--paper);position:relative;}\n.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:120px;height:18px;background:var(--stroke);border-radius:20px;z-index:5;}\n\n/* a screen section */\n.section{position:relative;padding:16px;border-bottom:1.4px dashed #e2e0da;}\n.section:last-child{border-bottom:none;}\n.section .secno{\n  position:absolute;left:-13px;top:12px;width:26px;height:26px;border-radius:50%;\n  background:var(--accent);color:#fff;font-size:13px;font-weight:700;\n  display:flex;align-items:center;justify-content:center;z-index:6;\n  box-shadow:0 1px 0 rgba(0,0,0,.15);\n}\n.phone .section .secno{left:-2px;}\n\n/* ---------- CRO sticky notes ---------- */\n.note{\n  position:absolute;left:100%;top:8px;margin-left:54px;width:360px;\n  background:var(--note);color:var(--note-ink);\n  padding:13px 15px 14px;border-radius:3px;\n  box-shadow:2px 3px 0 rgba(0,0,0,.10);\n  transform:rotate(var(--rot,-.5deg)) translateY(var(--ty,0px));font-size:14px;line-height:1.34;\n}\n.note:nth-child(even){--rot:.6deg;}\n.note::before{ /* arrow toward the section */\n  content:&quot;&quot;;position:absolute;right:100%;top:18px;\n  border:9px solid transparent;border-right-color:var(--note);\n  filter:drop-shadow(-1px 1px 0 rgba(0,0,0,.06));\n}\n.note .nt{font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8a6d00;display:block;margin-bottom:3px;}\n.note .obj{display:block;margin-top:7px;font-size:12.5px;color:#6b5600;border-top:1px dashed var(--note-edge);padding-top:6px;}\n.note .obj b{color:#4d3d00;}\n.phone .note{margin-left:46px;}\n\n/* connector pin dot on the section for mobile notes spacing */\n\n/* ---------- layout helpers for content ---------- */\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\n.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}\n.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}\n.scrollrow{display:flex;gap:12px;overflow:hidden;}\n.scrollrow&gt;*{flex:0 0 auto;}\n\n/* announcement bar */\n.annbar{background:var(--stroke);color:#fff;text-align:center;font-size:12px;letter-spacing:1px;padding:8px;display:flex;align-items:center;justify-content:center;gap:14px;}\n.annbar .ar{opacity:.6;}\n\n/* header */\n.hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 2px;}\n.logo{font-weight:700;font-size:18px;letter-spacing:1px;}\n.nav{display:flex;gap:16px;font-size:13px;color:#555;}\n\n/* product card */\n.pcard .pimg{aspect-ratio:3/4;}\n.pcard .pcat{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-top:8px;}\n.pcard .pname{font-size:13px;margin-top:2px;}\n.pcard .pprice{font-size:13px;font-weight:700;}\n.pcard .pdesc{font-size:11.5px;color:#7a7a76;line-height:1.3;margin-top:5px;}\n\n/* press logos strip */\n.logoph{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:19px;letter-spacing:1px;color:#8a8a86;}\n.section.opt .secno{background:transparent;color:var(--accent);border:1.6px dashed var(--accent);width:auto;min-width:26px;padding:0 7px;border-radius:13px;font-size:10px;letter-spacing:.5px;}\nbody.mono .section.opt .secno{color:#555;border-color:#888;}\n\n/* featured product under UGC video */\n.miniprod{display:flex;align-items:center;gap:8px;padding:7px;margin-top:8px;background:var(--paper);border-radius:7px;}\n.miniprod .mp-img{width:34px;height:34px;flex:0 0 auto;}\n.miniprod .mp-name{font-size:12px;font-weight:700;color:#2b2b2b;line-height:1.1;}\n\n/* collection tabs (inside a wireframe section) */\n.wtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}\n.wtab{\n  font-family:inherit;font-size:13px;cursor:pointer;background:var(--paper);\n  color:#666;padding:6px 13px;border-radius:20px;position:relative;white-space:nowrap;\n}\n.wtab::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:20px;filter:url(#rough);}\n.wtab.on{color:var(--ink);font-weight:700;background:var(--stroke);color:#fff;}\n.wtab.on::before{border-color:var(--stroke);}\n.wtab.scroll{overflow-x:auto;}\n.tabpane:not(.on){display:none!important;}\n\n/* hero variant helpers */\n.btn.inv{background:#fff;color:#2b2b2b;}\n.checklist{display:flex;flex-direction:column;gap:8px;}\n.ck{display:flex;gap:8px;align-items:center;font-size:14px;}\n.ck-mark{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--fill-2);color:#444;flex:0 0 auto;}\n.avstack{display:flex;align-items:center;}\n.avstack .av{width:26px;height:26px;border-radius:50%;background:var(--fill-2);border:2px solid #fff;margin-left:-8px;position:relative;}\n.avstack .av:first-child{margin-left:0;}\n.darkhero{background:#2f2f2f;color:#fff;border-radius:10px;overflow:hidden;position:relative;}\n.darkhero .kicker,.darkhero .sub,.darkhero .tiny{color:#c9c9c9;}\n.darkhero .chip{color:#fff;background:rgba(255,255,255,.06);}\n.darkhero .chip::before{border-color:#7d7d7d;}\n.darkhero .ck-mark{background:rgba(255,255,255,.2);color:#fff;}\n.darkhero .img{background:#3a3a3a;}\n.darkhero .img span{background:#3a3a3a;color:#9a9a9a;}\n.darkhero .av{border-color:#2f2f2f;background:#5a5a5a;}\n\n/* ============================================================\n   TOP CONTROL BAR + VIEWS\n   ============================================================ */\n.topbar{\n  position:sticky;top:0;z-index:50;background:rgba(244,243,239,.92);\n  backdrop-filter:blur(4px);border-bottom:1.5px solid #e2e0da;\n  display:flex;align-items:center;gap:14px;padding:11px 22px;flex-wrap:wrap;\n}\n.topbar .title{font-weight:700;font-size:17px;}\n.topbar .title small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.5px;}\n.tabs{display:flex;gap:6px;margin-left:6px;}\n.tab{\n  font-family:inherit;font-size:14px;cursor:pointer;background:transparent;\n  padding:7px 15px;border-radius:8px;position:relative;color:#555;\n}\n.tab::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid transparent;border-radius:8px;filter:url(#rough);}\n.tab.active{color:var(--ink);font-weight:700;background:var(--paper);}\n.tab.active::before{border-color:var(--stroke);}\n.spacer{flex:1;}\n.toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:#555;cursor:pointer;user-select:none;}\n.toggle input{width:34px;height:19px;appearance:none;background:var(--fill-2);border-radius:20px;position:relative;cursor:pointer;outline:none;transition:.15s;}\n.toggle input:checked{background:var(--accent);}\n.toggle input::after{content:&quot;&quot;;position:absolute;top:2px;left:2px;width:15px;height:15px;background:#fff;border-radius:50%;transition:.15s;}\n.toggle input:checked::after{left:17px;}\n\n.view{display:none;}\n.view.active{display:block;}\n\n/* color-off (pure grayscale) */\nbody.mono{--accent:#3a3a3a;--note:#ececec;--note-ink:#333;--note-edge:#cfcfcf;}\nbody.mono .note .nt{color:#444;}\nbody.mono .note .obj,body.mono .note .obj b{color:#555;}\n\n/* hide notes toggle */\nbody.nonotes .note{display:none;}\nbody.nonotes .stage{padding-right:40px;}\n\n/* ============================================================\n   SHOPIFY MODULES SHEET\n   ============================================================ */\n.sheet{max-width:1080px;margin:0 auto;padding:34px 30px 120px;}\n.sheet h2{font-size:26px;margin:0 0 6px;}\n.sheet .lead{color:#6b6b67;font-size:15px;margin:0 0 26px;max-width:680px;}\n.modgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}\n@media(max-width:760px){.modgrid{grid-template-columns:1fr;}}\n.mod{background:var(--paper);border-radius:10px;padding:16px 18px;position:relative;}\n.mod&gt;.mh{display:flex;align-items:center;gap:10px;margin-bottom:9px;}\n.mod .mn{min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}\n.mod h3{font-size:16px;margin:0;}\n.mod .mtag{font-size:11px;color:var(--muted);}\n.mod .purpose{font-size:13px;color:#6b6b67;line-height:1.4;margin:0 0 11px;}\n.mod .slabel{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8a8a86;margin:0 0 6px;}\n.mod ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px;}\n.mod li{font-size:12px;background:var(--fill);color:#444;padding:4px 9px;border-radius:6px;}\n.mod li.blk{background:#e7eef7;color:#235a8c;}\n\n/* ============================================================\n   COLLECTION PAGE (PLP)\n   ============================================================ */\n/* mini hero band */\n.cmini{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;}\n.cmini .bullets{display:flex;flex-direction:column;gap:5px;margin-top:8px;}\n.cmini .bl{display:flex;align-items:center;gap:7px;font-size:13px;color:#555;}\n\n/* toolbar: count + sort + filter btn */\n.ctoolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;}\n.sortsel{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#444;background:var(--paper);padding:8px 13px;border-radius:8px;position:relative;cursor:pointer;}\n.sortsel::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:8px;filter:url(#rough);}\n.fchips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}\n.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--fill);color:#444;padding:5px 10px;border-radius:20px;}\n.fchip .x{opacity:.6;}\n\n/* filter sidebar */\n.plp{display:flex;gap:22px;align-items:flex-start;}\n.filters{width:212px;flex:0 0 auto;}\n.fgroup{padding:13px 0;border-bottom:1.4px dashed #e2e0da;}\n.fgroup:first-child{padding-top:0;}\n.fgroup h4{font-size:12px;margin:0 0 9px;letter-spacing:1px;text-transform:uppercase;color:#666;display:flex;justify-content:space-between;}\n.fopt{display:flex;align-items:center;gap:8px;font-size:13px;color:#444;margin:8px 0;}\n.fopt .cnt{margin-left:auto;color:var(--muted);font-size:12px;}\n.fbox{width:15px;height:15px;border-radius:3px;position:relative;flex:0 0 auto;}\n.fbox::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px solid var(--stroke-soft);border-radius:3px;filter:url(#rough);}\n.fbox.on{background:var(--stroke);}\n.fbox.on::after{content:&quot;✓&quot;;color:#fff;font-size:10px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}\n.swrow{display:flex;gap:7px;flex-wrap:wrap;}\n.sw{width:19px;height:19px;border-radius:50%;position:relative;flex:0 0 auto;}\n.sw::before{content:&quot;&quot;;position:absolute;inset:-1px;border:1.4px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.sizebox{min-width:30px;text-align:center;font-size:12px;padding:5px 7px;border-radius:6px;position:relative;color:#444;}\n.sizebox::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px solid var(--stroke-soft);border-radius:6px;filter:url(#rough);}\n\n/* product grid + card extras */\n.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1 1 0;min-width:0;}\n.fav{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:13px;color:#777;z-index:2;}\n.fav::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.pcard .pswrow{display:flex;gap:6px;margin-top:7px;align-items:center;}\n.pcard .psw{width:15px;height:15px;border-radius:50%;position:relative;}\n.pcard .psw::before{content:&quot;&quot;;position:absolute;inset:-1px;border:1.3px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n\n/* product card image gallery nav (swipe / arrows between product images) */\n.pimg .garrow{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:15px;color:#555;z-index:2;opacity:0;transition:opacity .15s;}\n.pimg .garrow::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.pimg .garrow.l{left:7px;}\n.pimg .garrow.r{right:7px;}\n.pcard:hover .pimg .garrow{opacity:1;}\n.pimg .gdots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:#fff;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.4);}\n.pimg .ghint{position:absolute;bottom:8px;right:8px;font-size:9px;color:#777;background:var(--paper);padding:1px 6px;border-radius:8px;z-index:2;}\n\n/* promo tile inside grid */\n.promotile{background:#2f2f2f;color:#fff;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:18px;min-height:200px;position:relative;}\n.promotile .kicker{color:#bdbdbd;}\n.promotile .h{color:#fff;}\n\n/* pagination */\n.loadmore{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0;}\n.pdots{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:13px;}\n\n/* SEO collapsible */\n.seo{padding:14px 0;}\n.seo .barwrap{max-width:760px;}\n\n/* ============================================================\n   PRODUCT PAGE (PDP)\n   ============================================================ */\n.gallery{display:flex;gap:12px;}\n.gthumbs{display:flex;flex-direction:column;gap:9px;width:62px;flex:0 0 auto;}\n.gthumb{aspect-ratio:1;}\n.gthumb.on::before{border-width:2.4px;border-color:var(--stroke);}\n.gmain{flex:1 1 0;min-width:0;aspect-ratio:4/5;position:relative;}\n.buybox{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:13px;}\n.price{display:flex;align-items:center;gap:9px;}\n.price .now{font-size:25px;font-weight:700;}\n.price .was{font-size:15px;color:var(--muted);text-decoration:line-through;}\n.price .off{font-size:11px;font-weight:700;background:var(--stroke);color:#fff;padding:3px 8px;border-radius:5px;}\n.optlabel{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:#666;display:flex;justify-content:space-between;margin-bottom:8px;}\n.optlabel a{color:var(--accent);text-transform:none;letter-spacing:0;}\n.optrow{display:flex;gap:8px;flex-wrap:wrap;}\n.optbox{min-width:44px;text-align:center;padding:10px 13px;border-radius:7px;position:relative;font-size:13px;color:#2b2b2b;cursor:pointer;}\n.optbox::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:7px;filter:url(#rough);}\n.optbox.on{background:var(--stroke);color:#fff;}\n.optbox.on::before{border-color:var(--stroke);}\n.optbox.soldout{opacity:.42;text-decoration:line-through;}\n.swbig{width:32px;height:32px;border-radius:50%;position:relative;cursor:pointer;}\n.swbig::before{content:&quot;&quot;;position:absolute;inset:-1px;border:1.5px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.swbig.on::after{content:&quot;&quot;;position:absolute;inset:-5px;border:1.7px solid var(--stroke);border-radius:50%;}\n.qtybox{display:inline-flex;align-items:center;border-radius:8px;position:relative;}\n.qtybox::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:8px;filter:url(#rough);}\n.qtybox span{padding:9px 13px;font-size:15px;}\n.qtybox .n{min-width:34px;text-align:center;font-weight:700;}\n.atc{display:flex;width:100%;padding:15px;font-size:15px;}\n.express{display:flex;flex-direction:column;gap:7px;}\n.exbtn{display:flex;align-items:center;justify-content:center;width:100%;padding:12px;border-radius:8px;position:relative;font-size:13px;color:#444;background:var(--fill);}\n.exbtn::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:8px;filter:url(#rough);}\n.urgency{display:flex;align-items:center;gap:8px;font-size:13px;color:#7a4a00;}\n.urgency .dotred{width:8px;height:8px;border-radius:50%;background:#b06a00;flex:0 0 auto;}\n.acc{border-top:1.4px dashed #e2e0da;}\n.acc:last-of-type{border-bottom:1.4px dashed #e2e0da;}\n.acc .ahead{display:flex;align-items:center;justify-content:space-between;padding:13px 0;font-size:14px;font-weight:700;}\n/* review breakdown */\n.revsum{display:flex;gap:26px;align-items:center;flex-wrap:wrap;}\n.revbars{flex:1 1 240px;min-width:200px;display:flex;flex-direction:column;gap:5px;}\n.revrow{display:flex;align-items:center;gap:9px;font-size:12px;color:#666;}\n.revrow .track{flex:1;height:8px;background:var(--fill);border-radius:5px;overflow:hidden;}\n.revrow .fill{height:100%;background:#4a4a4a;}\n.bignum{font-size:40px;font-weight:700;line-height:1;}\n/* sticky add-to-cart bar (mobile) */\n.stickybar{position:sticky;bottom:0;z-index:8;background:var(--paper);border-top:1.5px solid #e2e0da;display:flex;align-items:center;gap:10px;padding:10px 14px;}\n.stickybar .sp{display:flex;flex-direction:column;}\n/* complete the look */\n.cline{display:flex;align-items:center;gap:12px;padding:9px;background:var(--paper);border-radius:8px;position:relative;}\n\n/* ============================================================\n   NAVIGATION MENU (mega p in menu */\n.spstrip{display:flex;align-items:center;gap:12px;background:#fafaf8;border-radius:9px;padding:12px;position:relative;}\n.spstrip::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px dashed var(--stroke-soft);border-radius:9px;filter:url(#rough);}\n.spavatars{display:flex;align-items:center;}\n.spavatars .av{width:26px;height:26px;border-radius:50%;background:var(--fill-2);border:2px solid var(--paper);margin-left:-8px;}\n.spavatars .av:first-child{margin-left:0;}\n\n/* mobile drawer shell */\n.drawer{display:flex;flex-direction:column;height:100%;}\n.drawerhead{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px;border-bottom:1.4px solid #eceae4;}\n\n/* ============================================================\n   CART (drawer)\n   ============================================================ */\n.cartdrawer{width:432px;max-width:100%;background:var(--paper);border-radius:14px;position:relative;}\n.metabar{display:flex;flex-direction:column;gap:7px;}\n.mtrack{height:11px;background:var(--fill);border-radius:7px;overflow:hidden;position:relative;}\n.mfill{height:100%;background:#4a4a4a;border-radius:7px;}\n.metatiers{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}\n.metatiers b{color:#2b2b2b;}\n.litem{display:flex;gap:12px;padding:13px 0;border-bottom:1.4px dashed #e2e0da;}\n.litem .limg{width:70px;height:86px;flex:0 0 auto;}\n.litem .lrm{font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer;}\n.codebox{display:flex;gap:8px;}\n.codebox .field{flex:1;height:40px;display:flex;align-items:center;padding:0 12px;color:var(--muted);font-size:13px;position:relative;background:var(--paper);border-radius:8px;}\n.codebox .field::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:8px;filter:url(#rough);}\n.paystrip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center;}\n.guar{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:2px;}\n.guar .g{display:flex;align-items:center;gap:6px;font-size:12px;color:#666;}\n.upsell{display:flex;align-items:center;gap:11px;padding:10px;background:#fafaf8;border-radius:9px;position:relative;}\n.upsell::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px dashed var(--stroke-soft);border-radius:9px;filter:url(#rough);}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n\n&lt;svg width=&quot;0&quot; height=&quot;0&quot; style=&quot;position:absolute&quot;&gt;\n  &lt;filter id=&quot;rough&quot;&gt;\n    &lt;feTurbulence type=&quot;fractalNoise&quot; baseFrequency=&quot;0.013&quot; numOctaves=&quot;2&quot; seed=&quot;7&quot; result=&quot;noise&quot;/&gt;\n    &lt;feDisplacementMap in=&quot;SourceGraphic&quot; in2=&quot;noise&quot; scale=&quot;2.6&quot; xChannelSelector=&quot;R&quot; yChannelSelector=&quot;G&quot;/&gt;\n  &lt;/filter&gt;\n&lt;/svg&gt;\n\n&lt;div class=&quot;topbar&quot;&gt;\n  &lt;div class=&quot;title&quot;&gt;Collection Page (PLP) — Fashion / Lifestyle &lt;small&gt;Low-fi · mobile-first · CRO · Shopify-ready&lt;/small&gt;&lt;/div&gt;\n  &lt;div class=&quot;tabs&quot;&gt;\n    &lt;button class=&quot;tab active&quot; data-view=&quot;desktop&quot;&gt;Desktop&lt;/button&gt;\n    &lt;button class=&quot;tab&quot; data-view=&quot;mobile&quot;&gt;Mobile&lt;/button&gt;\n    &lt;button class=&quot;tab&quot; data-view=&quot;modules&quot;&gt;Shopify modules&lt;/button&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;spacer&quot;&gt;&lt;/div&gt;\n  &lt;a href=&quot;Shopify Homepage Wireframe.html&quot; class=&quot;tab&quot; style=&quot;text-decoration:none&quot;&gt;← Homepage&lt;/a&gt;\n  &lt;a href=&quot;Product Page Wireframe.html&quot; class=&quot;tab&quot; style=&quot;text-decoration:none&quot;&gt;Product →&lt;/a&gt;\n  &lt;label class=&quot;toggle&quot;&gt;Notas CRO &lt;input type=&quot;checkbox&quot; id=&quot;t-notes&quot; checked&gt;&lt;/label&gt;\n  &lt;label class=&quot;toggle&quot in-height:32px&quot;&gt;&lt;span&gt;tu@email&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;btn sm&quot;&gt;Unirme&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;row wrap&quot; style=&quot;gap:10px&quot;&gt;&lt;span class=&quot;tiny&quot;&gt;Tienda&lt;/span&gt;&lt;span class=&quot;tiny&quot;&gt;Ayuda&lt;/span&gt;&lt;span class=&quot;tiny&quot;&gt;Contacto&lt;/span&gt;&lt;/div&gt;\n      &lt;div class=&quot;row wrap&quot; style=&quot;gap:6px;border-top:1.4px dashed #ddd;padding-top:10px&quot;&gt;&lt;span class=&quot;badge&quot;&gt;VISA&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;MC&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;PayPal&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;OXXO&lt;/span&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;nt&quot;&gt;Footer&lt;/span&gt;&lt;span class=&quot;obj&quot;&gt;&lt;b&gt;CRO:&lt;/b&gt; confianza + newsletter.&lt;/span&gt;&lt;/div&gt;\n  &lt;/div&gt;\n\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;!-- =================== MODULES =================== --&gt;\n&lt;div class=&quot;view&quot; id=&quot;view-modules&quot;&gt;\n&lt;div class=&quot;sheet&quot;&gt;\n  &lt;h2&gt;Secciones editables — Collection Page&lt;/h2&gt;\n  &lt;p class=&quot;lead&quot;&gt;Módulos del template &lt;b&gt;collection&lt;/b&gt;. Settings clave de conversión en &lt;span style=&quot;color:#235a8c&quot;&gt;azul&lt;/span&gt;. Todas con activar/desactivar, color de fondo, padding y alineación.&lt;/p&gt;\n  &lt;div class=&quot;modgrid&quot; id=&quot;modgrid&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;script&gt;\nconst tabs=document.querySelectorAll('.tab[data-view]');\nconst views={desktop:'view-desktop',mobile:'view-mobile',modules:'view-modules'};\nfunction setView(v){\n  tabs.forEach(t=&gt;t.classList.toggle('active',t.dataset.view===v));\n  Object.entries(views).forEach(([k,id])=&gt;document.getElementById(id).classList.toggle('active',k===v));\n  localStorage.setItem('plp_view',v);window.scrollTo(0,0);\n  if(typeof layoutNotes==='function') requestAnimationFrame(layoutNotes);\n}\ntabs.forEach(t=&gt;t.addEventListener('click',()=&gt;setView(t.dataset.view)));\n\nconst tNotes=document.getElementById('t-notes'),tColor=document.getElementById('t-color');\nfunction applyToggles(){\n  document.body.classList.toggle('nonotes',!tNotes.checked);\n  document.body.classList.toggle('mono',!tColor.checked);\n  localStorage.setItem('plp_notes',tNotes.checked);localStorage.setItem('plp_color',tColor.checked);\n  if(typeof layoutNotes==='function') requestAnimationFrame(layoutNotes);\n}\ntNotes.checked=localStorage.getItem('plp_notes')!=='false';\ntColor.checked=localStorage.getItem('plp_color')!=='false';\ntNotes.addEventListener('change',applyToggles);tColor.addEventListener('change',applyToggles);\n\nfunction layoutNotes(){\n  if(document.body.classList.contains('nonotes')) return;\n  const active=document.querySelector('.view.active'); if(!active) return;\n  const notes=[...active.querySelectorAll('.note')];\n  notes.forEach(n=&gt;n.style.setProperty('--ty','0px'));\n  const GAP=16; let prevBottom=-Infinity;\n  notes.forEach(n=&gt;{const r=n.getBoundingClientRect();if(r.height===0)return;let ty=0;if(r.top&lt;prevBottom+GAP){ty=(prevBottom+GAP)-r.top;n.style.setProperty('--ty',ty+'px');}prevBottom=r.top+ty+r.height;});\n}\nlet rT;function scheduleLayout(){clearTimeout(rT);rT=setTimeout(layoutNotes,60);}\nwindow.addEventListener('resize',scheduleLayout);\nwindow.addEventListener('load',layoutNotes);\nif(document.fonts&amp;&amp;document.fonts.ready)document.fonts.ready.then(layoutNotes);\nsetTimeout(layoutNotes,300);\n\n/* collection tabs (visual toggle) */\ndocument.querySelectorAll('[data-ctabs]').forEach(g=&gt;{\n  g.querySelectorAll('.wtab').forEach(t=&gt;t.addEventListener('click',()=&gt;{\n    g.querySelectorAll('.wtab').forEach(x=&gt;x.classList.toggle('on',x===t));\n  }));\n});\n\n/* product grid generator */\nconst BADGES=['Bestseller','','Nuevo','','Edición lim.','','Regalo ideal',''];\nconst PRICES=['$1,299','$899','$1,490','$749','$1,090','$990','$2,100','$830'];\nconst STARS=['★★★★★','★★★★★','★★★★☆','★★★★★','★★★★★','★★★★☆','★★★★★','★★★★★'];\nfunction card(i,mobile){\n  const sw='&lt;span class=&quot;psw&quot; style=&quot;background:#2b2b2b&quot;&gt;&lt;/span&gt;&lt;span class=&quot;psw&quot; style=&quot;background:#c9b48a&quot;&gt;&lt;/span&gt;&lt;span class=&quot;psw&quot; style=&quot;background:#9a9a96&quot;&gt;&lt;/span&gt;';\n  const badge=BADGES[i]?`&lt;span class=&quot;badge&quot; style=&quot;position:absolute;top:8px;left:8px&quot;&gt;${BADGES[i]}&lt;/span&gt;`:'';\n  const galnav = mobile\n    ? `&lt;span class=&quot;gdots&quot;&gt;● ◦ ◦ ◦&lt;/span&gt;&lt;span class=&quot;ghint&quot;&gt;‹ desliza ›&lt;/span&gt;`\n    : `&lt;span class=&quot;garrow l&quot;&gt;‹&lt;/span&gt;&lt;span class=&quot;garrow r&quot;&gt;›&lt;/span&gt;&lt;span class=&quot;gdots&quot;&gt;● ◦ ◦ ◦&lt;/span&gt;`;\n  return `&lt;div class=&quot;pcard col&quot;&gt;\n    &lt;div class=&quot;img sketch pimg&quot; style=&quot;position:relative&quot;&gt;&lt;span&gt;Producto&lt;/span&gt;${badge}&lt;span class=&quot;fav&quot;&gt;♡&lt;/span&gt;${galnav}&lt;/div&gt;\n    &lt;div class=&quot;pcat&quot;&gt;Categoría · Vendor&lt;/div&gt;\n    &lt;div class=&quot;pname&quot;&gt;Nombre del producto&lt;/div&gt;\n    &lt;div class=&quot;pswrow&quot;&gt;${sw}&lt;span class=&quot;tiny&quot; style=&quot;margin-left:2px&quot;&gt;+2&lt;/span&gt;&lt;/div&gt;\n    &lt;div class=&quot;row between&quot; style=&quot;margin-top:5px&quot;&gt;&lt;span class=&quot;pprice&quot;&gt;${PRICES[i]}&lt;/span&gt;&lt;span class=&quot;stars&quot;${mobile?' style=&quot;font-size:12px&quot;':''}&gt;${STARS[i]}&lt;/span&gt;&lt;/div&gt;\n    &lt;div class=&quot;pdesc&quot;&gt;${mobile?'Descripción breve del producto.':'Descripción breve: material, uso u ocasión.'}&lt;/div&gt;\n    &lt;span class=&quot;btn sm full&quot; style=&quot;margin-top:6px&quot;&gt;+ Quick add&lt;/span&gt;\n  &lt;/div&gt;`;\n}\nconst promo=`&lt;div class=&quot;promotile&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Editorial&lt;/div&gt;&lt;div class=&quot;h h3&quot;&gt;Lookbook de temporada&lt;/div&gt;&lt;span class=&quot;tiny&quot; style=&quot;color:#cfcfcf&quot;&gt;Inspírate y arma el look →&lt;/span&gt;&lt;/div&gt;`;\n// desktop: 8 cards + promo in the middle\nlet gd=''; for(let i=0;i&lt;8;i++){ gd+=card(i,false); if(i===4) gd+=promo; }\nconst gridD=document.getElementById('grid-d'); if(gridD) gridD.innerHTML=gd;\n// mobile: 6 cards + promo\nlet gm=''; for(let i=0;i&lt;6;i++){ gm+=card(i,true); if(i===3) gm+=promo; }\nconst gridM=document.getElementById('grid-m'); if(gridM) gridM.innerHTML=gm;\n\n/* modules */\nconst MODS=[\n {n:1,name:'Announcement bar',tag:'announcement-bar.liquid',purpose:'Misma barra del home.',s:['mensaje','*múltiples mensajes*','link','color','mostrar/ocultar']},\n {n:2,name:'Header + breadcrumb',tag:'header.liquid',purpose:'Header sticky con miga de pan.',s:['menú','*sticky*','*breadcrumb on/off*','búsqueda','carrito']},\n {n:3,name:'Collection banner',tag:'main-collection-banner.liquid',purpose:'Mini-hero: social proof + título + 3 bullets, sin CTA.',s:['*mostrar título/imagen*','*social proof*','*bullets (blocks)*','imagen desktop/mobile','altura','color fondo']},\n {n:4,name:'Collection tabs',tag:'collection-tabs.liquid',purpose:'Navegación entre sub-colecciones.',s:['*colecciones (blocks)*','*colección activa*','scroll mobile','alineación']},\n {n:5,name:'Toolbar (sort + filtros)',tag:'facets.liquid',purpose:'Conteo, &quot;ordenar por&quot; y chips de filtros activos.',s:['*orden por defecto*','*opciones de orden*','*sticky on/off*','mostrar conteo','chips activos']},\n {n:6,name:'Product grid + filters',tag:'main-collection-product-grid.liquid',purpose:'Facetas nativas + grid de product cards.',s:['*filtros (facets)*','*columnas desktop/mobile*','*card: swatches/badge/rating*','*quick add*','*wishlist*','*quick view*','imagen ratio']},\n {n:'+',name:'Promo tile (opcional)',tag:'grid-promo-block.liquid',purpose:'Bloque editorial/oferta dentro del grid.',s:['*activar/desactivar*','*posición en el grid*','imagen','headline','CTA link']},\n {n:7,name:'Pagination / load more',tag:'pagination.liquid',purpose:'&quot;Cargar más&quot; + progreso.',s:['*tipo (paginación/cargar más/infinite)*','por página','mostrar contador']},\n {n:8,name:'Trust bar',tag:'icon-benefits.liquid',purpose:'Reaseguro de envío/cambios/pago/rating.',s:['bloques (icono+texto)','columnas','color fondo']},\n {n:9,name:'Recommended / recently viewed',tag:'related-products.liquid',purpose:'Recomendados o vistos recientemente.',s:['*fuente (IA/recently viewed)*','nº productos','columnas/carrusel','título']},\n {n:10,name:'Collection text (SEO)',tag:'collection-description.liquid',purpose:'Texto colapsable de colección.',s:['rich text','*colapsado por defecto*','posición (arriba/abajo)']},\n {n:11,name:'Footer',tag:'footer.liquid',purpose:'Mismo footer del home.',s:['menús','newsletter','redes','pagos','legal']},\n];\nconst grid=document.getElementById('modgrid');\ngrid.innerHTML=MODS.map(m=&gt;`\n &lt;div class=&quot;mod sketch&quot;&gt;\n   &lt;div class=&quot;mh&quot;&gt;&lt;span class=&quot;mn&quot;&gt;${m.n}&lt;/span&gt;&lt;div&gt;&lt;h3&gt;${m.name}&lt;/h3&gt;&lt;span class=&quot;mtag&quot;&gt;${m.tag}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\n   &lt;p class=&quot;purpose&quot;&gt;${m.purpose}&lt;/p&gt;\n   &lt;p class=&quot;slabel&quot;&gt;Settings&lt;/p&gt;\n   &lt;ul&gt;${m.s.map(x=&gt;{const b=x.startsWith('*');const t=x.replace(/\\*/g,'');return `&lt;li class=&quot;${b?'blk':''}&quot;&gt;${t}&lt;/li&gt;`;}).join('')}&lt;/ul&gt;\n &lt;/div&gt;`).join('');\n\nsetView(localStorage.getItem('plp_view')||'desktop');\napplyToggles();\n&lt;/script&gt;\n\n&lt;template id=&quot;__bundler_thumbnail&quot;&gt;\n&lt;svg viewBox=&quot;0 0 100 100&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;&lt;rect width=&quot;100&quot; height=&quot;100&quot; fill=&quot;#f4f3ef&quot;/&gt;&lt;g stroke=&quot;#3a3a3a&quot; stroke-width=&quot;2.4&quot; fill=&quot;none&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;26&quot; width=&quot;16&quot; height=&quot;48&quot; rx=&quot;3&quot;/&gt;&lt;rect x=&quot;42&quot; y=&quot;26&quot; width=&quot;17&quot; height=&quot;22&quot; rx=&quot;2&quot; fill=&quot;#e9e8e4&quot;/&gt;&lt;rect x=&quot;63&quot; y=&quot;26&quot; width=&quot;17&quot; height=&quot;22&quot; rx=&quot;2&quot; fill=&quot;#e9e8e4&quot;/&gt;&lt;rect x=&quot;42&quot; y=&quot;52&quot; width=&quot;17&quot; height=&quot;22&quot; rx=&quot;2&quot; fill=&quot;#e9e8e4&quot;/&gt;&lt;rect x=&quot;63&quot; y=&quot;52&quot; width=&quot;17&quot; height=&quot;22&quot; rx=&quot;2&quot; fill=&quot;#e9e8e4&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;\n&lt;/template&gt;\n\n&lt;/body&gt;\n&lt;/html&gt;\n\">\u003c/iframe>\u003c/div>\u003c/section>\u003csection class=\"view\" data-view=\"3\">\u003cdiv class=\"vhead\">\u003cdiv class=\"vh-l\">\u003cspan class=\"vnum\">04\u003c/span>\u003cdiv>\u003ch2>Página de producto\u003c/h2>\u003cp>La ficha de un producto: fotos, precio, tallas, botón de compra, envíos, reseñas y productos relacionados.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"vbody\">\u003ciframe loading=\"lazy\" title=\"Página de producto\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;es&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;Product Page — Wireframe&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;style&gt;/* ============================================================\n   Low-fi wireframe system — Excalidraw / hand-drawn vibe\n   Grayscale wireframe + single accent for CRO sticky-notes\n   ============================================================ */\n\n:root{\n  --canvas:#f4f3ef;\n  --paper:#ffffff;\n  --ink:#2b2b2b;\n  --stroke:#3a3a3a;\n  --stroke-soft:#8c8c8c;\n  --fill:#e9e8e4;\n  --fill-2:#dedcd6;\n  --muted:#9a9a96;\n  --note:#fff3bf;        /* sticky note */\n  --note-ink:#5b4b00;\n  --note-edge:#e2cf6b;\n  --accent:#1971c2;      /* arrows / pin */\n  --r:7px;\n}\n\n*{box-sizing:border-box;}\nhtml,body{margin:0;padding:0;}\nbody{\n  background:var(--canvas);\n  color:var(--ink);\n  font-family:'Kalam', 'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Sans MS', cursive;\n  -webkit-font-smoothing:antialiased;\n  /* faint grid like a sketch canvas */\n  background-image:\n    linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(0,0,0,.025) 1px, transparent 1px);\n  background-size:26px 26px;\n}\n\n/* ---------- hand-drawn border via displacement filter ---------- */\n.sketch{position:relative;}\n.sketch::before{\n  content:&quot;&quot;;\n  position:absolute; inset:0;\n  border:1.7px solid var(--stroke);\n  border-radius:9px 7px 10px 8px / 8px 10px 7px 9px;\n  filter:url(#rough);\n  pointer-events:none;\n}\n.sketch.soft::before{border-color:var(--stroke-soft);}\n.sketch.dash::before{border-style:dashed;}\n\n/* ---------- image placeholder ---------- */\n.img{\n  background:var(--fill);\n  background-image:\n    linear-gradient(to top right, transparent calc(50% - .9px), var(--stroke-soft) calc(50% - .9px), var(--stroke-soft) calc(50% + .9px), transparent calc(50% + .9px)),\n    linear-gradient(to top left,  transparent calc(50% - .9px), var(--stroke-soft) calc(50% - .9px), var(--stroke-soft) calc(50% + .9px), transparent calc(50% + .9px));\n  display:flex; align-items:center; justify-content:center;\n  color:var(--muted); font-size:13px; letter-spacing:.5px;\n  min-height:60px; overflow:hidden;\n}\n.img span{background:var(--fill); padding:2px 8px; border-radius:4px;}\n.img.tall{min-height:240px;}\n\n/* ---------- text placeholders ---------- */\n.bar{height:9px;background:var(--fill-2);border-radius:6px;margin:7px 0;}\n.bar.dark{background:#cfcdc6;}\n.h{font-weight:700;line-height:1.12;color:var(--ink);}\n.h1{font-size:30px;}\n.h2{font-size:22px;}\n.h3{font-size:17px;}\n.sub{font-size:14px;color:#6b6b67;line-height:1.3;}\n.tiny{font-size:12px;color:var(--muted);}\n.kicker{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}\n\n/* ---------- buttons ---------- */\n.btn{\n  display:inline-flex;align-items:center;gap:6px;justify-content:center;\n  background:var(--stroke);color:#fff;font-family:inherit;font-size:14px;font-weight:700;\n  padding:10px 18px;border-radius:8px 10px 9px 11px / 11px 9px 10px 8px;\n  position:relative;white-space:nowrap;\n}\n.btn.o{background:transparent;color:var(--ink);}\n.btn.o::before{\n  content:&quot;&quot;;position:absolute;inset:0;border:1.7px solid var(--stroke);\n  border-radius:inherit;filter:url(#rough);\n}\n.btn.sm{padding:6px 12px;font-size:12px;}\n.btn.full{display:flex;width:100%;}\n\n/* ---------- pills / badges / chips ---------- */\n.badge{\n  display:inline-block;font-size:11px;font-weight:700;color:var(--ink);\n  background:var(--paper);padding:3px 9px;border-radius:20px;position:relative;\n}\n.badge::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px solid var(--stroke);border-radius:20px;filter:url(#rough);}\n.chip{\n  display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);\n  background:var(--paper);padding:7px 13px;border-radius:20px;position:relative;white-space:nowrap;\n}\n.chip::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:20px;filter:url(#rough);}\n\n/* ---------- icon placeholder ---------- */\n.ico{\n  width:42px;height:42px;border-radius:50%;background:var(--fill);\n  display:flex;align-items:center;justify-content:center;color:var(--stroke-soft);\n  font-size:18px;position:relative;flex:0 0 auto;\n}\n.ico::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.stars{color:#3a3a3a;letter-spacing:2px;font-size:14px;}\n\n/* ---------- generic blocks ---------- */\n.card{background:var(--paper);padding:12px;border-radius:var(--r);position:relative;}\n.row{display:flex;gap:14px;}\n.col{display:flex;flex-direction:column;}\n.center{align-items:center;text-align:center;}\n.between{justify-content:space-between;align-items:center;}\n.wrap{flex-wrap:wrap;}\n.grow{flex:1 1 0;min-width:0;}\n\n/* ============================================================\n   DEVICE FRAMES\n   ============================================================ */\n.stage{\n  display:flex;flex-direction:column;align-items:center;\n  padding:30px 470px 120px 40px;   /* right padding leaves room for notes */\n}\n@media(max-width:1180px){ .stage{padding-right:40px;} .note{display:none!important;} }\n\n.devwrap{position:relative;}\n\n/* browser chrome (desktop) */\n.browser{width:980px;max-width:100%;background:var(--paper);position:relative;border-radius:12px;}\n.browser&gt;.chrome{\n  height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;\n  border-bottom:1.6px solid var(--fill-2);\n}\n.dot{width:11px;height:11px;border-radius:50%;background:var(--fill-2);}\n.urlbar{flex:1;height:20px;background:var(--fill);border-radius:20px;margin-left:10px;}\n\n/* phone chrome (mobile) */\n.phone{width:392px;max-width:100%;background:var(--paper);position:relative;border-radius:34px;padding:12px;}\n.phone::before{content:&quot;&quot;;position:absolute;inset:0;border:2px solid var(--stroke);border-radius:34px;filter:url(#rough);}\n.phone .screen{border-radius:24px;overflow:hidden;background:var(--paper);position:relative;}\n.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:120px;height:18px;background:var(--stroke);border-radius:20px;z-index:5;}\n\n/* a screen section */\n.section{position:relative;padding:16px;border-bottom:1.4px dashed #e2e0da;}\n.section:last-child{border-bottom:none;}\n.section .secno{\n  position:absolute;left:-13px;top:12px;width:26px;height:26px;border-radius:50%;\n  background:var(--accent);color:#fff;font-size:13px;font-weight:700;\n  display:flex;align-items:center;justify-content:center;z-index:6;\n  box-shadow:0 1px 0 rgba(0,0,0,.15);\n}\n.phone .section .secno{left:-2px;}\n\n/* ---------- CRO sticky notes ---------- */\n.note{\n  position:absolute;left:100%;top:8px;margin-left:54px;width:360px;\n  background:var(--note);color:var(--note-ink);\n  padding:13px 15px 14px;border-radius:3px;\n  box-shadow:2px 3px 0 rgba(0,0,0,.10);\n  transform:rotate(var(--rot,-.5deg)) translateY(var(--ty,0px));font-size:14px;line-height:1.34;\n}\n.note:nth-child(even){--rot:.6deg;}\n.note::before{ /* arrow toward the section */\n  content:&quot;&quot;;position:absolute;right:100%;top:18px;\n  border:9px solid transparent;border-right-color:var(--note);\n  filter:drop-shadow(-1px 1px 0 rgba(0,0,0,.06));\n}\n.note .nt{font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8a6d00;display:block;margin-bottom:3px;}\n.note .obj{display:block;margin-top:7px;font-size:12.5px;color:#6b5600;border-top:1px dashed var(--note-edge);padding-top:6px;}\n.note .obj b{color:#4d3d00;}\n.phone .note{margin-left:46px;}\n\n/* connector pin dot on the section for mobile notes spacing */\n\n/* ---------- layout helpers for content ---------- */\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\n.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}\n.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}\n.scrollrow{display:flex;gap:12px;overflow:hidden;}\n.scrollrow&gt;*{flex:0 0 auto;}\n\n/* announcement bar */\n.annbar{background:var(--stroke);color:#fff;text-align:center;font-size:12px;letter-spacing:1px;padding:8px;display:flex;align-items:center;justify-content:center;gap:14px;}\n.annbar .ar{opacity:.6;}\n\n/* header */\n.hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 2px;}\n.logo{font-weight:700;font-size:18px;letter-spacing:1px;}\n.nav{display:flex;gap:16px;font-size:13px;color:#555;}\n\n/* product card */\n.pcard .pimg{aspect-ratio:3/4;}\n.pcard .pcat{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-top:8px;}\n.pcard .pname{font-size:13px;margin-top:2px;}\n.pcard .pprice{font-size:13px;font-weight:700;}\n.pcard .pdesc{font-size:11.5px;color:#7a7a76;line-height:1.3;margin-top:5px;}\n\n/* press logos strip */\n.logoph{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:19px;letter-spacing:1px;color:#8a8a86;}\n.section.opt .secno{background:transparent;color:var(--accent);border:1.6px dashed var(--accent);width:auto;min-width:26px;padding:0 7px;border-radius:13px;font-size:10px;letter-spacing:.5px;}\nbody.mono .section.opt .secno{color:#555;border-color:#888;}\n\n/* featured product under UGC video */\n.miniprod{display:flex;align-items:center;gap:8px;padding:7px;margin-top:8px;background:var(--paper);border-radius:7px;}\n.miniprod .mp-img{width:34px;height:34px;flex:0 0 auto;}\n.miniprod .mp-name{font-size:12px;font-weight:700;color:#2b2b2b;line-height:1.1;}\n\n/* collection tabs (inside a wireframe section) */\n.wtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}\n.wtab{\n  font-family:inherit;font-size:13px;cursor:pointer;background:var(--paper);\n  color:#666;padding:6px 13px;border-radius:20px;position:relative;white-space:nowrap;\n}\n.wtab::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid var(--stroke-soft);border-radius:20px;filter:url(#rough);}\n.wtab.on{color:var(--ink);font-weight:700;background:var(--stroke);color:#fff;}\n.wtab.on::before{border-color:var(--stroke);}\n.wtab.scroll{overflow-x:auto;}\n.tabpane:not(.on){display:none!important;}\n\n/* hero variant helpers */\n.btn.inv{background:#fff;color:#2b2b2b;}\n.checklist{display:flex;flex-direction:column;gap:8px;}\n.ck{display:flex;gap:8px;align-items:center;font-size:14px;}\n.ck-mark{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--fill-2);color:#444;flex:0 0 auto;}\n.avstack{display:flex;align-items:center;}\n.avstack .av{width:26px;height:26px;border-radius:50%;background:var(--fill-2);border:2px solid #fff;margin-left:-8px;position:relative;}\n.avstack .av:first-child{margin-left:0;}\n.darkhero{background:#2f2f2f;color:#fff;border-radius:10px;overflow:hidden;position:relative;}\n.darkhero .kicker,.darkhero .sub,.darkhero .tiny{color:#c9c9c9;}\n.darkhero .chip{color:#fff;background:rgba(255,255,255,.06);}\n.darkhero .chip::before{border-color:#7d7d7d;}\n.darkhero .ck-mark{background:rgba(255,255,255,.2);color:#fff;}\n.darkhero .img{background:#3a3a3a;}\n.darkhero .img span{background:#3a3a3a;color:#9a9a9a;}\n.darkhero .av{border-color:#2f2f2f;background:#5a5a5a;}\n\n/* ============================================================\n   TOP CONTROL BAR + VIEWS\n   ============================================================ */\n.topbar{\n  position:sticky;top:0;z-index:50;background:rgba(244,243,239,.92);\n  backdrop-filter:blur(4px);border-bottom:1.5px solid #e2e0da;\n  display:flex;align-items:center;gap:14px;padding:11px 22px;flex-wrap:wrap;\n}\n.topbar .title{font-weight:700;font-size:17px;}\n.topbar .title small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.5px;}\n.tabs{display:flex;gap:6px;margin-left:6px;}\n.tab{\n  font-family:inherit;font-size:14px;cursor:pointer;background:transparent;\n  padding:7px 15px;border-radius:8px;position:relative;color:#555;\n}\n.tab::before{content:&quot;&quot;;position:absolute;inset:0;border:1.6px solid transparent;border-radius:8px;filter:url(#rough);}\n.tab.active{color:var(--ink);font-weight:700;background:var(--paper);}\n.tab.active::before{border-color:var(--stroke);}\n.spacer{flex:1;}\n.toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:#555;cursor:pointer;user-select:none;}\n.toggle input{width:34px;height:19px;appearance:none;background:var(--fill-2);border-radius:20px;position:relative;cursor:pointer;outline:none;transition:.15s;}\n.toggle input:checked{background:var(--accent);}\n.toggle input::after{content:&quot;&quot;;position:absolute;top:2px;left:2px;width:15px;height:15px;background:#fff;border-radius:50%;transition:.15s;}\n.toggle input:checked::after{left:17px;}\n\n.view{display:none;}\n.view.active{display:block;}\n\n/* color-off (pure grayscale) */\nbody.mono{--accent:#3a3a3a;--note:#ececec;--note-ink:#333;--note-edge:#cfcfcf;}\nbody.mono .note .nt{color:#444;}\nbody.mono .note .obj,body.mono .note .obj b{color:#555;}\n\n/* hide notes toggle */\nbody.nonotes .note{display:none;}\nbody.nonotes .stage{padding-right:40px;}\n\n/* ============================================================\n   SHOPIFY MODULES SHEET\n   ============================================================ */\n.sheet{max-width:1080px;margin:0 auto;padding:34px 30px 120px;}\n.sheet h2{font-size:26px;margin:0 0 6px;}\n.sheet .lead{color:#6b6b67;font-size:15px;margin:0 0 26px;max-width:680px;}\n.modgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}\n@media(max-width:760px){.modgrid{grid-template-columns:1fr;}}\n.mod{background:var(--paper);border-radius:10px;padding:16px 18px;position:relative;}\n.mod&gt;.mh{display:flex;align-items:center;gap:10px;margin-bottom:9px;}\n.mod .mn{min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}\n.mod h3{font-size:16px;margin:0;}\n.mod .mtag{font-size:11px;color:var(--muted);}\n.mod .purpose{font-size:13px;color:#6b6b67; :#555;z-index:2;opacity:0;transition:opacity .15s;}\n.pimg .garrow::before{content:&quot;&quot;;position:absolute;inset:0;border:1.5px solid var(--stroke-soft);border-radius:50%;filter:url(#rough);}\n.pimg .garrow.l{left:7px;}\n.pimg .garrow.r{right:7px;}\n.pcard:hover .pimg .garrow{opacity:1;}\n.pimg .gdots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:#fff;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.4);}\n.pimg .ghint{position:absolute;bottom:8px;right:8px;font-size:9px;color:#777;background:var(--paper);padding:1px 6px;border-radius:8px;z-index:2;}\n\n/* promo tile inside grid */\n.promotile{background:#2f2f2f;color:#fff;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:18px;min-height:200px;position:relative;}\n.promotile .kicker{color:#bdbdbd;}\n.promotile .h{color:#fff;}\n\n/* pagination */\n.loadmore{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0;}\n.pdots{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:13px;}\n\n/* SEO collapsible */\n.seo{padding:14px 0;}\n.seo .barwrap{max-width:760px;}\n\n/* ============================================================\n   PRODUCT PAGE (PDP)\n   ============================================================ */\n.gallery{display:flex;gap:12px;}\n.gthumbs{display:flex;flex-direction:column;gap:9px;width:62px;flex:0 0 auto;}\n.gthumb{aspect-ratio:1;}\n.gthumb.on::before{border-width:2.4px;border-color:var(--stroke);}\n.gmain{flex:1 1 0;min-width:0;aspect-ratio:4/5;position:relative;}\n.buybox{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:13px;}\n.price{display:flex;align-items:center;gap:9px;}\n.price .now{font-size:25px;font-weight:700;}\n.price .was{font-size:15px;color:var(--muted);text-decoration:line-through;}\n.price .off{font-size:11px;font-weight:700;background:var(--stroke);color:#fff;padding:3px 8px;border-radius:5px;}\n.optlabel{font-size:12px;letter- ottom=r.top+ty+r.height;});\n}\nlet rT;function scheduleLayout(){clearTimeout(rT);rT=setTimeout(layoutNotes,60);}\nwindow.addEventListener('resize',scheduleLayout);\nwindow.addEventListener('load',layoutNotes);\nif(document.fonts&amp;&amp;document.fonts.ready)document.fonts.ready.then(layoutNotes);\nsetTimeout(layoutNotes,300);\n\n/* auto-number sections (skip optional .opt) */\nfunction numberSections(){\n  ['#view-desktop','#view-mobile'].forEach(v=&gt;{\n    const c=document.querySelector(v); if(!c) return;\n    let i=0;\n    c.querySelectorAll('.section').forEach(s=&gt;{\n      const b=s.querySelector('.secno'); if(!b) return;\n      if(s.classList.contains('opt')) return;\n      i++; b.textContent=i;\n    });\n  });\n}\n\nconst MODS=[\n {n:1,name:'Announcement bar',tag:'announcement-bar.liquid',purpose:'Misma barra del home.',s:['mensaje','*múltiples mensajes*','link','color','mostrar/ocultar']},\n {n:2,name:'Header + breadcrumb',tag:'header.liquid',purpose:'Header sticky con miga de pan.',s:['menú','*sticky*','*breadcrumb*','búsqueda','carrito']},\n {n:3,name:'Product purchase block (gallery + buy box)',tag:'main-product.liquid',purpose:'Galería + buy box: nombre, reviews, precio/descuento, variantes, CTA, métodos de pago y badges de confianza.',s:['*galería (zoom/video/thumbs)*','*precio + compare-at + %*','*variantes (color/talla swatches)*','*guía de tallas*','*urgencia stock*','*botón ATC*','*express checkout (Shop Pay/PayPal)*','*pagos a plazos*','*métodos de pago + badges*','*acordeones (blocks)*']},\n {n:4,name:'Frequently bought together',tag:'product-bundle.liquid',purpose:'Cross-sell de complementos justo debajo de la info del producto, con descuento por set.',s:['*productos del set (blocks)*','*checkboxes*','*descuento por set*','CTA agregar seleccionados']},\n {n:5,name:'Trust bar',tag:'icon-benefits.liquid',purpose:'Envío seguro, cambios fáciles, pago protegido, calidad garantizada.',s:['bloques (icono+texto)','columnas','color fondo']},\n {n:6,na
